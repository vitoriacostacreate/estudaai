<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>estudaai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Mundo único escuro, herdado do "Loop em Casa": azul-noite, cartões em camadas, acentos pastel por tema */
  --bg:#0e1320; --s1:#161c2b; --s2:#1d2436; --s3:#262f45; --line:#2b3550;
  --tx:#e9edf7; --mu:#9aa4be; --ac:#7f9cff; --ac2:#a98bf0;
  --ok:#5fd38d; --warn:#f2a35b; --bad:#ff7d86; --teal:#35c9bd;
  --fd:"Plus Jakarta Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --fb:"Figtree",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--fd);line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--ac)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* topo */
.top{position:sticky;top:0;z-index:20;background:rgba(14,19,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:800;font-size:20px;text-decoration:none;color:var(--tx)}
.logo .bars{display:flex;gap:3px;align-items:flex-end;height:22px}
.logo .bars i{display:block;width:6px;border-radius:3px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;color:var(--mu);text-decoration:none;font-weight:600}
nav.tabs a:hover{color:var(--tx);background:var(--s1)}
nav.tabs a.on{color:var(--ac);background:#1c2748}
nav.tabs svg{width:18px;height:18px}
.chipbar{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.chip b{color:var(--tx)}

main{max-width:1180px;margin:0 auto;padding:24px 16px 80px;display:grid;gap:22px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.eyebrow{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:700}
.sub{color:var(--mu)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* botões */
a.btn{text-decoration:none;display:inline-block}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;background:var(--s3);transition:transform .12s,background .12s}
.btn:hover{transform:translateY(-1px);background:#2f3953}
.btn.pri{background:var(--ac);color:#0b1020}
.btn.pri:hover{background:#97afff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 13px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* herói "seu próximo passo" */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(30px,4.4vw,48px);font-weight:800;margin:6px 0 8px}
.go{display:flex;align-items:center;justify-content:space-between;gap:18px;width:100%;max-width:520px;margin-top:22px;padding:22px 26px;border-radius:999px;border:0;background:var(--ac);color:#0b1020;font-weight:700;font-size:18px;text-align:left;transition:transform .15s}
.go:hover{transform:scale(1.015)}
.go svg{width:54px;height:54px;flex:none}
.plano{display:grid;gap:10px}
.passo{display:flex;gap:14px;align-items:center;padding:13px 15px;border-radius:14px;background:var(--s2);border:1px solid var(--line);text-align:left;width:100%}
.passo .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--fd);background:var(--s3)}
.passo.feito{opacity:.6}
.passo.feito .n{background:var(--ok);color:#0b1020}
.passo.atual{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.passo small{display:block;color:var(--mu)}
.vis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:18px;border-radius:16px;background:var(--s2)}
.vis i{display:block;height:34px;border-radius:9px}

/* temas */
.tema{position:relative;display:grid;gap:10px;text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:20px;overflow:hidden;transition:transform .15s,border-color .15s}
.tema:hover{transform:translateY(-2px);border-color:var(--c)}
.tema .stripe{position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.tema h3{font-size:20px}
.ringw{display:flex;align-items:center;gap:14px}
.bar{height:9px;border-radius:9px;background:var(--s3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--c,var(--ac))}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--s3);color:var(--mu)}
.pill.ok{background:rgba(95,211,141,.15);color:var(--ok)}
.pill.med{background:rgba(242,163,91,.15);color:var(--warn)}
.pill.bad{background:rgba(255,125,134,.15);color:var(--bad)}
.pill.ac{background:rgba(127,156,255,.15);color:var(--ac)}

/* trilha */
.disc{display:grid;gap:12px}
.disc h3{font-size:17px;display:flex;align-items:center;gap:8px}
.disc h3 i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.trilha{display:flex;flex-wrap:wrap;gap:10px;position:relative}
.no{display:flex;gap:10px;align-items:center;text-align:left;min-width:220px;flex:1 1 240px;max-width:380px;padding:11px 13px;border-radius:14px;background:var(--s2);border:1px solid var(--line);transition:border-color .12s}
.no:hover{border-color:var(--c)}
.no .dot{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--s3);color:var(--mu)}
.no.estudado .dot{background:#2a3d73;color:var(--ac)}
.no.revisar .dot{background:rgba(242,163,91,.22);color:var(--warn)}
.no.dominado .dot{background:rgba(95,211,141,.2);color:var(--ok)}
.no .t{font-size:14px;line-height:1.3}
.no .t small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.estrela{color:var(--warn);font-size:11px;letter-spacing:1px}

/* aula */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--s1);padding:8px 13px;border-radius:999px;font-weight:600;color:var(--mu);font-size:14px}
.steps button.on{color:#0b1020;background:var(--c);border-color:var(--c)}
.steps button.ok{color:var(--ok)}
.steps button span{font-family:var(--fd);font-weight:800}
.aulah{display:grid;gap:8px}
.aulah h1{font-size:clamp(26px,3.6vw,38px)}
.ideia{font-size:19px;border-left:5px solid var(--c);padding:6px 0 6px 16px;color:#d5dbea;max-width:70ch}
.conteudo{display:grid;gap:16px;max-width:860px}
.conteudo h3{font-size:19px;margin-bottom:8px}
.conteudo p,.conteudo li{max-width:72ch}
.bloco{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.tab{border-collapse:collapse;width:100%;font-size:15px;display:block;overflow-x:auto}
.tab th,.tab td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tab th{color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.dica{background:rgba(242,163,91,.1);border-left:4px solid var(--warn);padding:10px 14px;border-radius:0 10px 10px 0}
.pratica{background:rgba(53,201,189,.1);border-left:4px solid var(--teal);padding:10px 14px 10px 30px;border-radius:0 10px 10px 0}
p.pratica{padding-left:14px}
.grande{font-family:var(--fd);font-size:26px;font-weight:800;letter-spacing:.06em;color:var(--c)}
kbd{background:var(--s3);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;font-family:ui-monospace,monospace;font-size:13px}
.fluxo,.linha,.ciclo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.fluxo span,.linha span,.ciclo span{background:var(--s3);padding:8px 12px;border-radius:12px;font-size:14px;position:relative}
.fluxo span:not(:last-child)::after,.linha span:not(:last-child)::after,.ciclo span::after{content:"→";margin-left:10px;color:var(--c)}
.ciclo span:last-child::after{content:"↺"}

/* mapa mental */
.mapa{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;position:relative}
.mapa .raiz{grid-column:1/-1;justify-self:center;font-family:var(--fd);font-weight:800;font-size:22px;padding:14px 26px;border-radius:999px;background:var(--c);color:#0b1020}
.ramo{border-radius:16px;background:var(--s1);border:1px solid var(--line);border-top:5px solid var(--rc);padding:14px 16px}
.ramo b{font-family:var(--fd);display:block;margin-bottom:6px}
.ramo ul{margin:0;padding-left:18px;color:#cfd5e6;font-size:14.5px}
.oculto .ramo ul{filter:blur(6px);user-select:none}

/* recuperação */
.lembre{display:grid;gap:12px;max-width:820px}
.lembre label{font-weight:600}
textarea,input[type=text],select{width:100%;background:var(--s2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 13px;font:inherit}
textarea{min-height:76px;resize:vertical}

/* quiz */
.q{display:grid;gap:10px;max-width:780px}
.q h3{font-size:20px}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border-radius:14px;background:var(--s2);border:1px solid var(--line);font-size:16px}
.opt:hover{border-color:var(--ac)}
.opt.certa{border-color:var(--ok);background:rgba(95,211,141,.12)}
.opt.errada{border-color:var(--bad);background:rgba(255,125,134,.12)}
.exp{padding:12px 15px;border-radius:12px;background:var(--s2)}
.placar{display:flex;gap:6px}
.placar i{width:28px;height:8px;border-radius:5px;background:var(--s3)}
.placar i.c{background:var(--ok)}.placar i.e{background:var(--bad)}

/* flashcards */
.fc{min-height:250px;display:grid;place-items:center;text-align:center;padding:30px;border-radius:22px;background:var(--s2);border:1px solid var(--line);font-size:21px;max-width:760px;margin:0 auto;width:100%}
.fc .verso{border-top:1px solid var(--line);margin-top:18px;padding-top:18px;font-size:17px;color:#d6dcec}
.notas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:760px;margin:0 auto;width:100%}
.notas .btn small{display:block;font-weight:500;font-size:12px;opacity:.75}

/* widgets */
.wid{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px}
.wid h3{font-size:18px}
.tv td,.tv th{text-align:center}
.tv button{width:44px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--s3);font-weight:800}
.tv button.V{color:var(--ok)}.tv button.F{color:var(--bad)}
.tv button.certo{box-shadow:0 0 0 2px var(--ok)}.tv button.erro{box-shadow:0 0 0 2px var(--bad)}
.par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.par .col{display:grid;gap:8px;align-content:start}
.par button{text-align:left;padding:11px 13px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:14.5px}
.par button.sel{border-color:var(--ac);background:#1c2748}
.par button.ok{border-color:var(--ok);background:rgba(95,211,141,.12);color:var(--ok);cursor:default}
.par button.no{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ord{display:flex;flex-wrap:wrap;gap:8px}
.ord button{padding:10px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.ord button.usado{opacity:.3}
.resposta{display:grid;gap:6px;counter-reset:n}
.resposta div{padding:9px 13px;border-radius:10px;background:var(--s3);counter-increment:n}
.resposta div::before{content:counter(n) ". ";font-weight:800;color:var(--c)}
.resposta div.ok{background:rgba(95,211,141,.14)}.resposta div.no{background:rgba(255,125,134,.14)}
.piano{position:relative;height:150px;user-select:none;overflow-x:auto}
.piano .k{position:absolute;top:0;border:1px solid #0b0f19;border-radius:0 0 8px 8px;display:flex;align-items:flex-end;justify-content:center;font-size:11px;padding-bottom:6px;font-weight:700}
.piano .w{background:#eef1f8;color:#58607a;height:150px;z-index:1}
.piano .b{background:#151a27;color:#9aa4be;height:92px;z-index:2}
.piano .k.hi.w{background:#b7c6ff;color:#0b1020}
.piano .k.hi.b{background:#5a76e0;color:#fff}
.piano .k.on{background:var(--warn)!important;color:#0b1020!important}
.seq{display:grid;gap:7px;overflow-x:auto}
.seq .linha{display:grid;grid-template-columns:70px repeat(16,minmax(26px,1fr));gap:5px;align-items:center}
.seq .linha b{font-size:13px;color:var(--mu)}
.seq .st{height:34px;border-radius:8px;border:0;background:var(--s3)}
.seq .st:nth-child(4n+2){background:#2f3a56}
.seq .st.on{background:var(--rc)}
.seq .st.cur{outline:2px solid #fff;outline-offset:-2px}
.cordas{display:flex;flex-wrap:wrap;gap:8px}
.cordas button{min-width:56px;padding:9px 12px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-weight:800;font-family:var(--fd)}
.cordas button.on{background:var(--c);color:#0b1020;border-color:var(--c)}
.met{display:flex;gap:12px;justify-content:center}
.met i{width:46px;height:46px;border-radius:50%;background:var(--s3);transition:background .05s}
.met i.on{background:var(--teal)}.met i.on.um{background:var(--warn)}
.cam{display:grid;gap:8px}
.cam button{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--cc);color:#0b1020;font-weight:700;transition:transform .12s}
.cam button.sel{transform:translateX(10px);box-shadow:0 0 0 3px #fff}
.letra{font-family:var(--fd);font-size:110px;font-weight:800;text-align:center;line-height:1;color:var(--c)}
canvas{max-width:100%;background:var(--s2);border-radius:12px}
input[type=range]{width:100%;accent-color:var(--ac)}

.modal{position:fixed;inset:0;background:rgba(5,8,15,.7);display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{max-width:760px;width:100%;max-height:88vh;overflow:auto;display:grid;gap:14px}
pre.prompt{white-space:pre-wrap;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;max-height:240px;overflow:auto}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;max-width:520px}
.cal i{aspect-ratio:1;border-radius:5px;background:var(--s3)}
.cal i.l1{background:#2b3d73}.cal i.l2{background:#4a63c0}.cal i.l3{background:var(--ac)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--line);padding:11px 18px;border-radius:999px;z-index:60;font-weight:600}
footer{max-width:1180px;margin:0 auto;padding:0 16px 30px;color:var(--mu);font-size:13px}
@media (max-width:820px){.hero{grid-template-columns:1fr}.notas{grid-template-columns:1fr 1fr}.par{grid-template-columns:1fr}.chipbar{margin-left:0}}
</style>
</head>

</div></header>

<script>
"use strict";
/* ============ utilidades ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hojeStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const addDias = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const diasAte = (iso) => Math.ceil((new Date(iso + "T00:00:00") - new Date(hojeStr() + "T00:00:00")) / 864e5);
const fmt = iso => iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) : "";
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const ICON = {
  inicio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  temas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
  revisar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="14" height="14" rx="3"/><path d="M7 3h11a3 3 0 0 1 3 3v11"/></svg>',
  novo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  biblioteca: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h5v16H4zM10 4h4v16h-4z"/><path d="M15.5 4.6l3.9-1 3.6 15.5-3.9 1z"/></svg>',
  progresso: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  seta: '<svg viewBox="0 0 64 64" fill="none" stroke="#0b1020" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 32h38M36 16l16 16-16 16"/></svg>'
};

/* ============ estado ============ */
const CHAVE = "estudaai.v1";
let st, MODO = "arquivo", INFO = {}, BIB = { docs: [], temas: [], anexos: {}, aulas: {}, cartoes: [], textos: {} };
let NUVEM = null, ultimoSync = null;   /* modo nuvem: progresso salvo na sua conta Claude e sincronizado entre aparelhos */
const CARDS_BASE = CARDS.slice();
function carregar(doServidor) {
  try { st = doServidor && Object.keys(doServidor).length ? doServidor : (JSON.parse(localStorage.getItem(CHAVE)) || {}); } catch (e) { st = {}; }
  st.top ||= {}; st.cards ||= {}; st.dias ||= {}; st.temasUser ||= []; st.aulasUser ||= {}; st.notas ||= {};
  st.principal ||= "concurso"; st.novos ||= { data: "", n: 0 }; st.hoje ||= { data: "", feitos: [] };
  if (st.hoje.data !== hojeStr()) st.hoje = { data: hojeStr(), feitos: [] };
}
let _salvarT;
function salvar() {
  st._t = Date.now();

/* ============ AULA ============ */
const PASSOS = [["mapa", "Mapa"], ["lembre", "Lembre"], ["aprenda", "Aprenda"], ["pratique", "Pratique"], ["teste", "Teste"], ["explique", "Explique"], ["feito", "Feito"]];
let sessao = {};
function telaAula(app, tid, passo) {

  const t = info.tema; const cor = info.disc.cor || t.cor;
  const passos = PASSOS.filter(p => p[0] !== "pratique" || a.widget);
  const idx = passos.findIndex(p => p[0] === passo); const atual = idx < 0 ? 0 : idx;
  app.style.setProperty("--c", cor);
  const fonte = a.fonte && MODO !== "arquivo" ? `<div class="row"><a class="btn sm ghost" href="${urlPDF(a.fonte.doc, a.fonte.pi)}" target="_blank" rel="noopener">📄 Abrir no PDF (p. ${a.fonte.pi}${a.fonte.pf > a.fonte.pi ? "–" + a.fonte.pf : ""})</a><button class="btn sm ghost" id="trecho">Ler o trecho original</button>${a.auto ? `<button class="btn sm pri" id="melhorar">✨ ${INFO.ia ? "Melhorar com IA" + (MODO === "nuvem" ? " (Claude)" : "") : "Melhorar com IA (copiar pedido)"}</button>` : ""}</div>${a.auto ? `<p class="dica" style="max-width:860px">Aula <b>automática</b>, montada sem IA a partir do PDF: termos-chave, definições e lacunas. Funciona para revisar, mas fica muito mais rica com IA.</p>` : ""}` : "";
  app.innerHTML = `<section class="aulah" style="--c:${cor}"><a href="#tema-${t.id}" class="sub" style="text-decoration:none">← ${esc(t.nome)} · ${esc(info.disc.nome)}</a><h1>${esc(a.titulo)}</h1><p class="ideia">${esc(a.ideia || "")}</p>${fonte}
    <div class="steps" role="tablist">${passos.map((p, i) => `<button role="tab" class="${i === atual ? "on" : ""} ${i < atual ? "ok" : ""}" data-p="${p[0]}" style="--c:${cor}"><span>${i < atual ? "✓" : i + 1}</span>${p[1]}</button>`).join("")}</div></section>
    <section id="corpo" style="--c:${cor}"></section>
    <div class="row" style="justify-content:space-between;max-width:860px">${atual > 0 ? `<button class="btn ghost" id="ant">← ${passos[atual - 1][1]}</button>` : "<span></span>"}${atual < passos.length - 1 ? `<button class="btn pri" id="prox">${passos[atual + 1][1]} →</button>` : ""}</div>`;
  app.querySelectorAll(".steps button").forEach(b => b.onclick = () => location.hash = `aula-${tid}-${b.dataset.p}`);
  if ($("#trecho")) $("#trecho").onclick = async () => { const texto = await textoTopico(tid); abrirModal(`<div class="eyebrow">Trecho original · p. ${a.fonte.pi}–${a.fonte.pf}</div><h2>${esc(a.titulo)}</h2><div style="white-space:pre-wrap;max-width:72ch">${esc(texto)}</div><div class="row"><button class="btn" data-fechar>Fechar</button></div>`); };
  if ($("#melhorar")) $("#melhorar").onclick = () => INFO.ia ? gerarComIA(tid, a, info) : modalGerar(tid);
  if ($("#ant")) $("#ant").onclick = () => location.hash = `aula-${tid}-${passos[atual - 1][0]}`;

function passoMapa(el, a, cor) {

  <div class="mapa" id="mapa"><div class="raiz">${esc(a.mapa.raiz)}</div>${a.mapa.ramos.map((r, i) => `<div class="ramo" style="--rc:${cores[i % cores.length]}"><b>${esc(r[0])}</b><ul>${r[1].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div></div>`;
  $("#esconder").onclick = e => { const m = $("#mapa"); m.classList.toggle("oculto"); e.target.textContent = m.classList.contains("oculto") ? "Mostrar detalhes" : "Esconder detalhes"; };

function passoLembre(el, a, tid) {

  ${a.recupere.map((q, i) => `<div><label for="r${i}">${i + 1}. ${esc(q)}</label><textarea id="r${i}" placeholder="Escreva o que vier à cabeça…">${esc((n.lembre || [])[i] || "")}</textarea></div>`).join("")}</div>`;
  el.querySelectorAll("textarea").forEach((ta, i) => ta.oninput = () => { st.notas[tid] ||= {}; (st.notas[tid].lembre ||= [])[i] = ta.value; salvar(); });
}
function passoTeste(el, a, tid) {

      $("#refazer").onclick = () => { s.quiz = {}; s.qi = 0; desenhar(); }; return;
    }
    const q = qz[i]; const ordem = s["ord" + i] ||= shuffle(q.o.map((_, k) => k));
    el.innerHTML = `<div class="q"><div class="placar">${qz.map((_, k) => `<i class="${s.quiz[k] === true ? "c" : s.quiz[k] === false ? "e" : ""}"></i>`).join("")}</div><span class="eyebrow">Questão ${i + 1} de ${qz.length}</span><h3>${esc(q.q)}</h3>${ordem.map(k => `<button class="opt" data-k="${k}">${esc(q.o[k])}</button>`).join("")}<div id="fb"></div></div>`;

function passoExplique(el, a, tid) {

  app.innerHTML = `<section class="card"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Revisão espaçada</div><h1 style="font-size:32px;margin:6px 0">Cartões de hoje</h1><p class="sub">Responda de cabeça, vire e avalie com sinceridade. Até ${NOVOS_DIA} cartões novos por dia.</p></div>
    <div style="min-width:240px"><label for="filtro" class="sub" style="font-size:13px">Tema</label><select id="filtro"><option value="todos">Todos os temas</option>${temasComCards.map(t => `<option value="${t.id}" ${t.id === filtro ? "selected" : ""}>${esc(t.nome)}</option>`).join("")}</select></div></div></section>

  $("#anki").onclick = () => {
    const linhas = ["#separator:semicolon", "#html:true", "#deck column:3"].concat(cardsDoTema(filtro).map(c => { const t = tema(c.tema); return [c.f, c.v, "estudaai::" + (t ? t.nome.replace(/[^\p{L}\p{N} ]/gu, "").trim() : c.tema)].map(x => String(x).replace(/;/g, ",").replace(/\n/g, " ")).join(";"); }));

function desenharCartao() {

  const t = tema(c.tema);
  box.innerHTML = `<p class="sub" style="text-align:center">${cartaoIdx + 1} de ${filaAtual.length} · <span class="pill" style="color:${t ? t.cor : ""}">${esc(t ? t.nome : c.tema)}</span></p>
    <div class="fc"><div><div>${limparHTML(c.f)}</div>${mostrando ? `<div class="verso">${limparHTML(c.v)}</div>` : ""}</div></div>
    ${mostrando ? `<div class="notas"><button class="btn" data-n="0" style="color:var(--bad)">Errei<small>de novo hoje</small></button><button class="btn" data-n="1" style="color:var(--warn)">Difícil<small>${prevIntervalo(c, 1)}</small></button><button class="btn" data-n="2" style="color:var(--ac)">Bom<small>${prevIntervalo(c, 2)}</small></button><button class="btn" data-n="3" style="color:var(--ok)">Fácil<small>${prevIntervalo(c, 3)}</small></button></div>`

function prevIntervalo(c, n) { const s = st.cards[c.id]; const i = FSRS.proximo(s && s.S ? s : null, n + 1).int; return i + (i > 1 ? " dias" : " dia"); }
document.addEventListener("keydown", e => {
  if (!location.hash.startsWith("#revisar") || /input|textarea|select/i.test(document.activeElement.tagName)) return;

  if (mostrando && ["1", "2", "3", "4"].includes(e.key)) { const b = document.querySelector(`[data-n="${+e.key - 1}"]`); if (b) b.click(); }
});

/* ============ NOVO TEMA ============ */
const CORES = ["#7f9cff", "#35c9bd", "#f2a35b", "#a98bf0", "#ee7fa8", "#5fd38d", "#f4d35e"];

  app.innerHTML = `<section class="card grid g2"><div class="grid" style="gap:12px">

function validarAula(txt) {
  let s = txt.trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim(); const i = s.indexOf("{"), j = s.lastIndexOf("}"); if (i < 0 || j < 0) throw new Error("Não achei um JSON. Copie a resposta inteira, das chaves { até }.");
  let a; try { a = JSON.parse(s.slice(i, j + 1)); } catch (e) { throw new Error("O JSON está quebrado: " + e.message + ". Peça à IA: 'reenvie só o JSON válido'."); }
  for (const k of ["titulo", "mapa", "blocos", "quiz"]) if (!a[k]) throw new Error(`Falta o campo "${k}".`);
  a.recupere ||= []; a.ideia ||= ""; a.fontes ||= []; if (!Array.isArray(a.mapa.ramos)) throw new Error("mapa.ramos precisa ser uma lista.");
  a.quiz = a.quiz.filter(q => q.q && Array.isArray(q.o) && Number.isInteger(q.a) && q.a < q.o.length);
  if (a.widget && !["parear", "ordenar"].includes(a.widget)) a.widget = null;
  if (a.widget === "parear" && !Array.isArray(a.parear)) a.widget = null; if (a.widget === "ordenar" && !Array.isArray(a.ordenar)) a.widget = null;
  return a;
}
function limparHTML(html) {

  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html"); const raiz = doc.body.firstChild;
  raiz.querySelectorAll("script,style,iframe,object,embed,link,meta").forEach(n => n.remove());
  (function limpa(n) { [...n.children].forEach(c => { if (!ok.has(c.tagName)) { c.replaceWith(...c.childNodes); return limpa(n); } [...c.attributes].forEach(at => { if (!["class", "href"].includes(at.name) || (at.name === "href" && !/^https?:/i.test(at.value))) c.removeAttribute(at.name); }); if (c.tagName === "A") c.setAttribute("target", "_blank"); limpa(c); }); })(raiz);

function buscarLocal(q) {
  q = q.toLowerCase(); const out = [];
  for (const [tid, txt] of Object.entries(BIB.textos || {})) { const i = txt.toLowerCase().indexOf(q); if (i < 0) continue; const ini = Math.max(0, i - 90); const info = acharTopico(tid);

  return out.sort((a, b) => b.ocorrencias - a.ocorrencias).slice(0, 30);

function nota(freq, t0 = 0, dur = .9, tipo = "triangle", vol = .18) {

  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .05);
}

    for (let f = 1; f <= 4; f++) g += `<line x1="${x0}" y1="${y0 + f * dy}" x2="${x0 + dx * 5}" y2="${y0 + f * dy}" stroke="#2b3550" stroke-width="2"/>`;
    [...s].forEach((c, i) => { const X = x0 + i * dx; if (c === "x") g += `<text x="${X}" y="${y0 - 14}" text-anchor="middle" fill="#ff7d86" font-size="16" font-weight="800">×</text>`; else if (c === "0") g += `<circle cx="${X}" cy="${y0 - 19}" r="7" fill="none" stroke="#5fd38d" stroke-width="2.5"/>`; else g += `<circle cx="${X}" cy="${y0 + (+c - .5) * dy}" r="11" fill="#7f9cff"/>`; });
    ["6ª", "5ª", "4ª", "3ª", "2ª", "1ª"].forEach((n, i) => g += `<text x="${x0 + i * dx}" y="${y0 + dy * 4 + 22}" text-anchor="middle" fill="#9aa4be" font-size="11">${n}</text>`);
    return g + "</svg>"; };
  const tocar = s => [...s].forEach((c, i) => { if (c !== "x") nota(AF[i] * Math.pow(2, (+c) / 12), i * .045, 1.6, "triangle", .11); });
  const draw = () => { box.innerHTML = `<div class="wid"><h3>Os 8 acordes abertos</h3><p class="sub">Clique para ver e ouvir. Depois feche os olhos e tente montar no violão de memória.</p><div class="cordas">${Object.keys(AC_).map(k => `<button class="${k === atual ? "on" : ""}" data-a="${k}">${k}</button>`).join("")}</div><div class="row" style="align-items:flex-start;gap:24px">${svg(AC_[atual])}<div class="bloco" style="flex:1;min-width:220px"><h3>${atual}</h3><p>Cordas (da 6ª à 1ª): <b>${AC_[atual].toUpperCase().split("").join(" ")}</b></p><p class="sub">× = não tocar · ○ = corda solta · número = casa</p><button class="btn pri" id="dedilhar">▶ Ouvir de novo</button></div></div></div>`;
    box.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { atual = b.dataset.a; draw(); tocar(AC_[atual]); }); $("#dedilhar", box).onclick = () => tocar(AC_[atual]); };
  draw();
}
function wMetronomo(box) {
  let bpm = 60, on = false, tempo = 0, prox = 0, tim, taps = [];
  box.innerHTML = `<div class="wid"><h3>Metrônomo</h3><p class="sub">Troque de acorde no tempo 1 (laranja). Quando acertar 8 de 10 trocas, suba 5 BPM.</p><div class="met" id="mt"><i class="um"></i><i></i><i></i><i></i></div><label for="mbpm">BPM: <b id="mv">60</b></label><input type="range" id="mbpm" min="40" max="160" value="60"><div class="row"><button class="btn pri" id="mplay">▶ Iniciar</button><button class="btn" id="tap">Tap (bata no ritmo)</button><button class="btn sm" id="m5">+5 BPM</button></div></div>`;
  const luzes = box.querySelectorAll("#mt i");
  const agenda = () => { const ac = audio(); while (prox < ac.currentTime + .1) { const b = tempo; nota(b === 0 ? 1500 : 1000, prox - ac.currentTime, .06, "square", b === 0 ? .12 : .07); setTimeout(() => luzes.forEach((l, i) => l.classList.toggle("on", i === b)), Math.max(0, (prox - ac.currentTime) * 1000)); prox += 60 / bpm; tempo = (tempo + 1) % 4; } };
  const set = v => { bpm = Math.max(40, Math.min(160, v)); $("#mbpm", box).value = bpm; $("#mv", box).textContent = bpm; };
  $("#mbpm", box).oninput = e => set(+e.target.value); $("#m5", box).onclick = () => set(bpm + 5);
  $("#mplay", box).onclick = e => { const ac = audio(); if (!ac) return; on = !on; e.target.textContent = on ? "■ Parar" : "▶ Iniciar"; if (on) { tempo = 0; prox = ac.currentTime + .05; tim = setInterval(agenda, 25); timers.push(tim); } else { clearInterval(tim); luzes.forEach(l => l.classList.remove("on")); } };
  $("#tap", box).onclick = () => { const t = performance.now(); taps = taps.filter(x => t - x < 3000); taps.push(t); if (taps.length > 2) { const d = (taps[taps.length - 1] - taps[0]) / (taps.length - 1); set(Math.round(60000 / d)); } };
}
function wSoletrar(box) {
  let tim; box.innerHTML = `<div class="wid"><h3>Treino de datilologia</h3><p class="sub">Digite uma palavra. As letras aparecem no ritmo escolhido: faça cada uma com a mão dominante, sem parar.</p><div class="row"><input type="text" id="pal" value="VITORIA" style="max-width:260px" aria-label="Palavra para soletrar"><button class="btn pri" id="ir">Começar</button></div><label for="vel">Ritmo: <b id="vv">1,2</b> s por letra</label><input type="range" id="vel" min="5" max="25" value="12"><div class="letra" id="lt">A</div><div class="row" id="dots" style="justify-content:center"></div><p class="sub">Assista ao alfabeto feito por uma pessoa surda no <a href="https://www.ines.gov.br/dicionario-de-libras/" target="_blank" rel="noopener">dicionário do INES</a> ou no app Hand Talk e compare.</p></div>`;
  $("#vel", box).oninput = e => $("#vv", box).textContent = (e.target.value / 10).toFixed(1).replace(".", ",");
  $("#ir", box).onclick = () => { clearInterval(tim); const p = $("#pal", box).value.toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-ZÇ]/g, ""); if (!p) return; let i = 0; const dots = $("#dots", box); dots.innerHTML = [...p].map(() => '<span class="pill">•</span>').join(""); const show = () => { if (i >= p.length) { clearInterval(tim); $("#lt", box).textContent = "✓"; return; } $("#lt", box).textContent = p[i]; dots.children[i].className = "pill ac"; i++; }; show(); tim = setInterval(show, +$("#vel", box).value * 100); timers.push(tim); };
}
function widgetCalcProva() {

}
function ligarCalcProva() {
  const A = [["Específicos", 20, 2, 14], ["Raciocínio lógico", 10, 2, 6], ["Legislação", 10, 2, 6], ["Português", 15, 1, 9], ["Inglês", 5, 1, 3]];
  $("#cs").innerHTML = A.map(([n, q, p, v], i) => `<div><label for="c${i}">${n}: <b id="cv${i}">${v}</b>/${q} acertos (${p} pt cada)</label><input type="range" id="c${i}" min="0" max="${q}" value="${v}"></div>`).join("");
  const calc = () => { let tot = 0, zero = false; A.forEach(([n, q, p], i) => { const v = +$("#c" + i).value; $("#cv" + i).textContent = v; tot += v * p; if (!v) zero = true; }); $("#cb").style.width = tot + "%"; $("#cb").style.background = !zero && tot >= 50 ? "var(--ok)" : "var(--bad)"; $("#cr").innerHTML = `<b>${tot}</b> de 100 pontos · ${zero ? "❌ eliminada (zerou uma área)" : tot >= 50 ? "✅ aprovada (para entrar nas vagas, mire 65 ou mais)" : "❌ abaixo de 50"}`; };
  A.forEach((_, i) => $("#c" + i).oninput = calc); calc();
}
