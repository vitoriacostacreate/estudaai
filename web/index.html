const CARDS = [{"id": "9113458f05", "f": "Scrum: os <b>3 papéis</b> (Guia 2020)", "v": "Product Owner, Scrum Master, Developers (o \"time de desenvolvimento\" virou <b>Developers</b>)", "tema": "concurso"}, {"id": "dc0d276881", "f": "Scrum: os <b>5 eventos</b>", "v": "Sprint (contém todos), Sprint Planning, Daily Scrum, Sprint Review, Sprint Retrospective", "tema": "concurso"}, {"id": "55e6990454", "f": "Scrum: <b>artefatos</b> e seus <b>compromissos</b>", "v": "Product Backlog → <b>Meta do Produto</b>. Sprint Backlog → <b>Meta da Sprint</b>. Incremento → <b>Definição de Pronto</b>.", "tema": "concurso"}, {"id": "9e8d47aae7", "f": "Scrum: duração da <b>Sprint</b> e da <b>Daily</b>", "v": "Sprint: até <b>1 mês</b> (duração fixa). Daily: <b>15 min</b>.", "tema": "concurso"}, {"id": "150f307966", "f": "Kanban: 2 práticas centrais", "v": "Visualizar o fluxo (quadro) e <b>limitar o WIP</b> (trabalho em progresso). O sistema é <b>puxado</b> (pull).", "tema": "concurso"}, {"id": "81bf418921", "f": "XP: 5 <b>valores</b>", "v": "Comunicação, simplicidade, feedback, coragem, respeito", "tema": "concurso"}, {"id": "5904c4744e", "f": "XP: práticas mais cobradas", "v": "Programação em par, TDD, integração contínua, refatoração, pequenos releases, propriedade coletiva do código, ritmo sustentável", "tema": "concurso"}, {"id": "6181433351", "f": "TDD: o ciclo", "v": "<b>Red</b> (escreve um teste que falha) → <b>Green</b> (código mínimo para passar) → <b>Refactor</b>", "tema": "concurso"}, {"id": "8a99d8ccdd", "f": "<b>Mock</b> × <b>stub</b>", "v": "<b>Stub</b>: devolve respostas prontas (verifica estado). <b>Mock</b>: objeto com expectativas, verifica <b>se as interações/chamadas aconteceram</b> (comportamento).", "tema": "concurso"}, {"id": "e2f4d9b1b7", "f": "Pirâmide de testes", "v": "Base: muitos testes <b>unitários</b> (rápidos e baratos) → meio: <b>integração</b> → topo: poucos testes <b>E2E/UI</b> (lentos e caros)", "tema": "concurso"}, {"id": "4fa3b8f394", "f": "Caixa-preta × caixa-branca", "v": "<b>Caixa-preta</b>: testa pelas entradas e saídas, sem ver o código (particionamento de equivalência, valor-limite). <b>Caixa-branca</b>: baseada na estrutura interna (cobertura de comandos, desvios, caminhos).", "tema": "concurso"}, {"id": "74a481accb", "f": "Cobertura de <b>comandos</b> × <b>desvios</b> (branch)", "v": "Comandos: cada linha executada ao menos 1 vez. Desvios: cada saída V e F de cada decisão. 100% de desvios ⇒ 100% de comandos (o inverso não vale).", "tema": "concurso"}, {"id": "82f236d874", "f": "SonarQube: o que mede", "v": "Análise <b>estática</b> (sem executar o código): bugs, vulnerabilidades, code smells, duplicação, cobertura (importada) e dívida técnica, com <b>Quality Gates</b>.", "tema": "concurso"}, {"id": "9ece5ac422", "f": "Pilares da <b>orientação a objetos</b>", "v": "Abstração, encapsulamento, herança, polimorfismo", "tema": "concurso"}, {"id": "d0dea69649", "f": "SOLID", "v": "<b>S</b>ingle responsibility, <b>O</b>pen/closed, <b>L</b>iskov substitution, <b>I</b>nterface segregation, <b>D</b>ependency inversion", "tema": "concurso"}, {"id": "59099385a6", "f": "Sobrecarga × sobrescrita", "v": "<b>Sobrecarga</b> (overload): mesmo nome, assinaturas diferentes, resolvida em compilação. <b>Sobrescrita</b> (override): subclasse redefine o método da superclasse, resolvida em execução.", "tema": "concurso"}, {"id": "39340ed570", "f": "UML: diagramas <b>estruturais</b>", "v": "Classes, objetos, componentes, implantação, pacotes, estrutura composta, perfil", "tema": "concurso"}, {"id": "ed9ee8d911", "f": "UML: diagramas <b>comportamentais</b> e de <b>interação</b>", "v": "Comportamentais: casos de uso, atividades, máquina de estados. Interação: sequência, comunicação, visão geral de interação, tempo.", "tema": "concurso"}, {"id": "f4ef9252fc", "f": "Casos de uso: <b>include</b> × <b>extend</b>", "v": "<b>Include</b>: comportamento <b>obrigatório</b>, sempre executado (seta do base para o incluído). <b>Extend</b>: comportamento <b>opcional</b>/condicional (seta do extensor para o base).", "tema": "concurso"}, {"id": "eb2968d5c1", "f": "Agregação × composição (UML)", "v": "<b>Agregação</b> (losango vazio): a parte existe sem o todo. <b>Composição</b> (losango cheio): a parte morre com o todo.", "tema": "concurso"}, {"id": "b7051e0d72", "f": "GoF: padrões <b>criacionais</b>", "v": "Singleton, Factory Method, Abstract Factory, Builder, Prototype", "tema": "concurso"}, {"id": "1d078cf133", "f": "GoF: padrões <b>estruturais</b>", "v": "Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy", "tema": "concurso"}, {"id": "021a205502", "f": "GoF: padrões <b>comportamentais</b> mais cobrados", "v": "Observer, Strategy, Command, Iterator, State, Template Method, Chain of Responsibility, Mediator, Memento, Visitor, Interpreter", "tema": "concurso"}, {"id": "41798ffe5d", "f": "<b>Adapter</b> × <b>Facade</b> × <b>Decorator</b>", "v": "<b>Adapter</b>: converte uma interface em outra esperada. <b>Facade</b>: interface simplificada para um subsistema. <b>Decorator</b>: adiciona responsabilidades dinamicamente, sem herança.", "tema": "concurso"}, {"id": "a0b8116b8f", "f": "MVC: responsabilidades", "v": "<b>Model</b>: dados e regras de negócio. <b>View</b>: apresentação. <b>Controller</b>: recebe a entrada e coordena Model e View.", "tema": "concurso"}, {"id": "3bece6de93", "f": "REST: restrições", "v": "Cliente-servidor, <b>stateless</b>, cacheável, interface uniforme, sistema em camadas e code on demand (opcional)", "tema": "concurso"}, {"id": "bd421b1b1c", "f": "Métodos HTTP <b>idempotentes</b>", "v": "GET, PUT, DELETE (e HEAD, OPTIONS). <b>POST não</b> é idempotente. Métodos <b>seguros</b> (não alteram estado): GET, HEAD, OPTIONS.", "tema": "concurso"}, {"id": "38de1b06e6", "f": "Códigos HTTP essenciais", "v": "200 OK · 201 Created · 204 No Content · 400 Bad Request · <b>401</b> não autenticado · <b>403</b> autenticado sem permissão · 404 Not Found · 500 erro no servidor", "tema": "concurso"}, {"id": "bc317113cb", "f": "e-PING e eMAG", "v": "<b>e-PING</b>: Padrões de Interoperabilidade de Governo Eletrônico. <b>eMAG</b>: Modelo de Acessibilidade em Governo Eletrônico (baseado nas WCAG).", "tema": "concurso"}, {"id": "7d42198369", "f": "Git: merge × rebase", "v": "<b>Merge</b>: une históricos e cria um commit de merge (preserva o histórico). <b>Rebase</b>: reaplica commits sobre outra base (histórico linear, reescreve hashes). Não faça rebase de branch pública.", "tema": "concurso"}, {"id": "be3fba6d13", "f": "CI × Entrega contínua × Implantação contínua", "v": "<b>CI</b>: integrar e testar automaticamente a cada commit. <b>Continuous Delivery</b>: sempre pronto para produção, com deploy <b>manual</b>. <b>Continuous Deployment</b>: deploy <b>automático</b> em produção.", "tema": "concurso"}, {"id": "c9d014e63c", "f": "Docker: imagem × contêiner", "v": "<b>Imagem</b>: modelo imutável em camadas (gerado pelo Dockerfile). <b>Contêiner</b>: instância em execução de uma imagem.", "tema": "concurso"}, {"id": "e033d188be", "f": "OAuth2: os 4 papéis", "v": "Resource Owner (usuário), Client (aplicação), Authorization Server (emite tokens), Resource Server (API protegida)", "tema": "concurso"}, {"id": "4bdccc55d5", "f": "OAuth2 × autenticação", "v": "OAuth2 é protocolo de <b>autorização</b> (acesso delegado). Para autenticação, use <b>OpenID Connect</b> (camada sobre o OAuth2, com o ID Token).", "tema": "concurso"}, {"id": "78aa4b854f", "f": "Formas normais: 1FN, 2FN, 3FN", "v": "<b>1FN</b>: atributos atômicos, sem grupos repetidos. <b>2FN</b>: 1FN + sem dependência <b>parcial</b> da chave composta. <b>3FN</b>: 2FN + sem dependência <b>transitiva</b>.", "tema": "concurso"}, {"id": "09e99f25e6", "f": "BCNF (FNBC)", "v": "Todo determinante é <b>chave candidata</b> (mais rígida que a 3FN)", "tema": "concurso"}, {"id": "de815b5cb6", "f": "Propriedades <b>ACID</b>", "v": "Atomicidade, Consistência, Isolamento, Durabilidade", "tema": "concurso"}, {"id": "7b33a7da7e", "f": "Anomalias × níveis de isolamento", "v": "Read Uncommitted: permite leitura suja. Read Committed: evita leitura suja (padrão do PostgreSQL). Repeatable Read: evita leitura não repetível. Serializable: evita leitura fantasma.", "tema": "concurso"}, {"id": "baee458e2d", "f": "SQL: DDL × DML × DCL × TCL", "v": "<b>DDL</b>: CREATE, ALTER, DROP, TRUNCATE. <b>DML</b>: SELECT, INSERT, UPDATE, DELETE. <b>DCL</b>: GRANT, REVOKE. <b>TCL</b>: COMMIT, ROLLBACK, SAVEPOINT.", "tema": "concurso"}, {"id": "60250adf9f", "f": "WHERE × HAVING", "v": "WHERE filtra <b>linhas antes</b> do agrupamento. HAVING filtra <b>grupos depois</b> do GROUP BY (pode usar funções de agregação).", "tema": "concurso"}, {"id": "ca5a1764e6", "f": "Ordem lógica de execução do SELECT", "v": "FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT", "tema": "concurso"}, {"id": "3dad1c5f13", "f": "Álgebra relacional: símbolos", "v": "σ seleção (linhas) · π projeção (colunas) · ⨝ junção · ∪ união · − diferença · × produto cartesiano · ρ renomeação", "tema": "concurso"}, {"id": "d535e48197", "f": "PostgreSQL: SAVEPOINT", "v": "Marca um ponto dentro da transação: <code>ROLLBACK TO SAVEPOINT x</code> desfaz só até ali, sem abortar a transação inteira.", "tema": "concurso"}, {"id": "a766fe7b5a", "f": "DW: OLTP × OLAP", "v": "<b>OLTP</b>: transacional, normalizado, muitas escritas pequenas. <b>OLAP</b>: analítico, desnormalizado (esquema estrela ou floco de neve), consultas de agregação.", "tema": "concurso"}, {"id": "a44d186fe1", "f": "OWASP Top 10 (2021): os 3 primeiros", "v": "A01 Broken Access Control · A02 Cryptographic Failures · A03 Injection (inclui XSS).<br>⚠️ Há uma versão 2025 que mudou a ordem (A01 continua Broken Access Control). Confira a lista atual em owasp.org/Top10 e no NotebookLM.", "tema": "concurso"}, {"id": "963e7f4305", "f": "SQL Injection: prevenção principal", "v": "<b>Consultas parametrizadas</b> (prepared statements) + validação de entrada + menor privilégio no banco", "tema": "concurso"}, {"id": "f5f4d7a79e", "f": "Criptografia simétrica × assimétrica", "v": "<b>Simétrica</b>: 1 chave, rápida (AES). <b>Assimétrica</b>: par pública/privada (RSA). Assinatura digital = <b>hash</b> assinado com a chave <b>privada</b> do emissor.", "tema": "concurso"}, {"id": "1793ef38eb", "f": "LGPD: <b>dado pessoal sensível</b>", "v": "Origem racial ou étnica, convicção religiosa, opinião política, filiação sindical ou a organização religiosa, filosófica ou política, saúde, vida sexual, dado genético ou biométrico (art. 5º, II)", "tema": "concurso"}, {"id": "e5e81fb1a5", "f": "LGPD: <b>controlador</b> × <b>operador</b> × <b>encarregado</b>", "v": "<b>Controlador</b>: toma as decisões sobre o tratamento. <b>Operador</b>: trata em nome do controlador. <b>Encarregado</b> (DPO): canal de comunicação entre controlador, titulares e ANPD.", "tema": "concurso"}, {"id": "470848bbdc", "f": "LGPD: princípios (art. 6º)", "v": "Finalidade, adequação, necessidade, livre acesso, qualidade dos dados, transparência, segurança, prevenção, não discriminação, responsabilização e prestação de contas (+ boa-fé no caput)", "tema": "concurso"}, {"id": "d5e780d0c0", "f": "LGPD: <b>anonimização</b> × <b>pseudonimização</b>", "v": "Dado <b>anonimizado</b> não identifica o titular e, em regra, <b>não é dado pessoal</b>. Na <b>pseudonimização</b>, a reidentificação é possível com informação adicional mantida separadamente.", "tema": "concurso"}, {"id": "88f6ca6387", "f": "LGPD: multa máxima", "v": "Até <b>2% do faturamento</b> no Brasil, limitada a <b>R$ 50 milhões por infração</b> (art. 52)", "tema": "concurso"}, {"id": "652f95cf7e", "f": "LGPD: o poder público precisa de consentimento?", "v": "Não necessariamente. Ele pode tratar dados para a <b>execução de políticas públicas</b> e o cumprimento de obrigação legal, sem consentimento (arts. 7º e 23).", "tema": "concurso"}, {"id": "569c62eca0", "f": "IA: aprendizado supervisionado × não supervisionado", "v": "<b>Supervisionado</b>: dados rotulados (classificação, regressão). <b>Não supervisionado</b>: sem rótulos (agrupamento/clustering).", "tema": "concurso"}, {"id": "c179f9befc", "f": "RAG (geração aumentada por recuperação)", "v": "Antes de responder, o LLM <b>busca documentos relevantes</b> (normalmente por embeddings) e usa esse contexto. Reduz alucinação e permite usar dados próprios.", "tema": "concurso"}, {"id": "527189c421", "f": "Overfitting × underfitting", "v": "<b>Overfitting</b>: decora o treino e vai mal em dados novos. <b>Underfitting</b>: modelo simples demais, que vai mal até no treino.", "tema": "concurso"}, {"id": "52c44fdebb", "f": "<b>actually</b>", "v": "na verdade, de fato (⚠️ não é \"atualmente\" = currently)", "tema": "concurso"}, {"id": "82818191db", "f": "<b>eventually</b>", "v": "finalmente, com o tempo (⚠️ não é \"eventualmente\" = occasionally)", "tema": "concurso"}, {"id": "703f9aab0d", "f": "<b>pretend</b>", "v": "fingir (⚠️ não é \"pretender\" = intend)", "tema": "concurso"}, {"id": "646e49972a", "f": "<b>realize</b>", "v": "perceber, dar-se conta (também pode ser realizar uma meta)", "tema": "concurso"}, {"id": "7063380ee7", "f": "<b>library</b>", "v": "biblioteca (⚠️ livraria = bookstore). Em TI: biblioteca de código", "tema": "concurso"}, {"id": "9b2a2f72c1", "f": "<b>sensible</b>", "v": "sensato (⚠️ sensível = sensitive)", "tema": "concurso"}, {"id": "a03b2c8a96", "f": "<b>assist</b>", "v": "ajudar (⚠️ assistir TV = watch)", "tema": "concurso"}, {"id": "f04a3166ea", "f": "<b>data</b>", "v": "dados (plural de datum). \"Data breach\" = vazamento de dados", "tema": "concurso"}, {"id": "d617a69a66", "f": "<b>deploy / deployment</b>", "v": "implantar / implantação em produção", "tema": "concurso"}, {"id": "c00b730df3", "f": "<b>however / therefore / although / whereas</b>", "v": "however = porém. therefore = portanto. although = embora. whereas = enquanto (contraste)", "tema": "concurso"}, {"id": "7d8092ab80", "f": "<b>may / might / must / should</b>", "v": "may/might = possibilidade. must = obrigação ou dedução forte. should = recomendação", "tema": "concurso"}, {"id": "58a43d5962", "f": "Estratégia de leitura para as 5 questões", "v": "1) Leia as <b>perguntas antes</b>. 2) Faça <i>skimming</i> (ideia geral pelo título e pela 1ª frase dos parágrafos). 3) <i>Scanning</i>: procure a palavra-chave da questão. 4) Use cognatos e não traduza tudo.", "tema": "concurso"}, {"id": "beb267bb83", "f": "Lei 8.112/90: <b>prazo para tomar posse</b>", "v": "30 dias contados da publicação do ato de provimento (art. 13, §1º)", "tema": "concurso"}, {"id": "2eb22aeff0", "f": "Lei 8.112/90: <b>prazo para entrar em exercício</b>", "v": "15 dias contados da data da posse (art. 15, §1º)", "tema": "concurso"}, {"id": "d430e2b39b", "f": "Lei 8.112/90: <b>formas de provimento</b> (7)", "v": "Nomeação, promoção, readaptação, reversão, aproveitamento, reintegração, recondução (art. 8º)<br><i>Mnemônico: NO-PRO-READ-REVER-APRO-REIN-RECON</i>", "tema": "concurso"}, {"id": "25413546e3", "f": "Lei 8.112/90: <b>estágio probatório</b>: o que diz o texto da lei × a Constituição", "v": "O texto do art. 20 fala em <b>24 meses</b>. A CF (art. 41, EC 19/98) fixa a estabilidade após <b>3 anos</b>, e a jurisprudência alinhou o estágio a 3 anos.<br>⚠️ Leia o enunciado: \"segundo a Lei 8.112\" ou \"segundo a CF/entendimento\".", "tema": "concurso"}, {"id": "79bd6319df", "f": "Lei 8.112/90: <b>validade do concurso</b>", "v": "Até 2 anos, prorrogável uma única vez por igual período (art. 12)", "tema": "concurso"}, {"id": "b780813311", "f": "Lei 8.112/90: <b>idade mínima</b> para investidura", "v": "18 anos (art. 5º, V)", "tema": "concurso"}, {"id": "459572e96c", "f": "Lei 8.112/90: <b>reintegração</b>", "v": "Reinvestidura do servidor <b>estável</b> no cargo anterior quando a demissão é invalidada (decisão administrativa ou judicial), com ressarcimento das vantagens (art. 28)", "tema": "concurso"}, {"id": "ab439bf213", "f": "Lei 8.112/90: <b>recondução</b>", "v": "Retorno do servidor <b>estável</b> ao cargo anterior por (1) inabilitação em estágio probatório de outro cargo ou (2) reintegração do anterior ocupante (art. 29)", "tema": "concurso"}, {"id": "f0849a4a03", "f": "Lei 8.112/90: <b>reversão</b>", "v": "Retorno à atividade do servidor <b>aposentado</b> (por invalidez, quando cessam os motivos, ou no interesse da administração, nas condições legais) (art. 25)", "tema": "concurso"}, {"id": "a4a6d651cc", "f": "Lei 8.112/90: <b>aproveitamento</b>", "v": "Retorno à atividade do servidor em <b>disponibilidade</b>, em cargo de atribuições e vencimentos compatíveis (art. 30)", "tema": "concurso"}, {"id": "9ba90af1a1", "f": "Lei 8.112/90: <b>readaptação</b>", "v": "Investidura em cargo compatível com a limitação física ou mental sofrida pelo servidor, verificada em inspeção médica (art. 24)", "tema": "concurso"}, {"id": "fc2a5bfb21", "f": "Lei 8.112/90: <b>formas de vacância</b>", "v": "Exoneração, demissão, promoção, readaptação, aposentadoria, posse em outro cargo inacumulável, falecimento (art. 33)", "tema": "concurso"}, {"id": "cbdcb0cbcd", "f": "Lei 8.112/90: <b>remoção</b> × <b>redistribuição</b>", "v": "<b>Remoção</b>: deslocamento do <b>servidor</b> no mesmo quadro, com ou sem mudança de sede (art. 36).<br><b>Redistribuição</b>: deslocamento do <b>cargo</b> para outro órgão ou entidade do mesmo Poder (art. 37).", "tema": "concurso"}, {"id": "bae692cf51", "f": "Lei 8.112/90: as 3 espécies de <b>vantagens</b>", "v": "Indenizações, gratificações e adicionais (art. 49). Só as <b>indenizações não</b> se incorporam ao vencimento.", "tema": "concurso"}, {"id": "59cb1303f3", "f": "Lei 8.112/90: <b>indenizações</b> (4)", "v": "Ajuda de custo, diárias, indenização de transporte, auxílio-moradia (art. 51)", "tema": "concurso"}, {"id": "3b53f4a057", "f": "Lei 8.112/90: <b>férias</b>", "v": "30 dias por ano, acumuláveis até 2 períodos em caso de necessidade do serviço. O 1º período exige 12 meses de exercício (art. 77).", "tema": "concurso"}, {"id": "8c6cbc534f", "f": "Lei 8.112/90: <b>licença para capacitação</b>", "v": "Até 3 meses a cada quinquênio de efetivo exercício, no interesse da administração (art. 87)", "tema": "concurso"}, {"id": "6cefb56281", "f": "Lei 8.112/90: <b>licença para tratar de interesses particulares</b>", "v": "Até 3 anos consecutivos, sem remuneração, a critério da administração. Não pode ser concedida a quem está em estágio probatório (art. 91).", "tema": "concurso"}, {"id": "46a311d38c", "f": "Lei 8.112/90: <b>penalidades disciplinares</b> (6)", "v": "Advertência, suspensão, demissão, cassação de aposentadoria ou disponibilidade, destituição de cargo em comissão, destituição de função comissionada (art. 127)", "tema": "concurso"}, {"id": "c8ad9b2ea4", "f": "Lei 8.112/90: prazo máximo da <b>suspensão</b>", "v": "90 dias (art. 130)", "tema": "concurso"}, {"id": "af08dae95f", "f": "Lei 8.112/90: <b>cancelamento dos registros</b> de penalidade", "v": "Advertência: após 3 anos. Suspensão: após 5 anos de efetivo exercício, se não houver nova infração (art. 131).", "tema": "concurso"}, {"id": "ac3e59be68", "f": "Lei 8.112/90: <b>abandono de cargo</b> × <b>inassiduidade habitual</b>", "v": "<b>Abandono</b>: ausência intencional por <b>mais de 30 dias consecutivos</b> (art. 138).<br><b>Inassiduidade</b>: falta sem causa justificada por <b>60 dias interpolados</b> em 12 meses (art. 139). Ambos geram demissão.", "tema": "concurso"}, {"id": "4755d830c1", "f": "Lei 8.112/90: <b>independência das responsabilidades</b>", "v": "As sanções civis, penais e administrativas podem se acumular e são independentes. A responsabilidade administrativa é afastada se a absolvição criminal <b>negar a existência do fato ou a autoria</b> (arts. 125–126).", "tema": "concurso"}, {"id": "7a3dfea288", "f": "Lei 8.112/90: <b>prescrição</b> da ação disciplinar", "v": "5 anos: demissão, cassação, destituição. 2 anos: suspensão. 180 dias: advertência (art. 142)", "tema": "concurso"}, {"id": "eb6a812d1d", "f": "Lei 8.112/90: <b>prazo da sindicância</b>", "v": "Até 30 dias, prorrogável por igual período (art. 145, parágrafo único)", "tema": "concurso"}, {"id": "f1848d0555", "f": "Lei 8.112/90: <b>resultados possíveis da sindicância</b>", "v": "Arquivamento, aplicação de advertência ou suspensão de até 30 dias, ou instauração de PAD (art. 145)", "tema": "concurso"}, {"id": "dc86df7395", "f": "Lei 8.112/90: <b>prazo do PAD</b>", "v": "Até 60 dias, prorrogável por igual período (art. 152)", "tema": "concurso"}, {"id": "c09787a16f", "f": "Lei 8.112/90: <b>comissão do PAD</b>", "v": "3 servidores <b>estáveis</b> designados pela autoridade competente. O presidente deve ocupar cargo de nível igual ou superior, ou ter escolaridade igual ou superior à do indiciado (art. 149).", "tema": "concurso"}, {"id": "7e160b77a4", "f": "Lei 8.112/90: <b>afastamento preventivo</b>", "v": "Até 60 dias, prorrogável por igual prazo, sem prejuízo da remuneração (art. 147)", "tema": "concurso"}, {"id": "b6cc9e19c6", "f": "Lei 8.112/90: <b>fases do PAD</b>", "v": "Instauração → inquérito administrativo (instrução, defesa, relatório) → julgamento (art. 151)", "tema": "concurso"}, {"id": "26289632fd", "f": "Decreto 9.283/2018: o que ele <b>regulamenta</b>", "v": "Regulamenta a Lei de Inovação (Lei 10.973/2004), alterada pelo Marco Legal de CT&I (Lei 13.243/2016), entre outras normas. Estabelece medidas de incentivo à inovação e à pesquisa científica e tecnológica.", "tema": "concurso"}, {"id": "1c93c00209", "f": "Marco Legal de CT&I: o que é <b>NIT</b>", "v": "Núcleo de Inovação Tecnológica: estrutura da ICT que gere a política de inovação (propriedade intelectual, transferência de tecnologia etc.)", "tema": "concurso"}, {"id": "a680da79ef", "f": "Marco Legal de CT&I: o que é <b>ICT</b>", "v": "Instituição Científica, Tecnológica e de Inovação: órgão ou entidade (pública ou privada sem fins lucrativos) com missão de pesquisa básica ou aplicada, ou de desenvolvimento de produtos, serviços ou processos. A UFMS é uma ICT pública.", "tema": "concurso"}, {"id": "189af29a76", "f": "Marco Legal de CT&I: <b>encomenda tecnológica</b>", "v": "Contratação, pela administração pública, de atividades de pesquisa, desenvolvimento e inovação que envolvam <b>risco tecnológico</b>, para resolver um problema técnico específico ou obter um produto, serviço ou processo inovador.", "tema": "concurso"}, {"id": "639c1097f8", "f": "CF, art. 37: <b>princípios</b> da Administração Pública", "v": "<b>LIMPE</b>: Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência", "tema": "concurso"}, {"id": "ad884adcc4", "f": "CF, art. 37: <b>validade do concurso</b>", "v": "Até 2 anos, prorrogável <b>uma vez</b> por igual período (inc. III)", "tema": "concurso"}, {"id": "e18abdbbd8", "f": "CF, art. 37: <b>cargo em comissão</b> × <b>função de confiança</b>", "v": "<b>Função de confiança</b>: exercida <b>exclusivamente</b> por servidores efetivos.<br><b>Cargo em comissão</b>: livre nomeação, com percentuais mínimos para efetivos. Ambos são só para <b>direção, chefia e assessoramento</b> (inc. V).", "tema": "concurso"}, {"id": "cb181d981b", "f": "CF, art. 37, XVI: <b>acumulação remunerada</b> permitida", "v": "Com compatibilidade de horários: <b>2 de professor</b> · <b>1 de professor + 1 técnico ou científico</b> · <b>2 de profissional de saúde</b> com profissão regulamentada.", "tema": "concurso"}, {"id": "76767f5712", "f": "CF, art. 37, §6º: <b>responsabilidade do Estado</b>", "v": "<b>Objetiva</b>: responde pelos danos que seus agentes causarem a terceiros. Tem direito de regresso contra o agente em caso de <b>dolo ou culpa</b>.", "tema": "concurso"}, {"id": "49c734b3c8", "f": "CF, art. 41: <b>estabilidade</b>", "v": "Após <b>3 anos</b> de efetivo exercício, para servidor nomeado por concurso. A <b>avaliação especial de desempenho</b> por comissão é condição para adquiri-la (§4º).", "tema": "concurso"}, {"id": "12fa601f1e", "f": "CF, art. 41: como o servidor <b>estável perde o cargo</b> (3 hipóteses)", "v": "① sentença judicial transitada em julgado · ② processo administrativo com ampla defesa · ③ avaliação periódica de desempenho, na forma de lei complementar, com ampla defesa", "tema": "concurso"}, {"id": "e4b10b1f4c", "f": "CF, art. 41, §3º: <b>cargo extinto ou declarado desnecessário</b>", "v": "O estável fica em <b>disponibilidade</b>, com remuneração <b>proporcional ao tempo de serviço</b>, até ser aproveitado.", "tema": "concurso"}, {"id": "9ed09737cf", "f": "Lei 9.784/99: prazo geral para a prática de atos", "v": "<b>5 dias</b>, salvo motivo de força maior, podendo ser dilatado até o <b>dobro</b> mediante justificação (art. 24)", "tema": "concurso"}, {"id": "ea43645c76", "f": "Lei 9.784/99: prazo para <b>decidir</b> após a instrução", "v": "Até <b>30 dias</b>, prorrogável por igual período, expressamente motivado (art. 49)", "tema": "concurso"}, {"id": "3b375c3185", "f": "Lei 9.784/99: prazo para <b>interpor recurso</b>", "v": "<b>10 dias</b>, contados da ciência ou divulgação oficial da decisão (art. 59)", "tema": "concurso"}, {"id": "20a28a7f40", "f": "Lei 9.784/99: <b>caminho do recurso</b>", "v": "Dirigido à autoridade que decidiu. Se ela não reconsiderar em <b>5 dias</b>, encaminha à autoridade superior (art. 56, §1º). Tramita por no máximo <b>3 instâncias</b> (art. 57).", "tema": "concurso"}, {"id": "9240a5dbb0", "f": "Lei 9.784/99: o que <b>não pode ser delegado</b>", "v": "① edição de atos normativos · ② decisão de recursos administrativos · ③ matérias de competência exclusiva (art. 13). Mnemônico: <b>NO-RE-EX</b>.", "tema": "concurso"}, {"id": "fc9d4f369d", "f": "Lei 9.784/99: <b>impedimento</b> × <b>suspeição</b>", "v": "<b>Impedimento</b> (art. 18): interesse direto na matéria, participação como perito/testemunha/representante, litígio com o interessado. É <b>obrigatório</b> comunicar.<br><b>Suspeição</b> (art. 20): <b>amizade íntima ou inimizade notória</b>. Pode ser arguida.", "tema": "concurso"}, {"id": "3cd4369429", "f": "Lei 9.784/99: <b>decadência</b> para anular atos favoráveis", "v": "<b>5 anos</b> da data em que foram praticados, salvo comprovada <b>má-fé</b> (art. 54)", "tema": "concurso"}, {"id": "787a5fd837", "f": "Lei 9.784/99: <b>reformatio in pejus</b>: recurso × revisão", "v": "No <b>recurso</b>, a decisão pode piorar a situação do recorrente, desde que ele seja cientificado para alegar (art. 64). Na <b>revisão</b>, não pode haver agravamento da sanção (art. 65).", "tema": "concurso"}, {"id": "cde7130687", "f": "Lei 9.784/99: <b>antecedência da intimação</b>", "v": "Mínimo de <b>3 dias úteis</b> quanto à data de comparecimento (art. 26, §2º)", "tema": "concurso"}, {"id": "a7551a1e84", "f": "Crase: regra-mãe", "v": "Crase = preposição <b>a</b> + artigo <b>a</b>. Teste: troque por uma palavra masculina. Se virar \"<b>ao</b>\", tem crase. (Vou à escola → vou ao colégio)", "tema": "concurso"}, {"id": "81d0cd886e", "f": "Casos em que a crase é <b>proibida</b>", "v": "Antes de palavra masculina, de verbo, de pronomes pessoais e da maioria dos indefinidos, entre palavras repetidas (cara a cara) e antes de \"uma\" indefinido.", "tema": "concurso"}, {"id": "c0abd0b35c", "f": "Casos de crase <b>facultativa</b>", "v": "Antes de pronome possessivo feminino (à/a minha), de nome próprio feminino (à/a Maria) e depois de \"até\" (até à/a porta).", "tema": "concurso"}, {"id": "939a4a3f49", "f": "Crase com horas e \"à moda de\"", "v": "Hora determinada: <b>às</b> 8h. \"À moda de\" subentendida: bife <b>à</b> milanesa, gol <b>à</b> Pelé.", "tema": "concurso"}, {"id": "103b76c7d6", "f": "Regência de <b>assistir</b>", "v": "No sentido de ver: assistir <b>a</b> (assisti <b>ao</b> filme). No sentido de ajudar: VTD (o médico assistiu o paciente).", "tema": "concurso"}, {"id": "2939aded14", "f": "Regência de <b>aspirar</b> e <b>visar</b>", "v": "No sentido de desejar ou objetivar: <b>a</b> (aspira <b>ao</b> cargo, visa <b>ao</b> sucesso). No sentido de cheirar ou mirar: VTD.", "tema": "concurso"}, {"id": "433bd98d1e", "f": "Regência de <b>preferir</b>", "v": "Preferir X <b>a</b> Y. ⚠️ Errado: \"preferir mais\", \"do que\".", "tema": "concurso"}, {"id": "a8847d224f", "f": "Regência de <b>implicar</b> (acarretar)", "v": "VTD: a decisão implica <b>mudanças</b> (sem \"em\").", "tema": "concurso"}, {"id": "82b456164e", "f": "Concordância com <b>haver</b> no sentido de existir", "v": "É <b>impessoal</b> e fica no singular: <b>Houve</b> problemas. <b>Deve haver</b> soluções.", "tema": "concurso"}, {"id": "c7ffd24640", "f": "Concordância com <b>fazer</b> indicando tempo", "v": "Impessoal, no singular: <b>Faz</b> dois anos.", "tema": "concurso"}, {"id": "e7441cace8", "f": "Concordância com sujeito posposto", "v": "O verbo concorda normalmente: \"<b>Chegaram</b> os documentos.\"  ⚠️ Banca adora inverter a ordem.", "tema": "concurso"}, {"id": "5d252f0e88", "f": "Concordância: \"<b>é proibido</b>\", \"<b>é necessário</b>\"", "v": "Sem determinante, fica invariável: É proibido entrada. Com determinante, concorda: É proibid<b>a</b> <b>a</b> entrada.", "tema": "concurso"}, {"id": "8ec6f39ad1", "f": "Concordância: <b>anexo, obrigado, mesmo, quite</b>", "v": "Concordam com o nome: segue<b>m</b> anex<b>as</b> as planilhas, ela disse obrigad<b>a</b>. ⚠️ \"Em anexo\" é invariável.", "tema": "concurso"}, {"id": "16858ba490", "f": "Vírgula: a <b>proibição</b> mais cobrada", "v": "Não separe <b>sujeito e verbo</b>, nem <b>verbo e complemento</b> com uma vírgula só.", "tema": "concurso"}, {"id": "53f9010e02", "f": "Vírgula <b>obrigatória</b>", "v": "Aposto explicativo, vocativo, adjunto adverbial deslocado longo, orações adjetivas <b>explicativas</b>, conjunções intercaladas e expressões explicativas (isto é, ou seja).", "tema": "concurso"}, {"id": "f636d0f3ae", "f": "Oração adjetiva <b>restritiva</b> × <b>explicativa</b>", "v": "<b>Restritiva</b>: sem vírgula, limita o sentido (Os alunos que estudaram passaram: só alguns).<br><b>Explicativa</b>: entre vírgulas, generaliza (Os alunos, que estudaram, passaram: todos).", "tema": "concurso"}, {"id": "06fd63a402", "f": "Conjunções <b>adversativas</b> × <b>conclusivas</b>", "v": "<b>Adversativas</b>: mas, porém, contudo, todavia, entretanto, no entanto.<br><b>Conclusivas</b>: logo, portanto, por isso, pois (<b>depois</b> do verbo).", "tema": "concurso"}, {"id": "23d4b6d9a2", "f": "\"Pois\" explicativo × conclusivo", "v": "<b>Antes</b> do verbo = explicativo (Saia, pois vai chover). <b>Depois</b> do verbo, entre vírgulas = conclusivo (Estudou muito, passará, pois, no concurso).", "tema": "concurso"}, {"id": "46722f5dce", "f": "Mecanismos de <b>coesão</b>", "v": "Referencial (pronomes, sinônimos, elipse) e sequencial (conectivos). Pergunta típica: \"o termo X retoma o quê?\"", "tema": "concurso"}, {"id": "55e0c8f6ab", "f": "Interpretação: a <b>pegadinha clássica</b>", "v": "Alternativas que extrapolam (dizem mais do que o texto), reduzem ou contradizem. A correta costuma ser a que fica <b>dentro do texto</b>.", "tema": "concurso"}, {"id": "1254bbd820", "f": "Quando a <b>conjunção</b> p ∧ q é verdadeira?", "v": "Só quando <b>as duas</b> são V", "tema": "concurso"}, {"id": "0599ef4f19", "f": "Quando a <b>disjunção</b> p ∨ q é falsa?", "v": "Só quando <b>as duas</b> são F", "tema": "concurso"}, {"id": "57f2d29f5f", "f": "Quando a <b>condicional</b> p → q é falsa?", "v": "Só no caso <b>V → F</b> (\"Vera Fischer é falsa\")", "tema": "concurso"}, {"id": "b3cd334704", "f": "Quando a <b>bicondicional</b> p ↔ q é verdadeira?", "v": "Quando p e q têm o <b>mesmo valor</b> (V,V ou F,F)", "tema": "concurso"}, {"id": "e2d67b3838", "f": "Quando a <b>disjunção exclusiva</b> p ⊻ q (\"ou p ou q\") é verdadeira?", "v": "Quando p e q têm valores <b>diferentes</b>", "tema": "concurso"}, {"id": "a1a9606d0b", "f": "Número de linhas de uma tabela-verdade com n proposições simples", "v": "2ⁿ", "tema": "concurso"}, {"id": "82b502d263", "f": "Negação de <b>p ∧ q</b>", "v": "¬p ∨ ¬q (troca ∧ por ∨ e nega as duas, De Morgan)", "tema": "concurso"}, {"id": "14d1d2bd14", "f": "Negação de <b>p ∨ q</b>", "v": "¬p ∧ ¬q (De Morgan)", "tema": "concurso"}, {"id": "77931efad9", "f": "Negação de <b>p → q</b>", "v": "<b>p ∧ ¬q</b> (\"mantém a 1ª E nega a 2ª\")<br>⚠️ Não é ¬p → ¬q!", "tema": "concurso"}, {"id": "e5f87b2ff2", "f": "Negação de <b>p ↔ q</b>", "v": "p ⊻ q (ou p ↔ ¬q)", "tema": "concurso"}, {"id": "c7f27fbed7", "f": "Equivalências da condicional <b>p → q</b>", "v": "① <b>¬q → ¬p</b> (contrapositiva: inverte e nega)<br>② <b>¬p ∨ q</b> (nega a 1ª OU mantém a 2ª)", "tema": "concurso"}, {"id": "09a24ce6d3", "f": "Tautologia × contradição × contingência", "v": "<b>Tautologia</b>: sempre V. <b>Contradição</b>: sempre F. <b>Contingência</b>: às vezes V, às vezes F.", "tema": "concurso"}, {"id": "fe65398dc4", "f": "Negação de \"<b>Todo</b> A é B\"", "v": "\"<b>Algum</b> A <b>não</b> é B\"", "tema": "concurso"}, {"id": "86d2b5635f", "f": "Negação de \"<b>Algum</b> A é B\"", "v": "\"<b>Nenhum</b> A é B\"", "tema": "concurso"}, {"id": "a998621d9c", "f": "Negação de \"<b>Nenhum</b> A é B\"", "v": "\"<b>Algum</b> A é B\"", "tema": "concurso"}, {"id": "f28a3b1df4", "f": "Argumento <b>válido</b>: definição", "v": "Se todas as premissas forem V, a conclusão é <b>obrigatoriamente</b> V. A validade depende da forma, não da verdade das premissas.", "tema": "concurso"}, {"id": "0353250be2", "f": "Modus ponens × modus tollens", "v": "<b>Ponens</b>: p→q, p ⊢ q.<br><b>Tollens</b>: p→q, ¬q ⊢ ¬p.", "tema": "concurso"}, {"id": "c947dd4844", "f": "Falácias clássicas da condicional", "v": "<b>Afirmar o consequente</b> (p→q, q ⊢ p) e <b>negar o antecedente</b> (p→q, ¬p ⊢ ¬q): os dois são <b>inválidos</b>.", "tema": "concurso"}, {"id": "db47756651", "f": "Princípio fundamental da contagem", "v": "Se uma etapa tem m modos e outra tem n modos, independentes, o total é <b>m × n</b>", "tema": "concurso"}, {"id": "9844f05f80", "f": "Permutação simples", "v": "Pₙ = n! (ordenar <b>todos</b> os n elementos)", "tema": "concurso"}, {"id": "23ba7d7e9c", "f": "Arranjo × combinação: como decidir", "v": "<b>A ordem importa?</b> Sim → arranjo A(n,p) = n!/(n−p)!. Não → combinação C(n,p) = n!/[p!(n−p)!].<br>Teste: troque dois elementos de lugar. Se mudou o resultado, é arranjo.", "tema": "concurso"}, {"id": "78bffa57c4", "f": "Permutação com repetição (ex.: anagramas de ARARA)", "v": "n!/(a!·b!·…). ARARA = 5!/(3!·2!) = 10", "tema": "concurso"}, {"id": "8ff28126fb", "f": "Probabilidade clássica", "v": "P = casos favoráveis / casos possíveis (0 ≤ P ≤ 1)", "tema": "concurso"}, {"id": "f403b1c81a", "f": "Probabilidade da <b>união</b> P(A ∪ B)", "v": "P(A) + P(B) − P(A ∩ B)", "tema": "concurso"}, {"id": "7e20c51722", "f": "Eventos <b>independentes</b>: P(A ∩ B)", "v": "P(A) · P(B)", "tema": "concurso"}, {"id": "fb4a525fc6", "f": "Probabilidade do <b>complementar</b>", "v": "P(não A) = 1 − P(A). Dica: \"pelo menos um\" → 1 − P(nenhum)", "tema": "concurso"}, {"id": "c1abe9dcad", "f": "Aumentos ou descontos <b>sucessivos</b>", "v": "Multiplique os fatores: +20% e depois −20% = 1,2 × 0,8 = 0,96 → <b>−4%</b> (não volta ao original!)", "tema": "concurso"}, {"id": "7ade9b1c81", "f": "Costas: camadas de tecido de fora para dentro", "v": "Pele → subcutâneo → fáscia → músculos (superficial, intermediária, profunda) → ossos, discos, facetas e ligamentos", "tema": "fisioterapia"}, {"id": "07faace522", "f": "Costas: os 4 músculos da camada <b>superficial</b>", "v": "Trapézio, latíssimo do dorso, romboides, levantador da escápula. Ligam a coluna à escápula e ao braço.", "tema": "fisioterapia"}, {"id": "d08f77e3bc", "f": "Costas: músculos da camada <b>intermediária</b>", "v": "Serráteis posteriores superior e inferior (relacionados à respiração)", "tema": "fisioterapia"}, {"id": "d201de257c", "f": "Costas: os 3 <b>eretores da espinha</b>", "v": "Iliocostal, longuíssimo, espinal (de lateral para medial: \"<b>I L E</b>\")", "tema": "fisioterapia"}, {"id": "e79160ca22", "f": "<b>Multífidos</b>: função", "v": "Estabilizar cada segmento (vértebra a vértebra). Fazem parte dos transversoespinais.", "tema": "fisioterapia"}, {"id": "febdd519e2", "f": "Inervação do <b>trapézio</b>", "v": "Nervo acessório (XI par craniano). ⚠️ Não são os ramos dorsais dos nervos espinais.", "tema": "fisioterapia"}, {"id": "fdf7d7977a", "f": "Partes do <b>disco intervertebral</b>", "v": "Anel fibroso (por fora) + núcleo pulposo (gelatinoso, por dentro)", "tema": "fisioterapia"}, {"id": "1a0eb26410", "f": "<b>Fáscia toracolombar</b>: conexão diagonal", "v": "Latíssimo do dorso de um lado ↔ glúteo máximo do lado oposto (diagonal posterior, usada ao andar e arremessar)", "tema": "fisioterapia"}, {"id": "68ab2e3103", "f": "3 motivos principais para as costas ficarem tensas", "v": "① ficar parado (contração leve e contínua, menos circulação) ② proteção contra dor ③ estresse (simpático), além de respiração no peito e fadiga", "tema": "fisioterapia"}, {"id": "778db5671b", "f": "O que quebra o ciclo dor–tensão", "v": "Movimento frequente, respiração diafragmática, calor, fortalecimento progressivo, sono", "tema": "fisioterapia"}, {"id": "73e08c7dfb", "f": "Os 3 <b>planos anatômicos</b>", "v": "Sagital (divide em direita e esquerda), frontal ou coronal (frente e trás), transversal (cima e baixo)", "tema": "fisioterapia"}, {"id": "5395d7a009", "f": "Contração <b>concêntrica × excêntrica × isométrica</b>", "v": "Concêntrica: o músculo encurta. Excêntrica: alonga sob tensão (ex.: descer da cadeira devagar). Isométrica: não muda o comprimento.", "tema": "fisioterapia"}, {"id": "72c5106d87", "f": "Tipos de <b>alavanca</b>", "v": "Interfixa (o eixo no meio), inter-resistente (a resistência no meio), interpotente (a força no meio, a mais comum no corpo, ex.: o bíceps no cotovelo)", "tema": "fisioterapia"}, {"id": "fcd2b8a2e8", "f": "<b>Manguito rotador</b>: os 4 músculos", "v": "Supraespinal, infraespinal, redondo menor, subescapular (mnemônico em inglês: <b>SITS</b>)", "tema": "fisioterapia"}, {"id": "bb11ff49e7", "f": "Escala de <b>força muscular</b> 0–5", "v": "0 nenhuma contração · 1 contração sem movimento · 2 move sem gravidade · 3 vence a gravidade · 4 vence resistência moderada · 5 normal", "tema": "fisioterapia"}, {"id": "e5e3b27b48", "f": "Agonista × antagonista × sinergista", "v": "Agonista: faz o movimento. Antagonista: faz o movimento oposto (e controla). Sinergista: ajuda o agonista.", "tema": "fisioterapia"}, {"id": "087a04ef9a", "f": "Partes do <b>neurônio</b>", "v": "Dendritos (recebem) → corpo celular → axônio (conduz) → terminal (libera o neurotransmissor)", "tema": "neurociencia"}, {"id": "433290d994", "f": "Potencial de repouso típico", "v": "Cerca de −70 mV (interior negativo)", "tema": "neurociencia"}, {"id": "515a51779d", "f": "Para que serve a <b>mielina</b>", "v": "Isola o axônio. O impulso \"salta\" entre os nós de Ranvier (condução saltatória), o que é muito mais rápido.", "tema": "neurociencia"}, {"id": "1c5787dec4", "f": "Principal neurotransmissor <b>excitatório</b> × <b>inibitório</b>", "v": "Excitatório: glutamato. Inibitório: GABA.", "tema": "neurociencia"}, {"id": "547ebe8bcd", "f": "Neurotransmissor da <b>junção neuromuscular</b>", "v": "Acetilcolina", "tema": "neurociencia"}, {"id": "65590b2af7", "f": "Simpático × parassimpático", "v": "Simpático: luta ou fuga (coração ↑, músculos em prontidão). Parassimpático: repouso e digestão.", "tema": "neurociencia"}, {"id": "bba6764b49", "f": "Lobos do córtex: funções-chave", "v": "Frontal: planejar, decidir, movimento. Parietal: tato e espaço. Temporal: audição e memória. Occipital: visão.", "tema": "neurociencia"}, {"id": "0db1e849ef", "f": "Cerebelo: função", "v": "Coordenação, equilíbrio, ajuste fino do movimento e aprendizagem motora", "tema": "neurociencia"}, {"id": "4ab858c480", "f": "Hipocampo × amígdala", "v": "Hipocampo: forma novas memórias. Amígdala: emoção, medo e relevância emocional.", "tema": "neurociencia"}, {"id": "51cfbcd21b", "f": "<b>LTP</b> (potenciação de longo prazo)", "v": "Uso repetido fortalece a sinapse (\"neurônios que disparam juntos se conectam\"). É uma base celular da memória.", "tema": "neurociencia"}, {"id": "0e8766fb47", "f": "Por que revisar espaçado funciona", "v": "Cada recuperação reativa e reconsolida a memória. Espaçar obriga um esforço maior de lembrar, que fortalece mais.", "tema": "neurociencia"}, {"id": "ddd81ea50a", "f": "Dopamina e atenção", "v": "O córtex pré-frontal regula atenção e funções executivas com dopamina e noradrenalina. Novidade e recompensa aumentam a dopamina.", "tema": "neurociencia"}, {"id": "c0cca85ea5", "f": "Área de Broca × Wernicke", "v": "Broca (frontal): produção da fala. Wernicke (temporal): compreensão da linguagem.", "tema": "neurociencia"}, {"id": "516f7c9b3a", "f": "Via <b>corticoespinal</b>: onde cruza", "v": "A maioria das fibras cruza no <b>bulbo</b> (decussação das pirâmides), por isso o hemisfério esquerdo controla o lado direito do corpo", "tema": "neurociencia"}, {"id": "972a25900c", "f": "FL Studio: janelas principais (teclas)", "v": "F5 Playlist · F6 Channel Rack · F7 Piano Roll · F9 Mixer", "tema": "fl-studio"}, {"id": "117d5afa1b", "f": "FL Studio: Pattern × Playlist", "v": "Pattern: um bloco (batida ou melodia) feito no Channel Rack ou no Piano Roll. Playlist: onde você organiza os patterns no tempo para montar a música.", "tema": "fl-studio"}, {"id": "213fb54d96", "f": "Envelope <b>ADSR</b>", "v": "Attack (subida), Decay (queda), Sustain (nível mantido), Release (fim depois de soltar a nota)", "tema": "fl-studio"}, {"id": "04ce305c6e", "f": "<b>Sidechain</b>: o que é", "v": "Um som (geralmente o kick) faz outro abaixar de volume (ex.: o baixo), abrindo espaço. Dá aquele efeito de \"pulsar\".", "tema": "fl-studio"}, {"id": "bb56f5d555", "f": "<b>Gain staging</b>", "v": "Manter os volumes com folga (picos longe de 0 dB, ex.: em torno de −6 dB no master) para não distorcer e sobrar espaço para a mixagem", "tema": "fl-studio"}, {"id": "2383ba96be", "f": "EQ: primeiro cuidado na maioria dos canais", "v": "Cortar graves que o instrumento não precisa (filtro passa-alta), para o grave ficar limpo para o kick e o baixo", "tema": "fl-studio"}, {"id": "0b788e671a", "f": "Reverb em <b>send</b> × no canal", "v": "No send (envio), vários canais compartilham o mesmo reverb, o que economiza CPU e \"cola\" a mix. No canal afeta só aquele som.", "tema": "fl-studio"}, {"id": "f4e40b739f", "f": "Escala maior: fórmula", "v": "T T S T T T S (tom, tom, semitom, tom, tom, tom, semitom)", "tema": "teoria-musical"}, {"id": "05dbf3467c", "f": "Escala menor natural: fórmula", "v": "T S T T S T T", "tema": "teoria-musical"}, {"id": "62f786e319", "f": "Tríades: como se formam", "v": "Maior = 3ª maior + 3ª menor. Menor = 3ª menor + 3ª maior. Diminuta = 3ª menor + 3ª menor. Aumentada = 3ª maior + 3ª maior.", "tema": "teoria-musical"}, {"id": "d79cfaa04b", "f": "Campo harmônico maior", "v": "I ii iii IV V vi vii° (em Dó: C Dm Em F G Am Bm(b5))", "tema": "teoria-musical"}, {"id": "233bd85b12", "f": "Funções harmônicas", "v": "Tônica (I, iii, vi): repouso. Subdominante (IV, ii): afastamento. Dominante (V, vii°): tensão que pede volta.", "tema": "teoria-musical"}, {"id": "e6b8e6c898", "f": "Progressão pop mais usada", "v": "I–V–vi–IV (em Dó: C–G–Am–F)", "tema": "teoria-musical"}, {"id": "f71f77a44a", "f": "Ordem dos sustenidos (ciclo das quintas)", "v": "Fá, Dó, Sol, Ré, Lá, Mi, Si", "tema": "teoria-musical"}, {"id": "b19d225836", "f": "Libras: os <b>5 parâmetros</b>", "v": "Configuração de mão, ponto de articulação, movimento, orientação da palma, expressões não manuais (rosto e corpo)", "tema": "libras"}, {"id": "561d9e48ad", "f": "Libras é universal?", "v": "Não. Cada país tem sua língua de sinais (ex.: a ASL nos EUA). A Libras tem gramática própria e não é português sinalizado.", "tema": "libras"}, {"id": "2f9082271f", "f": "Quando usar a <b>datilologia</b>", "v": "Para nomes próprios, palavras sem sinal conhecido ou para soletrar um termo novo", "tema": "libras"}, {"id": "9619118124", "f": "<b>Sinal-nome</b>", "v": "Sinal que identifica uma pessoa. É dado pela comunidade surda, não escolhido por conta própria.", "tema": "libras"}, {"id": "2ee37965a7", "f": "Lei 10.436/2002", "v": "Reconhece a Libras como meio legal de comunicação e expressão da comunidade surda no Brasil", "tema": "libras"}, {"id": "ef3140d3db", "f": "Decreto 5.626/2005", "v": "Regulamenta a Lei 10.436. Inclui a Libras como disciplina obrigatória na formação de professores e em fonoaudiologia, e optativa nos demais cursos superiores.", "tema": "libras"}, {"id": "eb031cab0f", "f": "Expressões não manuais: por que importam", "v": "São gramática, não só emoção: marcam pergunta, negação, intensidade", "tema": "libras"}];

function limparHTML(html) {
  const ok = new Set(["P", "B", "I", "U", "STRONG", "EM", "UL", "OL", "LI", "TABLE", "TR", "TD", "TH", "THEAD", "TBODY", "BR", "KBD", "SPAN", "DIV", "SMALL", "CODE", "A", "H3", "H4", "SUP", "SUB", "PRE", "HR"]);
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html"); const raiz = doc.body.firstChild;
  raiz.querySelectorAll("script,style,iframe,object,embed,link,meta").forEach(n => n.remove());
  (function limpa(n) { [...n.children].forEach(c => { if (!ok.has(c.tagName)) { c.replaceWith(...c.childNodes); return limpa(n); } [...c.attributes].forEach(at => { if (!["class", "href"].includes(at.name) || (at.name === "href" && !/^https?:/i.test(at.value))) c.removeAttribute(at.name); }); if (c.tagName === "A") c.setAttribute("target", "_blank"); limpa(c); }); })(raiz);
  return raiz.innerHTML;
}

/* ============ nuvem (artefato do Claude: db, user, assets, sample, downloads) ============
   O progresso vai para data/users/<id>/estado; a biblioteca é tratada pelo armazém (30-biblioteca.js). */
let NUVEM = null, ultimoSync = null;
function dadosDoc(r) { if (r == null) return null; if (typeof r.data === "function") return r.exists === false ? null : r.data(); if ("exists" in r && !r.exists) return null; if (r.data && typeof r.data === "object" && ("exists" in r || "id" in r)) return r.data; return r; }
let _enviando = false, _pendente = false;
async function enviarEstado() {
  if (!NUVEM) return;
  if (_enviando) { _pendente = true; return; }          /* já há um envio: reenvia ao terminar, para não perder a última mudança */
  _enviando = true;
  try { await NUVEM.col.doc("estado").set({ json: JSON.stringify(st), t: st._t || Date.now() }); ultimoSync = new Date(); registrarSync(); marcarSync(); }
  catch (e) { marcarSync("Não consegui salvar na nuvem agora. Fica salvo neste aparelho e tento de novo."); }
  finally { _enviando = false; if (_pendente) { _pendente = false; enviarEstado(); } }
}
function marcarSync(erro) { const c = document.getElementById("sync"); if (!c) return; c.classList.toggle("alerta", !!erro); c.innerHTML = ico("nuvem") + (erro ? "<b>offline</b>" : `<span class="l">salvo</span><b>${ultimoSync ? ultimoSync.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "—"}</b>`); c.title = erro || "Progresso salvo na sua conta: abre igual no PC, no notebook e no celular"; }
/* Puxa o progresso e a biblioteca. forcar === "remoto" descarta o que estiver só neste aparelho. Devolve true se algo mudou. */
async function puxarNuvem(forcar) {
  if (!NUVEM) return false; let mudou = false;
  try {
    const e = dadosDoc(await NUVEM.col.doc("estado").get());
    if (e && e.json && (forcar === "remoto" || (e.t || 0) > (st._t || 0))) { carregar(JSON.parse(e.json)); mudou = true; }
    else if (!e || (st._t || 0) > (e.t || 0)) await enviarEstado();
    if (await carregarBiblioteca()) mudou = true;
    ultimoSync = new Date(); registrarSync(); marcarSync();
  } catch (er) { marcarSync("Sem conexão com a nuvem agora."); }
  return mudou;
}
async function iniciarNuvem() {
  if (!(window.claude && typeof window.claude.use === "function")) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    NUVEM = { db, col: db.collection("data/users/" + uid) }; MODO = "nuvem";
    window.claude.use("assets").then(a => { NUVEM.assets = a; });
    window.claude.use("sample").then(sm => { NUVEM.sample = sm; INFO.ia = !!sm; });
    window.claude.use("downloads").then(d => { NUVEM.downloads = d; });
    rodape(); await puxarNuvem(); rotear();
    document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && await puxarNuvem()) rotear(); });

}

/* ==== js/30-biblioteca.js ==== */
/* ============ biblioteca (PDFs importados) ============
   O PDF é lido e organizado aqui no navegador (pdf.js + organizar.js), igual nos modos local e nuvem.
   Cada PDF vira dois arquivos no armazém: o próprio PDF e um "pacote" JSON {topicos, aulas, cartoes, textos}.
   O índice {docs, temas, anexos} diz onde cada pacote está. */
let BIB = { docs: [], temas: [], anexos: {}, aulas: {}, cartoes: [], textos: {} };
const CARDS_BASE = CARDS.slice();

/* Armazém: mesma interface nos dois modos. Nuvem → assets e db do Claude; local → servidor.py (dados/arquivos/). */
function armazem() {
  if (MODO === "nuvem") return {
    lerIndice: async () => { const b = dadosDoc(await NUVEM.col.doc("biblioteca").get()); return b && b.json ? JSON.parse(b.json) : null; },
    gravarIndice: idx => NUVEM.col.doc("biblioteca").set({ json: JSON.stringify(idx), t: Date.now() }),
    enviar: async blob => { if (!NUVEM.assets) throw new Error("Envio de arquivos indisponível nesta visualização."); const u = await NUVEM.assets.upload(blob); return { id: u.id, url: u.url || "/_blob/" + u.id }; },
    apagar: async id => { if (NUVEM.assets) await NUVEM.assets.delete(id); },
  };
  if (MODO === "local") return {
    lerIndice: () => api("/api/biblioteca"),
    gravarIndice: idx => api("/api/biblioteca", { method: "PUT", ...json(idx) }),
    enviar: blob => api("/api/arquivos", { method: "POST", headers: { "Content-Type": blob.type }, body: blob }),
    apagar: id => api("/api/arquivos/" + encodeURIComponent(id), { method: "DELETE" }),
  };
  return null;
}
const indiceAtual = () => ({ docs: BIB.docs, temas: BIB.temas, anexos: BIB.anexos, vinculo: BIB.vinculo });
function mesclar() { CARDS.length = 0; CARDS.push(...CARDS_BASE, ...BIB.cartoes); }

/* Lê o índice e baixa os pacotes. Só rebaixa se a lista de PDFs mudou. Devolve true se mudou. */
async function carregarBiblioteca() {
  const A = armazem(); if (!A) return false;
  const idx = { docs: [], temas: [], anexos: {}, ...((await A.lerIndice()) || {}) };
  if (BIB._ok && idx.docs.map(d => d.id).join() === BIB.docs.map(d => d.id).join()) return false;
  const nova = { ...idx, aulas: {}, cartoes: [], textos: {}, _ok: true };
  for (const d of idx.docs) {
    try { const pk = await (await fetch(d.pacoteUrl)).json(); Object.assign(nova.aulas, pk.aulas); Object.assign(nova.textos, pk.textos); nova.cartoes.push(...pk.cartoes.map(c => ({ ...c, tema: d.tema, doc: d.id }))); }
    catch (e) { /* pacote inacessível: o PDF continua listado, sem aulas */ }
  }
  BIB = nova;
  if (vincularAntigos()) await A.gravarIndice(indiceAtual());
  mesclar(); return true;
}

/* Uma vez só: temas que o import antigo criou para cada PDF ("pdf-…") viram seções do tema certo, se houver um.
   Os ids dos tópicos não mudam, então o progresso dela continua. */
function vincularAntigos() {
  if (BIB.vinculo >= 2) return false;
  const base = [...TEMAS, ...st.temasUser];
  for (const t of BIB.temas.slice()) {
    const d = BIB.docs.find(x => x.id === t.doc); if (!d) continue;
    const tops = t.disciplinas.flatMap(x => x.topicos);
    const alvo = ORG.escolherTema({ doc: d, topicos: tops, textos: Object.fromEntries(tops.map(x => [x.id, BIB.textos[x.id] || ""])) }, base);
    if (!alvo) continue;
    BIB.temas = BIB.temas.filter(x => x !== t);
    (BIB.anexos[alvo.id] ||= []).push({ id: "d-" + d.id, nome: limparNome(t.nome).slice(0, 50), doc: d.id, topicos: tops });
    d.tema = alvo.id; BIB.cartoes.forEach(c => { if (c.doc === d.id) c.tema = alvo.id; });
  }
  BIB.vinculo = 2; return true;
}

let _pdfjs;
function carregarPDFjs() {
  if (_pdfjs) return _pdfjs;
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  const sc = src => new Promise((ok, falha) => { const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = () => falha(new Error("Não consegui carregar o leitor de PDF (pdf.js). Importar PDF precisa de internet.")); document.head.appendChild(el); });
  _pdfjs = sc(base + "pdf.worker.min.js").then(() => sc(base + "pdf.min.js")).then(() => { const lib = window.pdfjsLib || window["pdfjs-dist/build/pdf"]; lib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js"; return lib; });
  _pdfjs.catch(() => { _pdfjs = null; });
  return _pdfjs;
}

/* destino: "auto" (padrão) anexa ao tema que já trata do assunto e só cria tema se nenhum combinar;
   "novo" sempre cria um tema; um id de tema anexa as seções a ele. */
async function importarPDF(f, destino, nomeTema) {
  const A = armazem(); if (!A) throw new Error("Importar PDF precisa do estudaai rodando no PC ou na nuvem.");
  const buf = await f.arrayBuffer(); const lib = await carregarPDFjs();
  const ext = await ORG.lerPDF(lib, buf.slice(0));
  const nome = f.name.replace(/\.pdf$/i, ""); const docId = slug(nome, 18) + "-" + sufixo(4);
  const r = ORG.organizar(ext, nome, docId);
  if (!r.topicos.length) throw new Error("Não encontrei texto. O PDF pode ser escaneado (imagem).");
  const pdf = await A.enviar(new Blob([buf], { type: "application/pdf" }));
  const pk = await A.enviar(new Blob([JSON.stringify({ topicos: r.topicos, aulas: r.aulas, cartoes: r.cartoes, textos: r.textos })], { type: "application/json" }));
  let temaId;
  if (!destino || destino === "auto") { const alvo = ORG.escolherTema(r, todosTemas()); destino = alvo ? alvo.id : "novo"; }
  if (destino === "novo") { temaId = "pdf-" + docId; BIB.temas.push({ id: temaId, nome: (nomeTema || r.doc.titulo).slice(0, 50), cor: corLivre(), desc: `Criado a partir de ${f.name} (${r.doc.paginas} páginas).`, doc: docId, disciplinas: [{ id: "d-" + docId, nome: "Seções do PDF", topicos: r.topicos }] }); }
  else { temaId = destino; (BIB.anexos[destino] ||= []).push({ id: "d-" + docId, nome: (r.doc.titulo || nome).slice(0, 50), doc: docId, topicos: r.topicos }); }
  const doc = { ...r.doc, tema: temaId, arquivo: f.name, importado: new Date().toLocaleString("pt-BR"), pdfAsset: pdf.id, pdfUrl: pdf.url, pacoteAsset: pk.id, pacoteUrl: pk.url };
  BIB.docs.push(doc); Object.assign(BIB.aulas, r.aulas); Object.assign(BIB.textos, r.textos); BIB.cartoes.push(...r.cartoes.map(c => ({ ...c, tema: temaId, doc: docId }))); mesclar();
  await A.gravarIndice(indiceAtual());
  return doc;
}
async function removerPDF(id) {
  const A = armazem(); const d = BIB.docs.find(x => x.id === id); if (!A || !d) return;

/* FSRS-4.5: modelo de memória DSR (dificuldade, estabilidade, recuperabilidade) do projeto open-spaced-repetition,
   o mesmo algoritmo que o Anki usa hoje. Pesos padrão do FSRS-4.5; retenção desejada de 90%. */
const FSRS = {
  W: [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755],
  DECAY: -0.5, FACTOR: 19 / 81,
  R(t, S) { return Math.pow(1 + this.FACTOR * t / S, this.DECAY); },
  D0(g) { return Math.min(10, Math.max(1, this.W[4] - (g - 3) * this.W[5])); },
  proximo(s, g) {               /* g: 1 errei, 2 difícil, 3 bom, 4 fácil */
    const W = this.W; let S, D;
    if (!s || !s.S) { S = W[g - 1]; D = this.D0(g); }
    else {
      const t = Math.max(0, (new Date(hojeStr() + "T00:00:00") - new Date((s.ultima || hojeStr()) + "T00:00:00")) / 864e5);
      const R = this.R(t, s.S); D = s.D;
      if (g === 1) S = W[11] * Math.pow(D, -W[12]) * (Math.pow(s.S + 1, W[13]) - 1) * Math.exp(W[14] * (1 - R));
      else S = s.S * (1 + Math.exp(W[8]) * (11 - D) * Math.pow(s.S, -W[9]) * (Math.exp(W[10] * (1 - R)) - 1) * (g === 2 ? W[15] : 1) * (g === 4 ? W[16] : 1));
      D = Math.min(10, Math.max(1, W[7] * this.D0(4) + (1 - W[7]) * (D - W[6] * (g - 3))));
    }
    const int = g === 1 ? 0 : Math.max(1, Math.min(36500, Math.round(S)));
    return { S, D, int };
  }
};
function responderCartao(c, nota) {
  const ant = st.cards[c.id]; const novo = !ant || !ant.S; const g = nota + 1;
  const r = FSRS.proximo(novo ? null : ant, g);
  const s = { S: r.S, D: r.D, int: r.int, n: ((ant && ant.n) || 0) + 1, lapsos: ((ant && ant.lapsos) || 0) + (g === 1 ? 1 : 0), ultima: hojeStr(), prox: addDias(r.int) };
  st.cards[c.id] = s; if (novo) st.novos.n++; marcarDia(.2); salvar();
}

/* ============ acrescentou.ai: núcleo do contador de foco (sem DOM, testado em testes/foco.test.js) ============
   O número só cresce: cada bloco FECHADO de foco vale +1 soma. O tempo total guarda todos os segundos, à parte.
   Uma sessão: { tipo, ref, rotulo, cat, bloco (s), ini (ms), seg (s acumulados), desde (ms do trecho rodando, ou null se pausada), ultimo (ms do último sinal de atividade) }. */
const FOCO = (() => {
  const BLOCO = { aula: 20 * 60, cartoes: 20 * 60, ia: 20 * 60, prepara: 20 * 60, manual: 30 * 60 };
  const OCIOSO = 5 * 60;          /* atividades automáticas pausam depois de 5 min sem clique, tecla ou rolagem */
  const MINIMO = 60;              /* sessões com menos de 1 min não entram no histórico */
  const NOMES = { aula: "Aulas", cartoes: "Cartões", ia: "Revisão com IA", prepara: "prepara.ai", manual: "Foco livre" };
  const dia = ms => { const d = new Date(ms); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

  const novo = (tipo, ref, rotulo, agora) => ({ tipo, ref: ref || null, rotulo: rotulo || NOMES[tipo] || "", cat: null, bloco: BLOCO[tipo] || BLOCO.manual, ini: agora, seg: 0, desde: agora, ultimo: agora });
  const decorrido = (s, agora) => s.seg + (s.desde != null ? Math.max(0, agora - s.desde) / 1000 : 0);
  function pausar(s, agora) { if (s.desde != null) { s.seg = decorrido(s, agora); s.desde = null; } return s; }
  function retomar(s, agora) { if (s.desde == null) s.desde = agora; s.ultimo = agora; return s; }
  /* Sinal de atividade (clique, tecla, rolagem). Se o último sinal foi há mais de 5 min, o intervalo não conta. */
  function atividade(s, agora) {
    if (s.desde != null && (agora - s.ultimo) / 1000 > OCIOSO) { pausar(s, s.ultimo); s.desde = agora; }
    else if (s.desde == null) s.desde = agora;
    s.ultimo = agora; return s;
  }
  /* Chamada a cada segundo nas atividades automáticas. Devolve true se acabou de pausar por ócio. */
  function verificarOcio(s, agora) { if (s.desde != null && (agora - s.ultimo) / 1000 > OCIOSO) { pausar(s, s.ultimo); return true; } return false; }

  function placar(seg, bloco) { seg = Math.floor(seg); return { seg, somas: Math.floor(seg / bloco), resto: seg % bloco, falta: bloco - seg % bloco, p: (seg % bloco) / bloco }; }
  function encerrar(s, agora) {
    pausar(s, agora); const p = placar(s.seg, s.bloco);
    return { id: s.ini.toString(36) + Math.random().toString(36).slice(2, 5), tipo: s.tipo, ref: s.ref, rotulo: s.rotulo, cat: s.cat, tema: s.tema || null, dia: dia(s.ini), ini: s.ini, fim: agora, seg: p.seg, bloco: s.bloco, somas: p.somas };
  }

  /* Totais por dia, por tipo de atividade e por categoria. */
  function resumo(regs) {
    const r = { total: { seg: 0, somas: 0, n: 0 }, dia: {}, tipo: {}, cat: {}, tema: {} };
    const soma = (o, k, x) => { if (k == null) return; const v = o[k] ||= { seg: 0, somas: 0, n: 0 }; v.seg += x.seg; v.somas += x.somas; v.n++; };
    for (const x of regs) { r.total.seg += x.seg; r.total.somas += x.somas; r.total.n++; soma(r.dia, x.dia, x); soma(r.tipo, x.tipo, x); soma(r.cat, x.cat, x); soma(r.tema, x.tema, x); }
    return r;
  }

  const dur = seg => { const m = Math.floor(seg / 60); return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0") + " min"; };
  const relogio = seg => { seg = Math.floor(seg); const h = Math.floor(seg / 3600), m = Math.floor(seg / 60) % 60, s = seg % 60; return (h ? h + ":" + String(m).padStart(2, "0") : String(m).padStart(2, "0")) + ":" + String(s).padStart(2, "0"); };

  return { BLOCO, OCIOSO, MINIMO, NOMES, dia, novo, decorrido, pausar, retomar, atividade, verificarOcio, placar, encerrar, resumo, dur, relogio };
})();
if (typeof module !== "undefined") module.exports = FOCO;

/* ============ prepara.ai: núcleo (sem DOM, testado em testes/prepara.test.js) ============
   Contas do plano de mudança: capital líquido, matriz de rotas, progresso das imersões, Go/No-Go e o .md do plano.
   O conteúdo (textos, rotas, marcos) fica em fonte/prepara-mudanca.js (const PREPARA). */
const PREP = (() => {
  /* "1.234,56" | "1234.56" | "R$ 2 mil" → número. Vazio → 0. */
  function num(v) {
    if (typeof v === "number") return isFinite(v) ? v : 0;
    let s = String(v == null ? "" : v).trim().toLowerCase().replace(/r\$|€|us\$|\s/g, "");
    if (!s) return 0;
    let mult = 1; if (s.endsWith("mil")) { mult = 1000; s = s.slice(0, -3); } else if (s.endsWith("k")) { mult = 1000; s = s.slice(0, -1); }
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
    const n = parseFloat(s); return isFinite(n) ? n * mult : 0;
  }
  const brl = n => "R$ " + Math.round(n).toLocaleString("pt-BR");

  /* Dinheiro disponível no dia da partida.
     bens: [{nome, valor, vendido}] (conta tudo, vendido ou não, como estimativa; "jaVendido" separa o que já entrou). */
  function capital(r, bens) {
    const b = (bens || []).reduce((a, x) => a + num(x.valor), 0);
    const jaVendido = (bens || []).filter(x => x.vendido).reduce((a, x) => a + num(x.valor), 0);
    const entradas = num(r.din_hoje) + num(r.din_mes) * num(r.din_meses) + b;
    const saidas = num(r.din_divida) + num(r.din_contas) + num(r.din_saida);
    const liquido = entradas - saidas;
    const meta = num(r.din_meta);
    return { bens: b, jaVendido, entradas, saidas, liquido, meta, falta: meta ? Math.max(0, meta - liquido) : null };
  }

  /* Matriz de decisão: notas[rota][criterio] de 1 a 5, pesos[criterio] de 1 a 3. Rotas sem nota ficam de fora. */
  function matriz(rotas, criterios, notas, pesos) {
    const max = criterios.reduce((a, c) => a + 5 * (pesos[c.id] || c.peso || 1), 0);
    return rotas.map(rt => {
      const n = notas[rt.id] || {}; const preenchido = criterios.filter(c => n[c.id]).length;
      const total = criterios.reduce((a, c) => a + (num(n[c.id]) || 0) * (pesos[c.id] || c.peso || 1), 0);
      return { id: rt.id, nome: rt.nome, total, max, pct: max ? total / max : 0, preenchido, completo: preenchido === criterios.length };
    }).filter(x => x.preenchido).sort((a, b) => b.total - a.total || a.nome.localeCompare(b.nome));
  }

  /* Uma tarefa conta como feita quando o check está marcado ou o campo tem resposta. */
  const feita = (t, r) => t.tipo === "check" ? !!r[t.id] : t.tipo === "widget" ? !!r["w_" + t.id] : String(r[t.id] == null ? "" : r[t.id]).trim() !== "";
  function progresso(imersao, r) {
    const ts = imersao.faca || []; const f = ts.filter(t => feita(t, r)).length;
    return { feitas: f, total: ts.length, p: ts.length ? f / ts.length : 0 };
  }
  function geral(imersoes, r, concluidas) {
    const ps = imersoes.map(i => progresso(i, r)); const feitas = ps.reduce((a, p) => a + p.feitas, 0), total = ps.reduce((a, p) => a + p.total, 0);
    return { feitas, total, p: total ? feitas / total : 0, concluidas: imersoes.filter(i => concluidas[i.id]).length, imersoes: imersoes.length };
  }

  /* Go/No-Go: só é "vai" se TODOS os critérios críticos estiverem marcados. */
  function gonogo(itens, r) {
    const crit = itens.filter(i => i.critico), faltam = crit.filter(i => !r["go_" + i.id]);
    const extras = itens.filter(i => !i.critico && !r["go_" + i.id]);
    return { vai: faltam.length === 0, faltam, extras, marcados: itens.filter(i => r["go_" + i.id]).length, total: itens.length };
  }

  /* Idade dentro da faixa de 18 a 30 dos programas Working Holiday para brasileiros (Japão, França, Alemanha, Austrália, NZ). */
  function faixaWH(idade) { const n = num(idade); if (!n) return null; return n >= 18 && n <= 30; }

  /* Marcos com status em relação a hoje (iso "AAAA-MM-DD"). */
  function marcos(lista, hojeIso, r) {
    return lista.map(m => ({ ...m, feito: !!r["m_" + m.id], passou: m.data < hojeIso, dias: Math.round((Date.parse(m.data) - Date.parse(hojeIso)) / 864e5) }));
  }
  /* Marcos editáveis: os padrão com as trocas dela (marcosEd[id] = {data, t}) + os que ela criou (marcosExtra), em ordem de data. */
  function listaMarcos(P, est) {
    const ed = est.marcosEd || {};
    const base = P.marcos.map(m => ed[m.id] ? { ...m, ...ed[m.id], editado: true } : { ...m });
    const extra = (est.marcosExtra || []).map(m => ({ decisao: false, ...m, proprio: true }));
    return base.concat(extra).sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
  }

  /* Rota A/B guardam o id da rota; texto antigo (livre) continua aparecendo como foi escrito. */
  function rotaNome(rotas, v) { const x = rotas.find(r => r.id === v); return x ? x.nome : String(v == null ? "" : v); }
  /* Comprovação mínima da rota em reais. Sem cotação daquela moeda, reais = null (nunca chuta câmbio). */
  const COTACAO = { EUR: "cot_eur", USD: "cot_usd" };
  function metaRota(rota, r) {
    if (!rota || !rota.comprova) return null;
    const [valor, moeda] = rota.comprova, cot = COTACAO[moeda] ? num(r[COTACAO[moeda]]) : 0;

  /* Lembrete semanal na Início: só depois que ela começou, e 7 dias depois da última revisão dos marcos. */
  function revisaoVencida(est, hojeIso) {

    if (!comecou) return false;
    if (!est.revisado) return true;
    return (Date.parse(hojeIso) - Date.parse(est.revisado)) / 864e5 >= 7;
  }

  /* Pedido para a IA do app revisar o plano (usa a mesma cadeia da revisão: assinatura → APIs → Gemini → chat). */
  function promptIA(P, est, hojeIso) {
    return `Você é uma consultora de mudança internacional, honesta e direta. Revise o plano abaixo de uma brasileira de Campo Grande/MS (área de TI: QA e suporte) que quer estar no avião em ${P.meta.dataBR}, de forma LEGAL, gastando o mínimo possível, com trabalho já previsto e um caminho de carreira em TI. A estratégia dela: ${P.estrategia ? P.estrategia.titulo + " (" + P.estrategia.passos.map(p => p.t).join(" → ") + ")" : "rota barata com renda garantida"}.

Responda em português do Brasil, em Markdown, com blocos curtos e nesta ordem:
1. **Os 3 maiores riscos** do plano (o que pode dar errado e quando), do mais grave ao menos grave.
2. **Contas que não fecham**: compare o capital líquido com o custo de saída + comprovação da rota A + 2 meses de custo de vida + passagem de volta. Aponte onde dá para gastar menos sem ilegalidade.
3. **Trabalho previsto**: o que falta para ela embarcar com renda fechada (vaga remota, local ou freelas) e se o trampolim de carreira faz sentido.
4. **Datas apertadas**: marcos que dependem de algo que ela não controla (vaga, agendamento, consulado).
5. **Uma ideia fora do comum** (e legal) que ela ainda não considerou.
6. **O que eu faria nesta semana**: no máximo 3 ações, cada uma com o site oficial onde conferir.

Regras: não invente regra de imigração, valor ou prazo. Se não tiver certeza, diga "não tenho certeza" e mande conferir no site oficial do governo do destino. Os dados foram conferidos em ${P.meta.verificadoBR}; se souber de mudança posterior, avise.

---

${markdown(P, est, hojeIso)}`;
  }

  /* O plano inteiro em Markdown, para guardar, imprimir ou mandar para uma IA revisar. */
  function markdown(P, est, hojeIso) {
    const r = est.r || {}, L = [];
    const v = x => String(x == null ? "" : x).trim();
    L.push(`# Meu plano de mudança (prepara.ai)`, ``, `Gerado em ${hojeIso}. Meta: sair do Brasil até ${P.meta.dataBR}. Informações verificadas em ${P.meta.verificadoBR}; confira sempre na fonte oficial.`, ``);
    L.push(`## A pergunta que estou respondendo`, ``, P.pergunta.texto, ``);

        if (t.tipo === "check") return `- [${r[t.id] ? "x" : " "}] ${t.rotulo}`;
        const resp = v(r[t.id]); const op = t.opcoes && t.opcoes.find(o => o[0] === resp);

      });
      if (!linhas.length) continue;
      L.push(`## ${im.n}. ${im.titulo}${est.concluidas && est.concluidas[im.id] ? " ✔" : ""}`, ``, ...linhas, ``);
    }
    const c = capital(r, est.bens);
    L.push(`## Dinheiro`, ``, `- Bens para vender: ${brl(c.bens)} (já vendido: ${brl(c.jaVendido)})`, `- Entradas até a partida: ${brl(c.entradas)}`, `- Saídas (dívidas, contas, custo de saída): ${brl(c.saidas)}`, `- **Capital líquido no embarque: ${brl(c.liquido)}**`);
    if (c.meta) L.push(`- Meta da rota: ${brl(c.meta)} · ${c.falta ? "faltam " + brl(c.falta) : "meta atingida"}`);
    if ((est.bens || []).length) L.push(``, `| Item | Valor | Vendido |`, `|---|---|---|`, ...est.bens.map(b => `| ${v(b.nome) || "-"} | ${brl(num(b.valor))} | ${b.vendido ? "sim" : "não"} |`));

    if (/^\s*```/.test(l)) { fecha(); code = []; continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)/))) { fecha(); const h = m[1].length <= 2 ? "h3" : "h4"; out.push(`<${h}>${inl(m[2])}</${h}>`); continue; }
    if (/^\s*\|/.test(l)) { if (lista || para.length) fecha(); if (!/^\s*\|?[\s:|-]+\|?\s*$/.test(l)) (tab ||= []).push(l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim())); continue; }
    if ((m = l.match(/^\s*([-*+]|\d+[.)])\s+(.*)/))) { const tipo = /\d/.test(m[1]) ? "ol" : "ul"; if (para.length || tab || lista !== tipo) { fecha(); out.push(`<${tipo}>`); lista = tipo; } out.push(`<li>${inl(m[2])}</li>`); continue; }
    if (/^\s*>/.test(l)) { fecha(); out.push(`<p class="cita">${inl(l.replace(/^\s*>\s?/, ""))}</p>`); continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { fecha(); out.push("<hr>"); continue; }
    if (!l.trim()) { fecha(); continue; }
    if (lista && /^\s{2,}\S/.test(l)) { out[out.length - 1] = out[out.length - 1].replace(/<\/li>$/, `<br>${inl(l.trim())}</li>`); continue; }
    if (lista || tab) fecha();
    para.push(l.trim());
  }
  if (code) out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
  fecha();
  return limparHTML(out.join(""));
}

/* ---------- arquivos e área de transferência ---------- */

/* ============ próximo passo ============
   O plano do dia tem até 4 passos: cartões → revisão de aula vencida → aula do tema principal → aula de "recompensa". */
function plano() {
  const passos = [];
  const fila = filaCartoes("todos");
  passos.push({ id: "cartoes", tipo: "Revisão espaçada", titulo: fila.length ? `Revisar ${fila.length} cartões` : "Cartões em dia", sub: "Cerca de 10 minutos", href: "#revisar", vazio: !fila.length, cor: "var(--ac)", icone: "revisar" });
  const revs = []; for (const t of todosTemas()) for (const x of topicos(t)) if (situacao(x.id) === "revisar" && aula(x.id)) revs.push({ t, x });
  if (revs.length) { const { t, x } = revs[0]; passos.push({ id: "rev-" + x.id, tipo: "Revisar aula", titulo: aula(x.id).titulo, sub: t.nome + " · refazer o teste", href: "#aula-" + x.id + "-teste", tema: t }); }
  const p = tema(st.principal) || todosTemas()[0];
  const prox = proximaAula(p);
  if (prox) passos.push(passoAula(prox, p, "Aula principal"));
  const outros = todosTemas().filter(t => t.id !== p.id);
  const rot = outros[(new Date().getDate()) % Math.max(outros.length, 1)];
  const pref = outros.find(t => proximaAula(t) && aula(proximaAula(t).id) && t.id === (st.recompensa || "fisioterapia")) || outros.find(t => proximaAula(t) && aula(proximaAula(t).id)) || rot;
  if (pref) { const r = proximaAula(pref); if (r) passos.push(passoAula(r, pref, "Recompensa")); }
  passos.forEach(x => { x.feito = st.hoje.feitos.includes(x.id) || (x.id === "cartoes" && x.vazio && Object.keys(st.cards).length > 0); if (x.tema) { x.cor = x.tema.cor; x.icone = null; } });
  return passos;
}
function passoAula(x, t, tipo) {
  const a = aula(x.id);
  return { id: "aula-" + x.id, tipo, titulo: a ? a.titulo : x.t, sub: t.nome + (a ? "" : " · ainda sem aula: gere na trilha"), href: a ? "#aula-" + x.id : "#tema-" + t.id, tema: t };
}
function proximaAula(t) {
  const ts = topicos(t).filter(x => situacao(x.id) === "novo");
  const com = ts.filter(x => aula(x.id)); const lista = com.length ? com : ts;
  return lista.sort((a, b) => (b.p || 2) - (a.p || 2))[0] || null;
}

function passoLembre(el, a, tid) {

/* Teste: uma questão por vez. A resposta fica guardada (s.resp) e reaparece ao voltar à questão;
   o placar leva a qualquer questão; o botão "Próximo" de baixo anda pelas questões antes de ir ao passo seguinte. */
function passoTeste(el, a, tid, nav) {
  const qz = a.quiz; const s = sessao; s.resp ||= {};
  const placar = () => `<div class="placar" role="group" aria-label="Questões">${qz.map((_, k) => `<button class="${s.quiz[k] === true ? "c" : s.quiz[k] === false ? "e" : ""} ${k === s.qi ? "on" : ""}" data-q="${k}" aria-label="Questão ${k + 1}${s.quiz[k] === undefined ? "" : s.quiz[k] ? ", acertou" : ", errou"}"></button>`).join("")}</div>`;
  const ir = i => { s.qi = Math.max(0, Math.min(i, qz.length)); desenhar(); };
  const feedback = (i, rolar) => {
    const q = qz[i]; const k = s.resp[i]; const certo = s.quiz[i];
    el.querySelectorAll(".opt").forEach(b => { b.disabled = true; const bk = +b.dataset.k; if (bk === q.a) b.classList.add("certa"); else if (bk === k) b.classList.add("errada"); });
    $("#fb").innerHTML = `<div class="exp"><b>${certo ? "Isso!" : "Quase."}</b> ${esc(q.e || "")}</div><div class="row" style="margin-top:10px"><button class="btn pri" id="seg">${i + 1 < qz.length ? "Próxima questão" : "Ver resultado"}${ico("seta")}</button></div>`;
    $("#seg").onclick = () => ir(i + 1);
    if (rolar) $("#fb").scrollIntoView({ behavior: "smooth", block: "nearest" });
  };
  const desenhar = () => {
    const i = s.qi;
    if (nav) nav(i < qz.length ? (i + 1 < qz.length ? "Próxima questão" : "Ver resultado") : null, () => ir(i + 1));
    if (i >= qz.length) {
      const ac = Object.values(s.quiz).filter(Boolean).length; const resp = Object.keys(s.quiz).length;
      el.innerHTML = `<div class="q"><h3>Resultado: ${ac} de ${qz.length}</h3>${placar()}<p class="sub">${resp < qz.length ? `Faltam ${qz.length - resp} questões: toque numa barrinha cinza para responder.` : ac / qz.length >= .8 ? "Excelente. Agora explique com suas palavras." : ac / qz.length >= .6 ? "Bom. Os erros vão para a Revisão com IA." : "Normal errar no começo. A Revisão com IA explica cada erro."}</p><div class="row"><button class="btn" id="refazer">${ico("refazer")}Refazer o teste</button></div></div>`;
      $("#refazer").onclick = () => { s.quiz = {}; s.resp = {}; s.qi = 0; desenhar(); };
    } else {
      const q = qz[i]; const ordem = s["ord" + i] ||= shuffle(q.o.map((_, k) => k));
      el.innerHTML = `<div class="q">${placar()}<span class="eyebrow">Questão ${i + 1} de ${qz.length}</span><h3>${esc(q.q)}</h3>${ordem.map((k, n) => `<button class="opt" data-k="${k}"><b class="letra">${"ABCDEFG"[n]}</b>${esc(q.o[k])}</button>`).join("")}<div id="fb" aria-live="polite"></div></div>`;
      if (s.quiz[i] !== undefined) feedback(i, false);
      else el.querySelectorAll(".opt").forEach(b => b.onclick = () => { const k = +b.dataset.k; s.resp[i] = k; s.quiz[i] = k === q.a; feedback(i, true); el.querySelector(".placar").outerHTML = placar(); ligarPlacar(); });
    }
    ligarPlacar();
  };
  const ligarPlacar = () => el.querySelectorAll(".placar button").forEach(b => b.onclick = () => ir(+b.dataset.q));
  desenhar();
}
function passoExplique(el, a, tid) {
  const f = a.feynman || { pergunta: "Explique o tema com suas palavras.", chaves: [] };
  const n = (st.notas[tid] || {}).feynman || "";
  el.innerHTML = `<div class="lembre"><p class="sub">Técnica Feynman: se você consegue explicar de forma simples, você entendeu. As palavras-chave acendem quando aparecem no seu texto.</p><label for="fey">${esc(f.pergunta)}</label><textarea id="fey" style="min-height:150px" placeholder="Explique como se fosse para alguém de 12 anos…">${esc(n)}</textarea><div class="row" id="chaves"></div></div>`;
  const ta = $("#fey"); const norm = s => semAcento(s.toLowerCase());
  const pinta = () => { const v = norm(ta.value); $("#chaves").innerHTML = f.chaves.map(c => `<span class="pill ${v.includes(norm(c)) ? "ok" : ""}">${esc(c)}</span>`).join("") + `<span class="sub" style="font-size:13px">${f.chaves.filter(c => v.includes(norm(c))).length}/${f.chaves.length} palavras-chave</span>`; };
  ta.oninput = () => { st.notas[tid] ||= {}; st.notas[tid].feynman = ta.value; salvar(); pinta(); }; pinta();
}
function passoFeito(el, a, tid, info) {
  const s = sessao; const tot = a.quiz.length; const feitos = Object.keys(s.quiz).length; const ac = Object.values(s.quiz).filter(Boolean).length;
  const pos = () => `<p class="exp ok" style="margin-top:12px">${ico("check")}<span>Respostas registradas. Elas aguardam na <b>Revisão com IA</b> (${pendentesIA().length} na fila): junte quantas aulas quiser e mande revisar de uma vez.</span></p><div class="row"><a class="btn pri" href="#ia">${ico("brilho")}Ir para a Revisão com IA</a><a class="btn" href="#inicio">Próximo passo do dia</a><a class="btn ghost" href="#tema-${info.tema.id}">Voltar à trilha</a></div>`;
  el.innerHTML = `<div class="conteudo"><article class="bloco"><h3>Fechar a aula</h3>
    <p>${feitos === tot ? `Você acertou <b>${ac} de ${tot}</b> no teste.` : `Você respondeu ${feitos} de ${tot} questões. Dá para registrar assim mesmo, ou voltar ao <a href="#aula-${tid}-teste">Teste</a>.`}</p>
    <p class="sub">Registrar guarda suas alternativas, o Lembre e o Feynman para a Revisão com IA conferir com o material e com fontes da internet.</p>
    <div class="row"><button class="btn pri" id="reg" ${s.registrada ? "disabled" : ""}>${ico("check")}Registrar respostas</button></div><div id="pos">${s.registrada ? pos() : ""}</div></article>
    ${ultimoPlacar && ultimoPlacar.ref === tid && Date.now() - ultimoPlacar.fim < 6e5 ? `<article class="bloco placar-bloco">${placarHTML(ultimoPlacar)}</article>` : ""}
    <article class="bloco" id="curios"></article>
    ${a.fontes && a.fontes.length ? `<article class="bloco"><h3>Para ir além</h3><ul>${a.fontes.map(x => `<li>${esc(x)}</li>`).join("")}</ul></article>` : ""}</div>`;
  $("#reg").onclick = () => {
    registrarAula(tid, ac, feitos); registrarTentativa(tid, a, s);
    marcarFeito("aula-" + tid, "rev-" + tid); s.registrada = true; salvar();
    $("#pos").innerHTML = pos(); $("#reg").disabled = true; topo("temas");
  };
  blocoDuvidas($("#curios"), tid);
}
/* Campo aberto do fim da aula: curiosidades e dúvidas para pesquisar depois (viram o arquivo semanal). */
function blocoDuvidas(el, tid) {
