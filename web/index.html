<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>estudaai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   estudaai: visual
   Escuro, sóbrio, uma cor por tema. A variável --c é a cor do tema
   e pinta tudo o que estiver dentro do elemento que a define:
   botão principal, barra de progresso, passos da aula, ícone.
   ============================================================ */
:root {
  --bg: #0b0e14; --s1: #11151d; --s2: #171c26; --s3: #1f2531;
  --line: #232a37; --line2: #2f3747;
  --tx: #e7eaf0; --tx2: #c9cfdb; --mu: #9aa3b5; --mu2: #7c8597;   /* --mu2 ≥ 4.5:1 sobre --bg (antes 4.1:1) */
  --ac: #7f9cff; --ok: #4fcf86; --warn: #f2a35b; --bad: #ff7d86; --teal: #35c9bd;
  --on-c: #0b0e14;
  --fd: "Plus Jakarta Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --fb: "Figtree", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --r: 14px; --r2: 10px;
  --c: var(--ac);
  color-scheme: dark;
}
/* Tons derivados da cor do tema, recalculados em cada elemento (por isso no seletor universal). */
*, ::before, ::after {
  box-sizing: border-box;
  --c-soft: color-mix(in srgb, var(--c) 14%, transparent);
  --c-tint: color-mix(in srgb, var(--c) 7%, var(--s1));
  --c-line: color-mix(in srgb, var(--c) 45%, transparent);
}
html, body { margin: 0; background: var(--bg); color: var(--tx); font-family: var(--fb); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--fd); line-height: 1.2; text-wrap: balance; margin: 0; font-weight: 700; letter-spacing: -.01em; }
h1 { font-size: clamp(24px, 3vw, 30px); }
h2 { font-size: 18px; }
h3 { font-size: 16px; }
p { margin: 0; }
a { color: var(--ac); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; border-radius: 8px; }
.i { width: 18px; height: 18px; flex: none; }
code { font-size: .92em; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- topo ---------- */
.top { position: sticky; top: 0; z-index: 20; background: rgba(11, 14, 20, .86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .in { max-width: 1120px; margin: 0 auto; padding: 0 20px; height: 60px; display: flex; align-items: center; gap: 28px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--fd); font-weight: 800; font-size: 18px; text-decoration: none; color: var(--tx); }
.logo .bars { display: flex; gap: 3px; align-items: flex-end; height: 20px; }
.logo .bars i { display: block; width: 5px; border-radius: 3px; }
nav.tabs { display: flex; gap: 2px; }
nav.tabs a { position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; color: var(--mu); text-decoration: none; font-weight: 600; font-size: 14.5px; transition: color .15s, background .15s; }
nav.tabs a:hover { color: var(--tx); background: var(--s1); }
nav.tabs a.on { color: var(--tx); background: var(--s2); }
nav.tabs a.on .i { color: var(--ac); }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--c); color: var(--on-c); font-size: 11.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
nav.tabs .badge { background: var(--ac); }
.chipbar { margin-left: auto; display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; color: var(--mu); white-space: nowrap; }
.chip .i { width: 15px; height: 15px; }
.chip b { color: var(--tx); font-variant-numeric: tabular-nums; }
.chip.quente .i { color: var(--warn); }
.chip.alerta { border-color: rgba(255, 125, 134, .4); color: var(--bad); }

/* ---------- estrutura ---------- */
main { max-width: 1120px; margin: 0 auto; padding: 28px 20px 96px; display: grid; gap: 28px; }
footer { max-width: 1120px; margin: 0 auto; padding: 0 20px 32px; color: var(--mu2); font-size: 13px; }
footer a { color: var(--mu); }
.cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.cab .sub { margin-top: 6px; max-width: 70ch; }
.titulo-sec { margin-bottom: 12px; }
h2.titulo-sec { font-size: 13px; font-family: var(--fb); color: var(--mu); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
.bloco { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--mu); font-weight: 600; }
.sub { color: var(--mu); }
.rotulo { font-size: 14px; color: var(--mu); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.entre { justify-content: space-between; }
.row.centro { justify-content: center; }
.row.fim { justify-content: flex-end; }
.sep { flex: 1; }
.link { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; text-decoration: none; color: var(--mu); }
.link:hover { color: var(--tx); }
.link .i { width: 16px; height: 16px; }
.migalha { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--mu); text-decoration: none; font-weight: 500; }
.migalha:hover { color: var(--tx); }
.migalha .i { width: 16px; height: 16px; }
.sep-m { color: var(--mu2); }

/* ---------- botões, etiquetas ---------- */
a.btn { text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px; border-radius: var(--r2); border: 1px solid var(--line2); background: var(--s2); color: var(--tx); font-weight: 600; font-size: 14.5px; transition: background .15s, border-color .15s, filter .15s; }
.btn:hover { background: var(--s3); }
.btn.pri { background: var(--c); border-color: transparent; color: var(--on-c); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--s2); }
.btn.perigo { background: var(--bad); border-color: transparent; color: var(--on-c); }
.btn.sm { min-height: 34px; padding: 6px 12px; font-size: 13.5px; }
.btn.sm .i { width: 16px; height: 16px; }
.btn.lg { min-height: 48px; padding: 12px 22px; font-size: 16px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn kbd { margin-left: 4px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--s3); color: var(--mu); white-space: nowrap; }
.pill .i { width: 13px; height: 13px; }
.pill.ok { background: rgba(79, 207, 134, .13); color: var(--ok); }
.pill.med { background: rgba(242, 163, 91, .13); color: var(--warn); }
.pill.bad { background: rgba(255, 125, 134, .13); color: var(--bad); }
.pill.ac { background: var(--c-soft); color: var(--c); }
.tag { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--tx2); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
kbd { background: var(--s3); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; font-family: ui-monospace, monospace; font-size: 11.5px; font-weight: 500; color: var(--mu); }
.btn.pri kbd { background: rgba(0, 0, 0, .15); border-color: rgba(0, 0, 0, .2); color: inherit; }

/* bloco colorido com ícone do tema */
.ico-t { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--c-soft); color: var(--c); flex: none; }
.ico-t .i { width: 21px; height: 21px; }
.ico-t.sm { width: 24px; height: 24px; border-radius: 7px; }
.ico-t.sm .i { width: 14px; height: 14px; }
.ico-t.lg { width: 56px; height: 56px; border-radius: 14px; }
.ico-t.lg .i { width: 28px; height: 28px; }

/* barra de progresso */
.bar { height: 6px; border-radius: 6px; background: var(--s3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 6px; background: var(--c); transition: width .3s; }
.bar.fino { height: 4px; }

/* ---------- início ---------- */
.hoje { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 16px; }
.agora { display: grid; gap: 22px; align-content: space-between; padding: 28px; border-color: var(--c-line); background: linear-gradient(135deg, var(--c-soft), transparent 65%), var(--s1); }
.agora h1 { font-size: clamp(26px, 3.4vw, 36px); margin: 6px 0 8px; }
.agora .tipo { font-size: 13px; font-weight: 700; color: var(--c); text-transform: uppercase; letter-spacing: .06em; }
.plano { display: grid; gap: 12px; align-content: start; }
.plano > *, .plano li { min-width: 0; }   /* deixa o texto longo encurtar com … em vez de vazar */
.plano ol { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; }
.passo { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--r2); color: inherit; text-decoration: none; border: 1px solid transparent; transition: background .15s; }
.passo:hover { background: var(--s2); }
.passo.atual { background: var(--s2); border-color: var(--line2); }
.passo .n { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line2); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--mu); flex: none; }
.passo .n .i { width: 15px; height: 15px; }
.passo.atual .n { border-color: var(--c); color: var(--c); }
.passo.feito .n { background: var(--ok); border-color: var(--ok); color: var(--on-c); }
.passo .txt { flex: 1; min-width: 0; }
.passo .t1 { display: block; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.passo.feito .t1 { color: var(--mu); text-decoration: line-through; text-decoration-color: var(--mu2); }
.passo small { display: flex; align-items: center; gap: 6px; color: var(--mu); font-size: 12.5px; }
.passo .dot { width: 7px; height: 7px; }
.passo .fim { color: var(--mu2); width: 16px; height: 16px; }

/* blocos de tema */
.temas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tile { display: grid; gap: 14px; align-content: space-between; padding: 16px; border-radius: var(--r); background: var(--s1); border: 1px solid var(--line); color: inherit; text-decoration: none; transition: border-color .15s, background .15s; }
.tile:hover { border-color: var(--c-line); background: var(--c-tint); }
.tile.principal { border-color: var(--c-line); }
.tile .topo { display: flex; gap: 12px; align-items: center; }
.tile .nome { flex: 1; min-width: 0; }
.tile h3 { font-size: 15.5px; }
.tile .meta { font-size: 13px; color: var(--mu); }
.tile .desc { font-size: 13.5px; color: var(--mu); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile { position: relative; }
/* tema principal: só a estrela no canto, para o nome não quebrar em blocos estreitos */
.tile .topo > .fixa { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; padding: 0; justify-content: center; border-radius: 8px; }
.tile .topo > .fixa .i { width: 14px; height: 14px; }
.tile.principal h3 { padding-right: 28px; }

/* ---------- trilha de um tema ---------- */
.tema-cab { display: grid; gap: 18px; padding: 24px; border-radius: var(--r); border: 1px solid var(--line); border-top: 3px solid var(--c); background: linear-gradient(180deg, var(--c-soft), transparent 70%), var(--s1); }
.tema-cab .id { display: flex; gap: 16px; align-items: center; }
.tema-cab .id .sub { margin-top: 4px; max-width: 72ch; }
.progresso-tema { display: grid; gap: 8px; }
.stats { display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; color: var(--mu); }
.stats b { color: var(--tx); font-variant-numeric: tabular-nums; }
.stats .aviso b { color: var(--warn); }
.legenda { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--mu); margin: -10px 0; }
.leg { display: inline-flex; align-items: center; gap: 7px; }
.leg .sit { width: 12px; height: 12px; }
.leg .i { width: 14px; height: 14px; color: var(--mu2); }
.disc { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.disc header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.disc header .dot { width: 10px; height: 10px; border-radius: 3px; }
.disc header h2 { font-size: 16px; }
.disc header .sub { font-size: 13px; }
.disc header .conta { margin-left: auto; font-size: 13px; color: var(--mu); font-variant-numeric: tabular-nums; }
.topicos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
.topico { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 18px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; color: var(--tx); transition: background .12s; }
.topico:hover { background: var(--s2); }
.topico .t { flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.35; }
.topico .t small { display: block; margin-top: 2px; color: var(--mu); font-size: 12.5px; }
.topico.sem .t { color: var(--mu); }
.topico .fim { color: var(--mu2); width: 16px; height: 16px; }
.topico.sem .fim { color: var(--c); opacity: .7; }
.prio { color: var(--warn); font-weight: 600; }
/* situação do tópico: forma + cor (não depende só da cor) */
.sit { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line2); display: grid; place-items: center; flex: none; }
.sit .i { width: 12px; height: 12px; stroke-width: 3; }
.estudado .sit { background: var(--c); border-color: var(--c); }
.revisar .sit { border-color: var(--warn); color: var(--warn); }
.dominado .sit { background: var(--ok); border-color: var(--ok); color: var(--on-c); }
.leg.estudado .sit { background: var(--ac); border-color: var(--ac); }
.leg.revisar .sit { background: var(--warn); }

/* bloco recolhível (calculadora da prova) */
details.recolhe { padding: 0; }
details.recolhe > summary { display: flex; align-items: center; gap: 12px; padding: 16px 18px; cursor: pointer; list-style: none; }
details.recolhe > summary::-webkit-details-marker { display: none; }
details.recolhe > summary small { display: block; font-size: 13px; }
details.recolhe > summary .fim { margin-left: auto; color: var(--mu2); transition: transform .2s; }
details.recolhe[open] > summary .fim { transform: rotate(90deg); }
details.recolhe[open] > summary { border-bottom: 1px solid var(--line); }
details.recolhe > :not(summary) { margin: 16px 18px; }
details.recolhe > :last-child { margin-bottom: 18px; }

/* escolher cor */
.cores { display: flex; flex-wrap: wrap; gap: 10px; }
.cor { width: 38px; height: 38px; border-radius: 10px; border: 2px solid transparent; background: var(--c); color: var(--on-c); display: grid; place-items: center; }
.cor.on { border-color: var(--tx); }
.cor .i { stroke-width: 3; }

/* ---------- aula ---------- */
.aula-cab { display: grid; gap: 12px; }
.aula-cab h1 { font-size: clamp(26px, 3.4vw, 34px); }
.ideia { font-size: 17px; color: var(--tx2); border-left: 3px solid var(--c); padding: 2px 0 2px 14px; max-width: 70ch; }
.ferramentas { gap: 6px; }
.aviso-auto { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--mu); max-width: 860px; }
.aviso-auto .i { color: var(--warn); margin-top: 2px; }
.steps { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-top: 6px; scrollbar-width: none; }
.steps button { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--mu); font-weight: 600; font-size: 14px; white-space: nowrap; }
.steps button:hover { color: var(--tx); }
.steps button > span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--s3); color: var(--mu); }
.steps button > span .i { width: 13px; height: 13px; stroke-width: 3; }
.steps button.on { color: var(--tx); border-bottom-color: var(--c); }
.steps button.on > span { background: var(--c); color: var(--on-c); }
.steps button.ok > span { background: var(--c-soft); color: var(--c); }
#corpo { min-height: 240px; }
.aula-nav { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 16px; margin-top: -8px; background: linear-gradient(transparent, var(--bg) 35%); }
.aula-nav .sub { font-size: 13px; }
.instrucao { align-items: center; max-width: 860px; }
.instrucao .sub { flex: 1; min-width: 240px; }
.conteudo { display: grid; gap: 16px; max-width: 860px; }
.conteudo h3 { font-size: 17px; margin-bottom: 10px; }
.conteudo p, .conteudo li { max-width: 72ch; }
.conteudo p + p { margin-top: 10px; }
.tab { border-collapse: collapse; width: 100%; font-size: 15px; display: block; overflow-x: auto; }
.tab th, .tab td { padding: 9px 11px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tab th { color: var(--mu); font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; }
.dica { background: rgba(242, 163, 91, .08); border-left: 3px solid var(--warn); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 10px 0; }
.pratica { background: rgba(53, 201, 189, .08); border-left: 3px solid var(--teal); padding: 10px 14px 10px 30px; border-radius: 0 8px 8px 0; margin: 10px 0; }
p.pratica { padding-left: 14px; }
.grande { font-family: var(--fd); font-size: 28px; font-weight: 800; color: var(--c); font-variant-numeric: tabular-nums; }
.fluxo, .linha, .ciclo { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
.fluxo span, .linha span, .ciclo span { background: var(--s3); padding: 7px 12px; border-radius: 8px; font-size: 14px; }
.fluxo span:not(:last-child)::after, .linha span:not(:last-child)::after, .ciclo span::after { content: "→"; margin-left: 10px; color: var(--c); }
.ciclo span:last-child::after { content: "↺"; }

/* mapa mental */
.mapa { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 4px; }
.mapa .raiz { grid-column: 1 / -1; justify-self: center; font-family: var(--fd); font-weight: 800; font-size: 20px; padding: 12px 24px; border-radius: 12px; background: var(--c); color: var(--on-c); }
.ramo { border-radius: 12px; background: var(--s1); border: 1px solid var(--line); border-top: 3px solid var(--rc); padding: 14px 16px; }
.ramo b { font-family: var(--fd); display: block; margin-bottom: 6px; }
.ramo ul { margin: 0; padding-left: 18px; color: var(--tx2); font-size: 14.5px; }
.oculto .ramo ul { filter: blur(6px); user-select: none; }

/* lembrar, explicar, formulários */
.lembre { display: grid; gap: 14px; max-width: 820px; }
.lembre label { font-weight: 600; display: block; margin-bottom: 6px; }
label { font-size: 14px; }
textarea, input[type=text], select { width: 100%; background: var(--s2); border: 1px solid var(--line2); color: var(--tx); border-radius: var(--r2); padding: 10px 12px; font: inherit; transition: border-color .15s; }
textarea:focus, input[type=text]:focus, select:focus { border-color: var(--c); outline: none; }
textarea { min-height: 76px; resize: vertical; }
.campo { display: grid; gap: 4px; min-width: 220px; }
.campo label { font-size: 13px; color: var(--mu); }

/* teste */
.q { display: grid; gap: 10px; max-width: 780px; }
.q h3 { font-size: 19px; margin-bottom: 4px; }
.opt { display: block; width: 100%; text-align: left; padding: 13px 16px; border-radius: var(--r2); background: var(--s1); border: 1px solid var(--line2); font-size: 15.5px; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--c); background: var(--s2); }
.opt.certa { border-color: var(--ok); background: rgba(79, 207, 134, .1); }
.opt.errada { border-color: var(--bad); background: rgba(255, 125, 134, .1); }
.exp { padding: 12px 15px; border-radius: var(--r2); background: var(--s2); }
.exp.ok { display: flex; gap: 8px; align-items: center; }
.exp.ok .i { color: var(--ok); }
.placar { display: flex; gap: 5px; }
.placar i, .placar button { width: 28px; height: 6px; border-radius: 4px; background: var(--s3); border: 0; padding: 0; }
.placar button { height: 22px; background: linear-gradient(var(--s3), var(--s3)) center / 100% 6px no-repeat; }   /* área de toque maior, barrinha fina */
.placar button:hover { background-image: linear-gradient(var(--line2), var(--line2)); }
.placar .c { --b: var(--ok); }
.placar .e { --b: var(--bad); }
.placar i.c, .placar i.e { background: var(--b); }
.placar button.c, .placar button.e { background-image: linear-gradient(var(--b), var(--b)); }
.placar button.on { background-size: 100% 10px; outline: 2px solid var(--c-line); outline-offset: 2px; border-radius: 4px; }
.opt { display: flex; gap: 12px; align-items: center; }
/* letra da alternativa: selo pequeno (não confundir com .wid .letra, a letra gigante da datilologia) */
.opt .letra { display: grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--s3); color: var(--mu); font-family: var(--fd); font-size: 13px; font-weight: 800; transition: background .15s, color .15s; }
.opt:hover:not([disabled]) .letra { background: var(--c-soft); color: var(--c); }
.opt.certa .letra { background: var(--ok); color: var(--on-c); }
.opt.errada .letra { background: var(--bad); color: var(--on-c); }
.opt[disabled] { cursor: default; }
.opt[disabled]:not(.certa):not(.errada) { opacity: .7; }

/* ---------- revisão ---------- */
.revisao { display: grid; gap: 16px; max-width: 760px; width: 100%; margin: 0 auto; }
.sessao { display: flex; align-items: center; gap: 12px; }
.sessao .bar { flex: 1; }
.sessao .sub { font-size: 13px; font-variant-numeric: tabular-nums; }
.fc { position: relative; min-height: 260px; display: grid; place-items: center; text-align: center; padding: 44px 32px 32px; border-radius: var(--r); background: var(--s1); border: 1px solid var(--line); border-top: 3px solid var(--c); font-size: 20px; }
.fc > .tag { position: absolute; top: 14px; left: 16px; font-size: 12.5px; color: var(--mu); }
.fc .verso { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 18px; font-size: 17px; color: var(--tx2); }
.fc.vazio { border-top-color: var(--ok); }
.fc.vazio .ico-t { margin: 0 auto 12px; }
.fc.vazio h2 { margin-bottom: 6px; }
.fc.vazio .btn { margin-top: 16px; }
.notas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.nota { flex-direction: column; gap: 0; min-height: 64px; border-color: var(--c-line); }
.nota > span { color: var(--c); }
.nota small { font-size: 12px; font-weight: 500; color: var(--mu); }
.nota kbd { position: absolute; top: 6px; right: 6px; }
.nota { position: relative; }

/* ---------- biblioteca ---------- */
.zona { display: grid; place-items: center; text-align: center; min-height: 240px; padding: 20px; border: 2px dashed var(--line2); border-radius: var(--r); cursor: pointer; transition: border-color .15s, background .15s; }
.zona:hover { border-color: var(--ac); background: var(--s2); }
.zona .ico-t { margin: 0 auto 12px; }

/* ---------- progresso ---------- */
.cal { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; max-width: 520px; }
.cal i { aspect-ratio: 1; border-radius: 4px; background: var(--s3); }
.cal i.l1 { background: #2b3d73; }
.cal i.l2 { background: #4a63c0; }
.cal i.l3 { background: var(--ac); }
.cal-leg { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px; color: var(--mu); }
.cal-leg .cal { display: flex; gap: 4px; }
.cal-leg .cal i { width: 12px; height: 12px; }

/* ---------- widgets (prática) ---------- */
.wid { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; }
.wid h3 { font-size: 17px; }
.tv td, .tv th { text-align: center; }
.tv button { width: 44px; height: 36px; border-radius: 8px; border: 1px solid var(--line2); background: var(--s3); font-weight: 800; }
.tv button.V { color: var(--ok); }
.tv button.F { color: var(--bad); }
.tv button.certo { box-shadow: 0 0 0 2px var(--ok); }
.tv button.erro { box-shadow: 0 0 0 2px var(--bad); }
.par { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.par .col { display: grid; gap: 8px; align-content: start; }
.par button { text-align: left; padding: 11px 13px; border-radius: var(--r2); background: var(--s2); border: 1px solid var(--line2); font-size: 14.5px; }
.par button.sel { border-color: var(--c); background: var(--c-soft); }
.par button.ok { border-color: var(--ok); background: rgba(79, 207, 134, .1); color: var(--ok); cursor: default; }
.par button.no { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.ord { display: flex; flex-wrap: wrap; gap: 8px; }
.ord button { padding: 10px 14px; border-radius: var(--r2); background: var(--s2); border: 1px solid var(--line2); }
.ord button.usado { opacity: .3; }
.resposta { display: grid; gap: 6px; counter-reset: n; }
.resposta div { padding: 9px 13px; border-radius: 8px; background: var(--s3); counter-increment: n; }
.resposta div::before { content: counter(n) ". "; font-weight: 800; color: var(--c); }
.resposta div.ok { background: rgba(79, 207, 134, .12); }
.resposta div.no { background: rgba(255, 125, 134, .12); }
.piano { position: relative; height: 150px; user-select: none; overflow-x: auto; }
.piano .k { position: absolute; top: 0; border: 1px solid #0b0f19; border-radius: 0 0 8px 8px; display: flex; align-items: flex-end; justify-content: center; font-size: 11px; padding-bottom: 6px; font-weight: 700; }
.piano .w { background: #eef1f8; color: #58607a; height: 150px; z-index: 1; }
.piano .b { background: #151a27; color: #9aa4be; height: 92px; z-index: 2; }
.piano .k.hi.w { background: #b7c6ff; color: #0b1020; }
.piano .k.hi.b { background: #5a76e0; color: #fff; }
.piano .k.on { background: var(--warn) !important; color: #0b1020 !important; }
.seq { display: grid; gap: 7px; overflow-x: auto; }
.seq .linha { display: grid; grid-template-columns: 70px repeat(16, minmax(26px, 1fr)); gap: 5px; align-items: center; }
.seq .linha b { font-size: 13px; color: var(--mu); }
.seq .st { height: 34px; border-radius: 6px; border: 0; background: var(--s3); width: auto; }
.seq .st:nth-child(4n+2) { background: #2a3242; }
.seq .st.on { background: var(--rc); }
.seq .st.cur { outline: 2px solid #fff; outline-offset: -2px; }
.cordas { display: flex; flex-wrap: wrap; gap: 8px; }
.cordas button { min-width: 56px; padding: 9px 12px; border-radius: var(--r2); background: var(--s2); border: 1px solid var(--line2); font-weight: 800; font-family: var(--fd); }
.cordas button.on { background: var(--c); color: var(--on-c); border-color: var(--c); }
.met { display: flex; gap: 12px; justify-content: center; }
.met i { width: 46px; height: 46px; border-radius: 50%; background: var(--s3); transition: background .05s; }
.met i.on { background: var(--teal); }
.met i.on.um { background: var(--warn); }
.cam { display: grid; gap: 8px; }
.cam button { text-align: left; padding: 12px 14px; border-radius: var(--r2); border: 1px solid var(--line); background: var(--cc); color: #0b1020; font-weight: 700; transition: transform .12s; }
.cam button.sel { transform: translateX(10px); box-shadow: 0 0 0 3px #fff; }
.wid .letra { font-family: var(--fd); font-size: 110px; font-weight: 800; text-align: center; line-height: 1; color: var(--c); }
canvas { max-width: 100%; background: var(--s2); border-radius: var(--r2); }
input[type=range] { width: 100%; accent-color: var(--c); }

/* ---------- modal e aviso ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(5, 7, 12, .72); backdrop-filter: blur(2px); }
.modal .card { max-width: 720px; width: 100%; max-height: 88vh; overflow: auto; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
pre.prompt { white-space: pre-wrap; background: var(--s2); border: 1px solid var(--line); border-radius: var(--r2); padding: 14px; font-size: 13px; max-height: 240px; overflow: auto; margin: 0; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 60; padding: 11px 18px; border-radius: var(--r2); background: var(--s3); border: 1px solid var(--line2); font-weight: 600; font-size: 14.5px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }

/* ---------- telas menores ---------- */
@media (max-width: 860px) {
  .hoje { grid-template-columns: 1fr; }
  /* some da tela, mas o leitor de tela ainda lê "73 dias para a prova" */
  .chip .l { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
/* toque (celular, tablet): alvos de pelo menos 44px */
@media (pointer: coarse) {
  .btn { min-height: 44px; }
  .btn.sm { min-height: 40px; }
  .topico { min-height: 52px; }
}
@media (max-width: 720px) {
  /* backdrop-filter prenderia a barra fixa de baixo ao cabeçalho: no celular, fundo sólido */
  .top { backdrop-filter: none; background: var(--bg); }
  .top .in { height: 54px; gap: 12px; }
  /* abas viram a barra de baixo, ao alcance do polegar */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; justify-content: space-around; gap: 0; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: rgba(11, 14, 20, .96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
  nav.tabs a { flex-direction: column; gap: 2px; padding: 6px 6px; font-size: 12px; min-width: 60px; min-height: 48px; justify-content: center; }
  nav.tabs a.on { background: none; color: var(--ac); }
  nav.tabs .badge { position: absolute; top: 0; right: 6px; min-width: 17px; height: 17px; font-size: 10.5px; }
  main { padding: 20px 16px 110px; gap: 22px; }
  footer { padding-bottom: 90px; }
  .card, .tema-cab { padding: 18px; }
  .agora { padding: 22px; }
  .aula-nav { bottom: 62px; }
  .aula-nav .l, .aula-nav .sub { display: none; }
  .notas { grid-template-columns: 1fr 1fr; }
  .nota kbd { display: none; }
  .par { grid-template-columns: 1fr; }
  .toast { bottom: 84px; }
  .legenda { gap: 10px 14px; }
  /* cabeçalho do tema: "Continuar" ocupa a linha toda; as ações secundárias vão para a linha de baixo */
  .tema-cab .row > #revtema { flex: 1; }
  .tema-cab .row > .btn.pri { width: 100%; justify-content: flex-start; text-align: left; }
  .tema-cab .row > .sep { flex-basis: 100%; height: 0; }
  .tema-cab .id { align-items: flex-start; }
}

/* ---------- revisão com IA e dúvidas (52-revisao-ia, 77-tela-ia) ---------- */
.atalhos-ia { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.tile.atalho .topo { align-items: center; }
.tile.atalho.vazio { opacity: .8; }
.ia-bloco { display: grid; gap: 14px; }
.ia-bloco h2 { display: flex; align-items: center; gap: 8px; }
.ia-bloco h2 .i { color: var(--c); }
.ia-sel { width: auto; min-width: 150px; }
.fila-ia, .duvidas { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.fila-ia li, .duvidas li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px 8px 12px; border-radius: var(--r2); background: var(--s2); border: 1px solid var(--line); }
.fila-ia label { display: flex; gap: 12px; align-items: center; flex: 1; min-width: 0; cursor: pointer; }
.fila-ia input { accent-color: var(--c); width: 18px; height: 18px; flex: none; }
.fila-ia .txt, .duvidas li > span { display: grid; min-width: 0; }
.fila-ia small, .duvidas small { color: var(--mu); font-size: 13px; }
.nova-duv input { flex: 1; min-width: 200px; width: auto; }
details.colar summary, details.resp-ia summary { cursor: pointer; color: var(--mu); font-weight: 600; font-size: 14px; }
details.colar[open] { display: grid; gap: 8px; }
details.colar[open] summary { margin-bottom: 4px; }
details.resp-ia summary { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--tx); list-style: none; }
details.resp-ia[open] { display: grid; gap: 14px; }
.md { display: grid; gap: 10px; max-width: 80ch; }
.md h3 { font-size: 18px; margin-top: 10px; }
.md h4 { font-size: 15.5px; margin: 6px 0 0; font-family: var(--fd); }
.md ul, .md ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.md pre { white-space: pre-wrap; background: var(--s2); border: 1px solid var(--line); border-radius: var(--r2); padding: 12px; margin: 0; font-size: 13px; overflow-x: auto; }
.md hr { border: 0; border-top: 1px solid var(--line); width: 100%; margin: 6px 0; }
.md .cita { border-left: 3px solid var(--c-line); padding-left: 12px; color: var(--tx2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.g3-ia { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
button.link { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
button.link[disabled] { opacity: .45; cursor: not-allowed; }
.outros-chats { font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }

/* ============ acrescentou.ai (78-tela-foco.js) ============ */
.chip.foco { text-decoration: none; border-color: rgba(79, 207, 134, .35); color: var(--tx2); }
.chip.foco b { color: var(--ok); }
.chip.foco:hover { background: var(--s1); }
.chip.foco.pausado { border-color: var(--line); opacity: .75; }
.chip.foco.pausado b { color: var(--mu); }
.anel { width: 15px; height: 15px; border-radius: 50%; flex: none; background: conic-gradient(var(--ok) var(--p), var(--line2) 0); -webkit-mask: radial-gradient(circle, transparent 4px, #000 4.5px); mask: radial-gradient(circle, transparent 4px, #000 4.5px); }
.chip.foco.pausado .anel { background: conic-gradient(var(--mu2) var(--p), var(--line2) 0); }
.foco-painel { display: grid; gap: 20px; justify-items: center; text-align: center; padding-block: 32px; --c: var(--ok); }
.foco-num { display: flex; align-items: baseline; gap: 4px; font-family: var(--fd); font-weight: 800; color: var(--ok); font-variant-numeric: tabular-nums; flex-wrap: wrap; justify-content: center; }
.foco-num .mais { font-size: 44px; opacity: .6; }
.foco-num b { font-size: clamp(72px, 14vw, 112px); line-height: 1; }
.foco-num small { flex-basis: 100%; font-family: var(--fb); font-size: 14px; font-weight: 600; color: var(--mu); }
.foco-tempo { display: grid; gap: 8px; width: min(360px, 100%); }
.foco-tempo > span:first-child { font-family: var(--fd); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--tx2); }
.foco-tempo .sub { font-size: 13px; }
.foco-painel .exp { display: flex; gap: 8px; align-items: center; text-align: left; max-width: 60ch; }
.foco-painel .exp .i { color: var(--ok); }
.btn.cat { border-color: var(--c-line); }
.btn.cat.on { background: var(--c-soft); color: var(--c); border-color: var(--c); }
.cat-pill { --c: var(--ac); background: var(--c-soft); color: var(--tx2); font-size: 13px; padding: 4px 6px 4px 9px; }
.cat-pill .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.cat-pill .x { border: 0; background: none; color: var(--mu); font-size: 16px; line-height: 1; padding: 0 3px; border-radius: 4px; }
.cat-pill .x:hover { color: var(--bad); }
.foco-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.foco-lista li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r2); background: var(--s2); }
.foco-lista li > div { flex: 1; display: grid; min-width: 0; }
.foco-lista li .sub { font-size: 13px; }
.foco-lista select { max-width: 45%; }
.placar-in { display: grid; gap: 4px; justify-items: center; text-align: center; }
.placar-num { font-family: var(--fd); font-size: 48px; font-weight: 800; line-height: 1.05; color: var(--ok); font-variant-numeric: tabular-nums; }
.placar-num small { font-size: 16px; font-weight: 700; margin-left: 6px; color: var(--tx2); }
.fc.vazio .placar-in { margin: 18px auto 0; padding: 14px 18px; border-radius: var(--r2); background: var(--s2); max-width: 360px; }
.placar-bloco { border-color: rgba(79, 207, 134, .35); }
.placar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 61; display: grid; gap: 6px; justify-items: center; padding: 16px 26px; min-width: 260px; border-radius: var(--r); background: var(--s2); border: 1px solid rgba(79, 207, 134, .4); box-shadow: 0 14px 40px rgba(0, 0, 0, .5); animation: placar-entra .35s ease-out; font: inherit; color: inherit; }
.placar-rot { font-size: 13px; color: var(--mu); max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes placar-entra { from { opacity: 0; transform: translate(-50%, 12px) scale(.96); } }
.chip.foco .t { font-variant-numeric: tabular-nums; }
/* com o contador ligado, os outros chips mostram só o número (o texto fica para o leitor de tela e no title) */
@media (max-width: 1400px) { .chipbar:has(.foco) .chip .l { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }
@media (max-width: 420px) { .chip.foco .t { display: none; } }
@media (max-width: 720px) { .placar { bottom: 84px; } nav.tabs a { min-width: 52px; padding-inline: 4px; } .foco-lista select { max-width: 40%; } }

/* ---------- prepara.ai (79-tela-prepara) ---------- */
.prep-topo { display: grid; grid-template-columns: minmax(150px, .5fr) minmax(200px, .7fr) minmax(0, 1.4fr); gap: 16px; }
.prep-conta { display: grid; gap: 6px; align-content: center; }
.prep-prox { display: grid; gap: 6px; text-decoration: none; color: var(--tx); border-color: var(--c-line); background: linear-gradient(135deg, var(--c-soft), transparent 70%), var(--s1); }
.prep-prox b { font-family: var(--fd); font-size: 18px; }
.prep-prox .btn { justify-self: start; margin-top: 6px; }
.prep-pergunta { display: grid; gap: 10px; }
.prep-pergunta .riscado { color: var(--mu2); text-decoration: line-through; text-decoration-color: var(--line2); }
.prep-pergunta .nova { font-family: var(--fd); font-size: 19px; font-weight: 700; line-height: 1.35; color: var(--tx); border-left: 3px solid var(--c); padding-left: 14px; max-width: 75ch; }
.prep-pergunta ul { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 6px; color: var(--tx2); max-width: 80ch; }
.prep-trilha { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.prep-im { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-decoration: none; color: var(--tx); padding: 16px 18px; }
.prep-im:hover { border-color: var(--c-line); }
.prep-im > div { display: grid; gap: 4px; min-width: 0; }
.prep-im .sub { font-size: 13px; }
.prep-im > .i { color: var(--mu2); }
.prep-n { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--c-soft); color: var(--c); font-family: var(--fd); font-weight: 800; }
.prep-im.ok .prep-n { background: rgba(79, 207, 134, .15); color: var(--ok); }
.prep-linha { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.prep-linha:last-child { border-bottom: 0; }
.prep-linha b { text-align: right; }
.t-ok { color: var(--ok); } .t-bad { color: var(--bad); } .t-warn { color: var(--warn); }
.prep-imersao { gap: 24px; }
.prep-prog { display: grid; gap: 6px; min-width: 180px; }
.prep-passos { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.prep-passos a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--c-line); color: var(--c); text-decoration: none; font-weight: 600; font-size: 14px; }
.prep-bloco { display: grid; gap: 10px; }
.prep-txt { display: grid; gap: 10px; color: var(--tx2); max-width: 80ch; }
.prep-txt ul, .prep-txt ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.prep-txt table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.prep-txt th, .prep-txt td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.prep-txt th { color: var(--mu); font-weight: 600; font-size: 13px; }
.prep-rotas { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.prep-rota { display: grid; gap: 10px; align-content: start; padding: 18px; }
.prep-rota dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 14px; }
.prep-rota dt { color: var(--mu); font-weight: 600; }
.prep-rota dd { margin: 0; color: var(--tx2); }
.prep-rota > .sub { font-size: 13.5px; }
.prep-campo { display: grid; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.prep-campo legend, .prep-rot { font-weight: 600; color: var(--tx); padding: 0; margin-bottom: 2px; }
