<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>estudaai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Mundo único escuro, herdado do "Loop em Casa": azul-noite, cartões em camadas, acentos pastel por tema */
  --bg:#0e1320; --s1:#161c2b; --s2:#1d2436; --s3:#262f45; --line:#2b3550;
  --tx:#e9edf7; --mu:#9aa4be; --ac:#7f9cff; --ac2:#a98bf0;
  --ok:#5fd38d; --warn:#f2a35b; --bad:#ff7d86; --teal:#35c9bd;
  --fd:"Plus Jakarta Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --fb:"Figtree",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--fd);line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--ac)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* topo */
.top{position:sticky;top:0;z-index:20;background:rgba(14,19,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:800;font-size:20px;text-decoration:none;color:var(--tx)}
.logo .bars{display:flex;gap:3px;align-items:flex-end;height:22px}
.logo .bars i{display:block;width:6px;border-radius:3px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;color:var(--mu);text-decoration:none;font-weight:600}
nav.tabs a:hover{color:var(--tx);background:var(--s1)}
nav.tabs a.on{color:var(--ac);background:#1c2748}
nav.tabs svg{width:18px;height:18px}
.chipbar{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.chip b{color:var(--tx)}

main{max-width:1180px;margin:0 auto;padding:24px 16px 80px;display:grid;gap:22px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.eyebrow{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:700}
.sub{color:var(--mu)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* botões */
a.btn{text-decoration:none;display:inline-block}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;background:var(--s3);transition:transform .12s,background .12s}
.btn:hover{transform:translateY(-1px);background:#2f3953}
.btn.pri{background:var(--ac);color:#0b1020}
.btn.pri:hover{background:#97afff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 13px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* herói "seu próximo passo" */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(30px,4.4vw,48px);font-weight:800;margin:6px 0 8px}
.go{display:flex;align-items:center;justify-content:space-between;gap:18px;width:100%;max-width:520px;margin-top:22px;padding:22px 26px;border-radius:999px;border:0;background:var(--ac);color:#0b1020;font-weight:700;font-size:18px;text-align:left;transition:transform .15s}
.go:hover{transform:scale(1.015)}
.go svg{width:54px;height:54px;flex:none}
.plano{display:grid;gap:10px}
.passo{display:flex;gap:14px;align-items:center;padding:13px 15px;border-radius:14px;background:var(--s2);border:1px solid var(--line);text-align:left;width:100%}
.passo .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--fd);background:var(--s3)}
.passo.feito{opacity:.6}
.passo.feito .n{background:var(--ok);color:#0b1020}
.passo.atual{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.passo small{display:block;color:var(--mu)}
.vis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:18px;border-radius:16px;background:var(--s2)}
.vis i{display:block;height:34px;border-radius:9px}

/* temas */
.tema{position:relative;display:grid;gap:10px;text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:20px;overflow:hidden;transition:transform .15s,border-color .15s}
.tema:hover{transform:translateY(-2px);border-color:var(--c)}
.tema .stripe{position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.tema h3{font-size:20px}
.ringw{display:flex;align-items:center;gap:14px}
.bar{height:9px;border-radius:9px;background:var(--s3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--c,var(--ac))}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--s3);color:var(--mu)}
.pill.ok{background:rgba(95,211,141,.15);color:var(--ok)}
.pill.med{background:rgba(242,163,91,.15);color:var(--warn)}
.pill.bad{background:rgba(255,125,134,.15);color:var(--bad)}
.pill.ac{background:rgba(127,156,255,.15);color:var(--ac)}

/* trilha */
.disc{display:grid;gap:12px}
.disc h3{font-size:17px;display:flex;align-items:center;gap:8px}
.disc h3 i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.trilha{display:flex;flex-wrap:wrap;gap:10px;position:relative}
.no{display:flex;gap:10px;align-items:center;text-align:left;min-width:220px;flex:1 1 240px;max-width:380px;padding:11px 13px;border-radius:14px;background:var(--s2);border:1px solid var(--line);transition:border-color .12s}
.no:hover{border-color:var(--c)}
.no .dot{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--s3);color:var(--mu)}
.no.estudado .dot{background:#2a3d73;color:var(--ac)}
.no.revisar .dot{background:rgba(242,163,91,.22);color:var(--warn)}
.no.dominado .dot{background:rgba(95,211,141,.2);color:var(--ok)}
.no .t{font-size:14px;line-height:1.3}
.no .t small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.estrela{color:var(--warn);font-size:11px;letter-spacing:1px}

/* aula */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--s1);padding:8px 13px;border-radius:999px;font-weight:600;color:var(--mu);font-size:14px}
.steps button.on{color:#0b1020;background:var(--c);border-color:var(--c)}
.steps button.ok{color:var(--ok)}
.steps button span{font-family:var(--fd);font-weight:800}
.aulah{display:grid;gap:8px}
.aulah h1{font-size:clamp(26px,3.6vw,38px)}
.ideia{font-size:19px;border-left:5px solid var(--c);padding:6px 0 6px 16px;color:#d5dbea;max-width:70ch}
.conteudo{display:grid;gap:16px;max-width:860px}
.conteudo h3{font-size:19px;margin-bottom:8px}
.conteudo p,.conteudo li{max-width:72ch}
.bloco{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.tab{border-collapse:collapse;width:100%;font-size:15px;display:block;overflow-x:auto}
.tab th,.tab td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tab th{color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.dica{background:rgba(242,163,91,.1);border-left:4px solid var(--warn);padding:10px 14px;border-radius:0 10px 10px 0}
.pratica{background:rgba(53,201,189,.1);border-left:4px solid var(--teal);padding:10px 14px 10px 30px;border-radius:0 10px 10px 0}
p.pratica{padding-left:14px}
.grande{font-family:var(--fd);font-size:26px;font-weight:800;letter-spacing:.06em;color:var(--c)}
kbd{background:var(--s3);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;font-family:ui-monospace,monospace;font-size:13px}
.fluxo,.linha,.ciclo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.fluxo span,.linha span,.ciclo span{background:var(--s3);padding:8px 12px;border-radius:12px;font-size:14px;position:relative}
.fluxo span:not(:last-child)::after,.linha span:not(:last-child)::after,.ciclo span::after{content:"→";margin-left:10px;color:var(--c)}
.ciclo span:last-child::after{content:"↺"}

/* mapa mental */
.mapa{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;position:relative}
.mapa .raiz{grid-column:1/-1;justify-self:center;font-family:var(--fd);font-weight:800;font-size:22px;padding:14px 26px;border-radius:999px;background:var(--c);color:#0b1020}
.ramo{border-radius:16px;background:var(--s1);border:1px solid var(--line);border-top:5px solid var(--rc);padding:14px 16px}
.ramo b{font-family:var(--fd);display:block;margin-bottom:6px}
.ramo ul{margin:0;padding-left:18px;color:#cfd5e6;font-size:14.5px}
.oculto .ramo ul{filter:blur(6px);user-select:none}

/* recuperação */
.lembre{display:grid;gap:12px;max-width:820px}
.lembre label{font-weight:600}
textarea,input[type=text],select{width:100%;background:var(--s2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 13px;font:inherit}
textarea{min-height:76px;resize:vertical}

/* quiz */
.q{display:grid;gap:10px;max-width:780px}
.q h3{font-size:20px}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border-radius:14px;background:var(--s2);border:1px solid var(--line);font-size:16px}
.opt:hover{border-color:var(--ac)}
.opt.certa{border-color:var(--ok);background:rgba(95,211,141,.12)}
.opt.errada{border-color:var(--bad);background:rgba(255,125,134,.12)}
.exp{padding:12px 15px;border-radius:12px;background:var(--s2)}
.placar{display:flex;gap:6px}
.placar i{width:28px;height:8px;border-radius:5px;background:var(--s3)}
.placar i.c{background:var(--ok)}.placar i.e{background:var(--bad)}

/* flashcards */
.fc{min-height:250px;display:grid;place-items:center;text-align:center;padding:30px;border-radius:22px;background:var(--s2);border:1px solid var(--line);font-size:21px;max-width:760px;margin:0 auto;width:100%}
.fc .verso{border-top:1px solid var(--line);margin-top:18px;padding-top:18px;font-size:17px;color:#d6dcec}
.notas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:760px;margin:0 auto;width:100%}
.notas .btn small{display:block;font-weight:500;font-size:12px;opacity:.75}

/* widgets */
.wid{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px}
.wid h3{font-size:18px}
.tv td,.tv th{text-align:center}
.tv button{width:44px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--s3);font-weight:800}
.tv button.V{color:var(--ok)}.tv button.F{color:var(--bad)}
.tv button.certo{box-shadow:0 0 0 2px var(--ok)}.tv button.erro{box-shadow:0 0 0 2px var(--bad)}
.par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.par .col{display:grid;gap:8px;align-content:start}
.par button{text-align:left;padding:11px 13px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:14.5px}
.par button.sel{border-color:var(--ac);background:#1c2748}
.par button.ok{border-color:var(--ok);background:rgba(95,211,141,.12);color:var(--ok);cursor:default}
.par button.no{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ord{display:flex;flex-wrap:wrap;gap:8px}
.ord button{padding:10px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.ord button.usado{opacity:.3}
.resposta{display:grid;gap:6px;counter-reset:n}
.resposta div{padding:9px 13px;border-radius:10px;background:var(--s3);counter-increment:n}
.resposta div::before{content:counter(n) ". ";font-weight:800;color:var(--c)}
.resposta div.ok{background:rgba(95,211,141,.14)}.resposta div.no{background:rgba(255,125,134,.14)}
.piano{position:relative;height:150px;user-select:none;overflow-x:auto}
.piano .k{position:absolute;top:0;border:1px solid #0b0f19;border-radius:0 0 8px 8px;display:flex;align-items:flex-end;justify-content:center;font-size:11px;padding-bottom:6px;font-weight:700}
.piano .w{background:#eef1f8;color:#58607a;height:150px;z-index:1}
.piano .b{background:#151a27;color:#9aa4be;height:92px;z-index:2}
.piano .k.hi.w{background:#b7c6ff;color:#0b1020}
.piano .k.hi.b{background:#5a76e0;color:#fff}
.piano .k.on{background:var(--warn)!important;color:#0b1020!important}
.seq{display:grid;gap:7px;overflow-x:auto}
.seq .linha{display:grid;grid-template-columns:70px repeat(16,minmax(26px,1fr));gap:5px;align-items:center}
.seq .linha b{font-size:13px;color:var(--mu)}
.seq .st{height:34px;border-radius:8px;border:0;background:var(--s3)}
.seq .st:nth-child(4n+2){background:#2f3a56}
.seq .st.on{background:var(--rc)}
.seq .st.cur{outline:2px solid #fff;outline-offset:-2px}
.cordas{display:flex;flex-wrap:wrap;gap:8px}
.cordas button{min-width:56px;padding:9px 12px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-weight:800;font-family:var(--fd)}
.cordas button.on{background:var(--c);color:#0b1020;border-color:var(--c)}
.met{display:flex;gap:12px;justify-content:center}
.met i{width:46px;height:46px;border-radius:50%;background:var(--s3);transition:background .05s}
.met i.on{background:var(--teal)}.met i.on.um{background:var(--warn)}
.cam{display:grid;gap:8px}
.cam button{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--cc);color:#0b1020;font-weight:700;transition:transform .12s}
.cam button.sel{transform:translateX(10px);box-shadow:0 0 0 3px #fff}
.letra{font-family:var(--fd);font-size:110px;font-weight:800;text-align:center;line-height:1;color:var(--c)}
canvas{max-width:100%;background:var(--s2);border-radius:12px}
input[type=range]{width:100%;accent-color:var(--ac)}

.modal{position:fixed;inset:0;background:rgba(5,8,15,.7);display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{max-width:760px;width:100%;max-height:88vh;overflow:auto;display:grid;gap:14px}
pre.prompt{white-space:pre-wrap;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;max-height:240px;overflow:auto}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;max-width:520px}
.cal i{aspect-ratio:1;border-radius:5px;background:var(--s3)}
.cal i.l1{background:#2b3d73}.cal i.l2{background:#4a63c0}.cal i.l3{background:var(--ac)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--line);padding:11px 18px;border-radius:999px;z-index:60;font-weight:600}
footer{max-width:1180px;margin:0 auto;padding:0 16px 30px;color:var(--mu);font-size:13px}
@media (max-width:820px){.hero{grid-template-columns:1fr}.notas{grid-template-columns:1fr 1fr}.par{grid-template-columns:1fr}.chipbar{margin-left:0}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="logo" href="#inicio" aria-label="estudaai, início"><span class="bars"><i style="height:10px;background:#f2a35b"></i><i style="height:16px;background:#35c9bd"></i><i style="height:22px;background:#a98bf0"></i><i style="height:13px;background:#7f9cff"></i></span>estudaai</a>
  <nav class="tabs" id="tabs"></nav>
  <div class="chipbar" id="chips"></div>
</div></header>
<main id="app"></main>
<footer></footer>

const CARDS = [{"id": "7ade9b1c81", "f": "Costas: camadas de tecido de fora para dentro", "v": "Pele → subcutâneo → fáscia → músculos (superficial, intermediária, profunda) → ossos, discos, facetas e ligamentos", "tema": "fisioterapia"}, {"id": "07faace522", "f": "Costas: os 4 músculos da camada <b>superficial</b>", "v": "Trapézio, latíssimo do dorso, romboides, levantador da escápula. Ligam a coluna à escápula e ao braço.", "tema": "fisioterapia"}, {"id": "d08f77e3bc", "f": "Costas: músculos da camada <b>intermediária</b>", "v": "Serráteis posteriores superior e inferior (relacionados à respiração)", "tema": "fisioterapia"}, {"id": "d201de257c", "f": "Costas: os 3 <b>eretores da espinha</b>", "v": "Iliocostal, longuíssimo, espinal (de lateral para medial: \"<b>I L E</b>\")", "tema": "fisioterapia"}, {"id": "e79160ca22", "f": "<b>Multífidos</b>: função", "v": "Estabilizar cada segmento (vértebra a vértebra). Fazem parte dos transversoespinais.", "tema": "fisioterapia"}, {"id": "febdd519e2", "f": "Inervação do <b>trapézio</b>", "v": "Nervo acessório (XI par craniano). ⚠️ Não são os ramos dorsais dos nervos espinais.", "tema": "fisioterapia"}, {"id": "fdf7d7977a", "f": "Partes do <b>disco intervertebral</b>", "v": "Anel fibroso (por fora) + núcleo pulposo (gelatinoso, por dentro)", "tema": "fisioterapia"}, {"id": "1a0eb26410", "f": "<b>Fáscia toracolombar</b>: conexão diagonal", "v": "Latíssimo do dorso de um lado ↔ glúteo máximo do lado oposto (diagonal posterior, usada ao andar e arremessar)", "tema": "fisioterapia"}, {"id": "68ab2e3103", "f": "3 motivos principais para as costas ficarem tensas", "v": "① ficar parado (contração leve e contínua, menos circulação) ② proteção contra dor ③ estresse (simpático), além de respiração no peito e fadiga", "tema": "fisioterapia"}, {"id": "778db5671b", "f": "O que quebra o ciclo dor–tensão", "v": "Movimento frequente, respiração diafragmática, calor, fortalecimento progressivo, sono", "tema": "fisioterapia"}, {"id": "73e08c7dfb", "f": "Os 3 <b>planos anatômicos</b>", "v": "Sagital (divide em direita e esquerda), frontal ou coronal (frente e trás), transversal (cima e baixo)", "tema": "fisioterapia"}, {"id": "5395d7a009", "f": "Contração <b>concêntrica × excêntrica × isométrica</b>", "v": "Concêntrica: o músculo encurta. Excêntrica: alonga sob tensão (ex.: descer da cadeira devagar). Isométrica: não muda o comprimento.", "tema": "fisioterapia"}, {"id": "72c5106d87", "f": "Tipos de <b>alavanca</b>", "v": "Interfixa (o eixo no meio), inter-resistente (a resistência no meio), interpotente (a força no meio, a mais comum no corpo, ex.: o bíceps no cotovelo)", "tema": "fisioterapia"}, {"id": "fcd2b8a2e8", "f": "<b>Manguito rotador</b>: os 4 músculos", "v": "Supraespinal, infraespinal, redondo menor, subescapular (mnemônico em inglês: <b>SITS</b>)", "tema": "fisioterapia"}, {"id": "bb11ff49e7", "f": "Escala de <b>força muscular</b> 0–5", "v": "0 nenhuma contração · 1 contração sem movimento · 2 move sem gravidade · 3 vence a gravidade · 4 vence resistência moderada · 5 normal", "tema": "fisioterapia"}, {"id": "e5e3b27b48", "f": "Agonista × antagonista × sinergista", "v": "Agonista: faz o movimento. Antagonista: faz o movimento oposto (e controla). Sinergista: ajuda o agonista.", "tema": "fisioterapia"}, {"id": "087a04ef9a", "f": "Partes do <b>neurônio</b>", "v": "Dendritos (recebem) → corpo celular → axônio (conduz) → terminal (libera o neurotransmissor)", "tema": "neurociencia"}, {"id": "433290d994", "f": "Potencial de repouso típico", "v": "Cerca de −70 mV (interior negativo)", "tema": "neurociencia"}, {"id": "515a51779d", "f": "Para que serve a <b>mielina</b>", "v": "Isola o axônio. O impulso \"salta\" entre os nós de Ranvier (condução saltatória), o que é muito mais rápido.", "tema": "neurociencia"}, {"id": "1c5787dec4", "f": "Principal neurotransmissor <b>excitatório</b> × <b>inibitório</b>", "v": "Excitatório: glutamato. Inibitório: GABA.", "tema": "neurociencia"}, {"id": "547ebe8bcd", "f": "Neurotransmissor da <b>junção neuromuscular</b>", "v": "Acetilcolina", "tema": "neurociencia"}, {"id": "65590b2af7", "f": "Simpático × parassimpático", "v": "Simpático: luta ou fuga (coração ↑, músculos em prontidão). Parassimpático: repouso e digestão.", "tema": "neurociencia"}, {"id": "bba6764b49", "f": "Lobos do córtex: funções-chave", "v": "Frontal: planejar, decidir, movimento. Parietal: tato e espaço. Temporal: audição e memória. Occipital: visão.", "tema": "neurociencia"}, {"id": "0db1e849ef", "f": "Cerebelo: função", "v": "Coordenação, equilíbrio, ajuste fino do movimento e aprendizagem motora", "tema": "neurociencia"}, {"id": "4ab858c480", "f": "Hipocampo × amígdala", "v": "Hipocampo: forma novas memórias. Amígdala: emoção, medo e relevância emocional.", "tema": "neurociencia"}, {"id": "51cfbcd21b", "f": "<b>LTP</b> (potenciação de longo prazo)", "v": "Uso repetido fortalece a sinapse (\"neurônios que disparam juntos se conectam\"). É uma base celular da memória.", "tema": "neurociencia"}, {"id": "0e8766fb47", "f": "Por que revisar espaçado funciona", "v": "Cada recuperação reativa e reconsolida a memória. Espaçar obriga um esforço maior de lembrar, que fortalece mais.", "tema": "neurociencia"}, {"id": "ddd81ea50a", "f": "Dopamina e atenção", "v": "O córtex pré-frontal regula atenção e funções executivas com dopamina e noradrenalina. Novidade e recompensa aumentam a dopamina.", "tema": "neurociencia"}, {"id": "c0cca85ea5", "f": "Área de Broca × Wernicke", "v": "Broca (frontal): produção da fala. Wernicke (temporal): compreensão da linguagem.", "tema": "neurociencia"}, {"id": "516f7c9b3a", "f": "Via <b>corticoespinal</b>: onde cruza", "v": "A maioria das fibras cruza no <b>bulbo</b> (decussação das pirâmides), por isso o hemisfério esquerdo controla o lado direito do corpo", "tema": "neurociencia"}, {"id": "972a25900c", "f": "FL Studio: janelas principais (teclas)", "v": "F5 Playlist · F6 Channel Rack · F7 Piano Roll · F9 Mixer", "tema": "fl-studio"}, {"id": "117d5afa1b", "f": "FL Studio: Pattern × Playlist", "v": "Pattern: um bloco (batida ou melodia) feito no Channel Rack ou no Piano Roll. Playlist: onde você organiza os patterns no tempo para montar a música.", "tema": "fl-studio"}, {"id": "213fb54d96", "f": "Envelope <b>ADSR</b>", "v": "Attack (subida), Decay (queda), Sustain (nível mantido), Release (fim depois de soltar a nota)", "tema": "fl-studio"}, {"id": "04ce305c6e", "f": "<b>Sidechain</b>: o que é", "v": "Um som (geralmente o kick) faz outro abaixar de volume (ex.: o baixo), abrindo espaço. Dá aquele efeito de \"pulsar\".", "tema": "fl-studio"}, {"id": "bb56f5d555", "f": "<b>Gain staging</b>", "v": "Manter os volumes com folga (picos longe de 0 dB, ex.: em torno de −6 dB no master) para não distorcer e sobrar espaço para a mixagem", "tema": "fl-studio"}, {"id": "2383ba96be", "f": "EQ: primeiro cuidado na maioria dos canais", "v": "Cortar graves que o instrumento não precisa (filtro passa-alta), para o grave ficar limpo para o kick e o baixo", "tema": "fl-studio"}, {"id": "0b788e671a", "f": "Reverb em <b>send</b> × no canal", "v": "No send (envio), vários canais compartilham o mesmo reverb, o que economiza CPU e \"cola\" a mix. No canal afeta só aquele som.", "tema": "fl-studio"}, {"id": "f4e40b739f", "f": "Escala maior: fórmula", "v": "T T S T T T S (tom, tom, semitom, tom, tom, tom, semitom)", "tema": "teoria-musical"}, {"id": "05dbf3467c", "f": "Escala menor natural: fórmula", "v": "T S T T S T T", "tema": "teoria-musical"}, {"id": "62f786e319", "f": "Tríades: como se formam", "v": "Maior = 3ª maior + 3ª menor. Menor = 3ª menor + 3ª maior. Diminuta = 3ª menor + 3ª menor. Aumentada = 3ª maior + 3ª maior.", "tema": "teoria-musical"}, {"id": "d79cfaa04b", "f": "Campo harmônico maior", "v": "I ii iii IV V vi vii° (em Dó: C Dm Em F G Am Bm(b5))", "tema": "teoria-musical"}, {"id": "233bd85b12", "f": "Funções harmônicas", "v": "Tônica (I, iii, vi): repouso. Subdominante (IV, ii): afastamento. Dominante (V, vii°): tensão que pede volta.", "tema": "teoria-musical"}, {"id": "e6b8e6c898", "f": "Progressão pop mais usada", "v": "I–V–vi–IV (em Dó: C–G–Am–F)", "tema": "teoria-musical"}, {"id": "f71f77a44a", "f": "Ordem dos sustenidos (ciclo das quintas)", "v": "Fá, Dó, Sol, Ré, Lá, Mi, Si", "tema": "teoria-musical"}, {"id": "b19d225836", "f": "Libras: os <b>5 parâmetros</b>", "v": "Configuração de mão, ponto de articulação, movimento, orientação da palma, expressões não manuais (rosto e corpo)", "tema": "libras"}, {"id": "561d9e48ad", "f": "Libras é universal?", "v": "Não. Cada país tem sua língua de sinais (ex.: a ASL nos EUA). A Libras tem gramática própria e não é português sinalizado.", "tema": "libras"}, {"id": "2f9082271f", "f": "Quando usar a <b>datilologia</b>", "v": "Para nomes próprios, palavras sem sinal conhecido ou para soletrar um termo novo", "tema": "libras"}, {"id": "9619118124", "f": "<b>Sinal-nome</b>", "v": "Sinal que identifica uma pessoa. É dado pela comunidade surda, não escolhido por conta própria.", "tema": "libras"}, {"id": "2ee37965a7", "f": "Lei 10.436/2002", "v": "Reconhece a Libras como meio legal de comunicação e expressão da comunidade surda no Brasil", "tema": "libras"}, {"id": "ef3140d3db", "f": "Decreto 5.626/2005", "v": "Regulamenta a Lei 10.436. Inclui a Libras como disciplina obrigatória na formação de professores e em fonoaudiologia, e optativa nos demais cursos superiores.", "tema": "libras"}, {"id": "eb031cab0f", "f": "Expressões não manuais: por que importam", "v": "São gramática, não só emoção: marcam pergunta, negação, intensidade", "tema": "libras"}, {"id": "9113458f05", "f": "Scrum: os <b>3 papéis</b> (Guia 2020)", "v": "Product Owner, Scrum Master, Developers (o \"time de desenvolvimento\" virou <b>Developers</b>)", "tema": "concurso"}, {"id": "dc0d276881", "f": "Scrum: os <b>5 eventos</b>", "v": "Sprint (contém todos), Sprint Planning, Daily Scrum, Sprint Review, Sprint Retrospective", "tema": "concurso"}, {"id": "55e6990454", "f": "Scrum: <b>artefatos</b> e seus <b>compromissos</b>", "v": "Product Backlog → <b>Meta do Produto</b>. Sprint Backlog → <b>Meta da Sprint</b>. Incremento → <b>Definição de Pronto</b>.", "tema": "concurso"}, {"id": "9e8d47aae7", "f": "Scrum: duração da <b>Sprint</b> e da <b>Daily</b>", "v": "Sprint: até <b>1 mês</b> (duração fixa). Daily: <b>15 min</b>.", "tema": "concurso"}, {"id": "150f307966", "f": "Kanban: 2 práticas centrais", "v": "Visualizar o fluxo (quadro) e <b>limitar o WIP</b> (trabalho em progresso). O sistema é <b>puxado</b> (pull).", "tema": "concurso"}, {"id": "81bf418921", "f": "XP: 5 <b>valores</b>", "v": "Comunicação, simplicidade, feedback, coragem, respeito", "tema": "concurso"}, {"id": "5904c4744e", "f": "XP: práticas mais cobradas", "v": "Programação em par, TDD, integração contínua, refatoração, pequenos releases, propriedade coletiva do código, ritmo sustentável", "tema": "concurso"}, {"id": "6181433351", "f": "TDD: o ciclo", "v": "<b>Red</b> (escreve um teste que falha) → <b>Green</b> (código mínimo para passar) → <b>Refactor</b>", "tema": "concurso"}, {"id": "8a99d8ccdd", "f": "<b>Mock</b> × <b>stub</b>", "v": "<b>Stub</b>: devolve respostas prontas (verifica estado). <b>Mock</b>: objeto com expectativas, verifica <b>se as interações/chamadas aconteceram</b> (comportamento).", "tema": "concurso"}, {"id": "e2f4d9b1b7", "f": "Pirâmide de testes", "v": "Base: muitos testes <b>unitários</b> (rápidos e baratos) → meio: <b>integração</b> → topo: poucos testes <b>E2E/UI</b> (lentos e caros)", "tema": "concurso"}, {"id": "4fa3b8f394", "f": "Caixa-preta × caixa-branca", "v": "<b>Caixa-preta</b>: testa pelas entradas e saídas, sem ver o código (particionamento de equivalência, valor-limite). <b>Caixa-branca</b>: baseada na estrutura interna (cobertura de comandos, desvios, caminhos).", "tema": "concurso"}, {"id": "74a481accb", "f": "Cobertura de <b>comandos</b> × <b>desvios</b> (branch)", "v": "Comandos: cada linha executada ao menos 1 vez. Desvios: cada saída V e F de cada decisão. 100% de desvios ⇒ 100% de comandos (o inverso não vale).", "tema": "concurso"}, {"id": "82f236d874", "f": "SonarQube: o que mede", "v": "Análise <b>estática</b> (sem executar o código): bugs, vulnerabilidades, code smells, duplicação, cobertura (importada) e dívida técnica, com <b>Quality Gates</b>.", "tema": "concurso"}, {"id": "9ece5ac422", "f": "Pilares da <b>orientação a objetos</b>", "v": "Abstração, encapsulamento, herança, polimorfismo", "tema": "concurso"}, {"id": "d0dea69649", "f": "SOLID", "v": "<b>S</b>ingle responsibility, <b>O</b>pen/closed, <b>L</b>iskov substitution, <b>I</b>nterface segregation, <b>D</b>ependency inversion", "tema": "concurso"}, {"id": "59099385a6", "f": "Sobrecarga × sobrescrita", "v": "<b>Sobrecarga</b> (overload): mesmo nome, assinaturas diferentes, resolvida em compilação. <b>Sobrescrita</b> (override): subclasse redefine o método da superclasse, resolvida em execução.", "tema": "concurso"}, {"id": "39340ed570", "f": "UML: diagramas <b>estruturais</b>", "v": "Classes, objetos, componentes, implantação, pacotes, estrutura composta, perfil", "tema": "concurso"}, {"id": "ed9ee8d911", "f": "UML: diagramas <b>comportamentais</b> e de <b>interação</b>", "v": "Comportamentais: casos de uso, atividades, máquina de estados. Interação: sequência, comunicação, visão geral de interação, tempo.", "tema": "concurso"}, {"id": "f4ef9252fc", "f": "Casos de uso: <b>include</b> × <b>extend</b>", "v": "<b>Include</b>: comportamento <b>obrigatório</b>, sempre executado (seta do base para o incluído). <b>Extend</b>: comportamento <b>opcional</b>/condicional (seta do extensor para o base).", "tema": "concurso"}, {"id": "eb2968d5c1", "f": "Agregação × composição (UML)", "v": "<b>Agregação</b> (losango vazio): a parte existe sem o todo. <b>Composição</b> (losango cheio): a parte morre com o todo.", "tema": "concurso"}, {"id": "b7051e0d72", "f": "GoF: padrões <b>criacionais</b>", "v": "Singleton, Factory Method, Abstract Factory, Builder, Prototype", "tema": "concurso"}, {"id": "1d078cf133", "f": "GoF: padrões <b>estruturais</b>", "v": "Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy", "tema": "concurso"}, {"id": "021a205502", "f": "GoF: padrões <b>comportamentais</b> mais cobrados", "v": "Observer, Strategy, Command, Iterator, State, Template Method, Chain of Responsibility, Mediator, Memento, Visitor, Interpreter", "tema": "concurso"}, {"id": "41798ffe5d", "f": "<b>Adapter</b> × <b>Facade</b> × <b>Decorator</b>", "v": "<b>Adapter</b>: converte uma interface em outra esperada. <b>Facade</b>: interface simplificada para um subsistema. <b>Decorator</b>: adiciona responsabilidades dinamicamente, sem herança.", "tema": "concurso"}, {"id": "a0b8116b8f", "f": "MVC: responsabilidades", "v": "<b>Model</b>: dados e regras de negócio. <b>View</b>: apresentação. <b>Controller</b>: recebe a entrada e coordena Model e View.", "tema": "concurso"}, {"id": "3bece6de93", "f": "REST: restrições", "v": "Cliente-servidor, <b>stateless</b>, cacheável, interface uniforme, sistema em camadas e code on demand (opcional)", "tema": "concurso"}, {"id": "bd421b1b1c", "f": "Métodos HTTP <b>idempotentes</b>", "v": "GET, PUT, DELETE (e HEAD, OPTIONS). <b>POST não</b> é idempotente. Métodos <b>seguros</b> (não alteram estado): GET, HEAD, OPTIONS.", "tema": "concurso"}, {"id": "38de1b06e6", "f": "Códigos HTTP essenciais", "v": "200 OK · 201 Created · 204 No Content · 400 Bad Request · <b>401</b> não autenticado · <b>403</b> autenticado sem permissão · 404 Not Found · 500 erro no servidor", "tema": "concurso"}, {"id": "bc317113cb", "f": "e-PING e eMAG", "v": "<b>e-PING</b>: Padrões de Interoperabilidade de Governo Eletrônico. <b>eMAG</b>: Modelo de Acessibilidade em Governo Eletrônico (baseado nas WCAG).", "tema": "concurso"}, {"id": "7d42198369", "f": "Git: merge × rebase", "v": "<b>Merge</b>: une históricos e cria um commit de merge (preserva o histórico). <b>Rebase</b>: reaplica commits sobre outra base (histórico linear, reescreve hashes). Não faça rebase de branch pública.", "tema": "concurso"}, {"id": "be3fba6d13", "f": "CI × Entrega contínua × Implantação contínua", "v": "<b>CI</b>: integrar e testar automaticamente a cada commit. <b>Continuous Delivery</b>: sempre pronto para produção, com deploy <b>manual</b>. <b>Continuous Deployment</b>: deploy <b>automático</b> em produção.", "tema": "concurso"}, {"id": "c9d014e63c", "f": "Docker: imagem × contêiner", "v": "<b>Imagem</b>: modelo imutável em camadas (gerado pelo Dockerfile). <b>Contêiner</b>: instância em execução de uma imagem.", "tema": "concurso"}, {"id": "e033d188be", "f": "OAuth2: os 4 papéis", "v": "Resource Owner (usuário), Client (aplicação), Authorization Server (emite tokens), Resource Server (API protegida)", "tema": "concurso"}, {"id": "4bdccc55d5", "f": "OAuth2 × autenticação", "v": "OAuth2 é protocolo de <b>autorização</b> (acesso delegado). Para autenticação, use <b>OpenID Connect</b> (camada sobre o OAuth2, com o ID Token).", "tema": "concurso"}, {"id": "78aa4b854f", "f": "Formas normais: 1FN, 2FN, 3FN", "v": "<b>1FN</b>: atributos atômicos, sem grupos repetidos. <b>2FN</b>: 1FN + sem dependência <b>parcial</b> da chave composta. <b>3FN</b>: 2FN + sem dependência <b>transitiva</b>.", "tema": "concurso"}, {"id": "09e99f25e6", "f": "BCNF (FNBC)", "v": "Todo determinante é <b>chave candidata</b> (mais rígida que a 3FN)", "tema": "concurso"}, {"id": "de815b5cb6", "f": "Propriedades <b>ACID</b>", "v": "Atomicidade, Consistência, Isolamento, Durabilidade", "tema": "concurso"}, {"id": "7b33a7da7e", "f": "Anomalias × níveis de isolamento", "v": "Read Uncommitted: permite leitura suja. Read Committed: evita leitura suja (padrão do PostgreSQL). Repeatable Read: evita leitura não repetível. Serializable: evita leitura fantasma.", "tema": "concurso"}, {"id": "baee458e2d", "f": "SQL: DDL × DML × DCL × TCL", "v": "<b>DDL</b>: CREATE, ALTER, DROP, TRUNCATE. <b>DML</b>: SELECT, INSERT, UPDATE, DELETE. <b>DCL</b>: GRANT, REVOKE. <b>TCL</b>: COMMIT, ROLLBACK, SAVEPOINT.", "tema": "concurso"}, {"id": "60250adf9f", "f": "WHERE × HAVING", "v": "WHERE filtra <b>linhas antes</b> do agrupamento. HAVING filtra <b>grupos depois</b> do GROUP BY (pode usar funções de agregação).", "tema": "concurso"}, {"id": "ca5a1764e6", "f": "Ordem lógica de execução do SELECT", "v": "FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT", "tema": "concurso"}, {"id": "3dad1c5f13", "f": "Álgebra relacional: símbolos", "v": "σ seleção (linhas) · π projeção (colunas) · ⨝ junção · ∪ união · − diferença · × produto cartesiano · ρ renomeação", "tema": "concurso"}, {"id": "d535e48197", "f": "PostgreSQL: SAVEPOINT", "v": "Marca um ponto dentro da transação: <code>ROLLBACK TO SAVEPOINT x</code> desfaz só até ali, sem abortar a transação inteira.", "tema": "concurso"}, {"id": "a766fe7b5a", "f": "DW: OLTP × OLAP", "v": "<b>OLTP</b>: transacional, normalizado, muitas escritas pequenas. <b>OLAP</b>: analítico, desnormalizado (esquema estrela ou floco de neve), consultas de agregação.", "tema": "concurso"}, {"id": "a44d186fe1", "f": "OWASP Top 10 (2021): os 3 primeiros", "v": "A01 Broken Access Control · A02 Cryptographic Failures · A03 Injection (inclui XSS).<br>⚠️ Há uma versão 2025 que mudou a ordem (A01 continua Broken Access Control). Confira a lista atual em owasp.org/Top10 e no NotebookLM.", "tema": "concurso"}, {"id": "963e7f4305", "f": "SQL Injection: prevenção principal", "v": "<b>Consultas parametrizadas</b> (prepared statements) + validação de entrada + menor privilégio no banco", "tema": "concurso"}, {"id": "f5f4d7a79e", "f": "Criptografia simétrica × assimétrica", "v": "<b>Simétrica</b>: 1 chave, rápida (AES). <b>Assimétrica</b>: par pública/privada (RSA). Assinatura digital = <b>hash</b> assinado com a chave <b>privada</b> do emissor.", "tema": "concurso"}, {"id": "1793ef38eb", "f": "LGPD: <b>dado pessoal sensível</b>", "v": "Origem racial ou étnica, convicção religiosa, opinião política, filiação sindical ou a organização religiosa, filosófica ou política, saúde, vida sexual, dado genético ou biométrico (art. 5º, II)", "tema": "concurso"}, {"id": "e5e81fb1a5", "f": "LGPD: <b>controlador</b> × <b>operador</b> × <b>encarregado</b>", "v": "<b>Controlador</b>: toma as decisões sobre o tratamento. <b>Operador</b>: trata em nome do controlador. <b>Encarregado</b> (DPO): canal de comunicação entre controlador, titulares e ANPD.", "tema": "concurso"}, {"id": "470848bbdc", "f": "LGPD: princípios (art. 6º)", "v": "Finalidade, adequação, necessidade, livre acesso, qualidade dos dados, transparência, segurança, prevenção, não discriminação, responsabilização e prestação de contas (+ boa-fé no caput)", "tema": "concurso"}, {"id": "d5e780d0c0", "f": "LGPD: <b>anonimização</b> × <b>pseudonimização</b>", "v": "Dado <b>anonimizado</b> não identifica o titular e, em regra, <b>não é dado pessoal</b>. Na <b>pseudonimização</b>, a reidentificação é possível com informação adicional mantida separadamente.", "tema": "concurso"}, {"id": "88f6ca6387", "f": "LGPD: multa máxima", "v": "Até <b>2% do faturamento</b> no Brasil, limitada a <b>R$ 50 milhões por infração</b> (art. 52)", "tema": "concurso"}, {"id": "652f95cf7e", "f": "LGPD: o poder público precisa de consentimento?", "v": "Não necessariamente. Ele pode tratar dados para a <b>execução de políticas públicas</b> e o cumprimento de obrigação legal, sem consentimento (arts. 7º e 23).", "tema": "concurso"}, {"id": "569c62eca0", "f": "IA: aprendizado supervisionado × não supervisionado", "v": "<b>Supervisionado</b>: dados rotulados (classificação, regressão). <b>Não supervisionado</b>: sem rótulos (agrupamento/clustering).", "tema": "concurso"}, {"id": "c179f9befc", "f": "RAG (geração aumentada por recuperação)", "v": "Antes de responder, o LLM <b>busca documentos relevantes</b> (normalmente por embeddings) e usa esse contexto. Reduz alucinação e permite usar dados próprios.", "tema": "concurso"}, {"id": "527189c421", "f": "Overfitting × underfitting", "v": "<b>Overfitting</b>: decora o treino e vai mal em dados novos. <b>Underfitting</b>: modelo simples demais, que vai mal até no treino.", "tema": "concurso"}, {"id": "52c44fdebb", "f": "<b>actually</b>", "v": "na verdade, de fato (⚠️ não é \"atualmente\" = currently)", "tema": "concurso"}, {"id": "82818191db", "f": "<b>eventually</b>", "v": "finalmente, com o tempo (⚠️ não é \"eventualmente\" = occasionally)", "tema": "concurso"}, {"id": "703f9aab0d", "f": "<b>pretend</b>", "v": "fingir (⚠️ não é \"pretender\" = intend)", "tema": "concurso"}, {"id": "646e49972a", "f": "<b>realize</b>", "v": "perceber, dar-se conta (também pode ser realizar uma meta)", "tema": "concurso"}, {"id": "7063380ee7", "f": "<b>library</b>", "v": "biblioteca (⚠️ livraria = bookstore). Em TI: biblioteca de código", "tema": "concurso"}, {"id": "9b2a2f72c1", "f": "<b>sensible</b>", "v": "sensato (⚠️ sensível = sensitive)", "tema": "concurso"}, {"id": "a03b2c8a96", "f": "<b>assist</b>", "v": "ajudar (⚠️ assistir TV = watch)", "tema": "concurso"}, {"id": "f04a3166ea", "f": "<b>data</b>", "v": "dados (plural de datum). \"Data breach\" = vazamento de dados", "tema": "concurso"}, {"id": "d617a69a66", "f": "<b>deploy / deployment</b>", "v": "implantar / implantação em produção", "tema": "concurso"}, {"id": "c00b730df3", "f": "<b>however / therefore / although / whereas</b>", "v": "however = porém. therefore = portanto. although = embora. whereas = enquanto (contraste)", "tema": "concurso"}, {"id": "7d8092ab80", "f": "<b>may / might / must / should</b>", "v": "may/might = possibilidade. must = obrigação ou dedução forte. should = recomendação", "tema": "concurso"}, {"id": "58a43d5962", "f": "Estratégia de leitura para as 5 questões", "v": "1) Leia as <b>perguntas antes</b>. 2) Faça <i>skimming</i> (ideia geral pelo título e pela 1ª frase dos parágrafos). 3) <i>Scanning</i>: procure a palavra-chave da questão. 4) Use cognatos e não traduza tudo.", "tema": "concurso"}, {"id": "beb267bb83", "f": "Lei 8.112/90: <b>prazo para tomar posse</b>", "v": "30 dias contados da publicação do ato de provimento (art. 13, §1º)", "tema": "concurso"}, {"id": "2eb22aeff0", "f": "Lei 8.112/90: <b>prazo para entrar em exercício</b>", "v": "15 dias contados da data da posse (art. 15, §1º)", "tema": "concurso"}, {"id": "d430e2b39b", "f": "Lei 8.112/90: <b>formas de provimento</b> (7)", "v": "Nomeação, promoção, readaptação, reversão, aproveitamento, reintegração, recondução (art. 8º)<br><i>Mnemônico: NO-PRO-READ-REVER-APRO-REIN-RECON</i>", "tema": "concurso"}, {"id": "25413546e3", "f": "Lei 8.112/90: <b>estágio probatório</b>: o que diz o texto da lei × a Constituição", "v": "O texto do art. 20 fala em <b>24 meses</b>. A CF (art. 41, EC 19/98) fixa a estabilidade após <b>3 anos</b>, e a jurisprudência alinhou o estágio a 3 anos.<br>⚠️ Leia o enunciado: \"segundo a Lei 8.112\" ou \"segundo a CF/entendimento\".", "tema": "concurso"}, {"id": "79bd6319df", "f": "Lei 8.112/90: <b>validade do concurso</b>", "v": "Até 2 anos, prorrogável uma única vez por igual período (art. 12)", "tema": "concurso"}, {"id": "b780813311", "f": "Lei 8.112/90: <b>idade mínima</b> para investidura", "v": "18 anos (art. 5º, V)", "tema": "concurso"}, {"id": "459572e96c", "f": "Lei 8.112/90: <b>reintegração</b>", "v": "Reinvestidura do servidor <b>estável</b> no cargo anterior quando a demissão é invalidada (decisão administrativa ou judicial), com ressarcimento das vantagens (art. 28)", "tema": "concurso"}, {"id": "ab439bf213", "f": "Lei 8.112/90: <b>recondução</b>", "v": "Retorno do servidor <b>estável</b> ao cargo anterior por (1) inabilitação em estágio probatório de outro cargo ou (2) reintegração do anterior ocupante (art. 29)", "tema": "concurso"}, {"id": "f0849a4a03", "f": "Lei 8.112/90: <b>reversão</b>", "v": "Retorno à atividade do servidor <b>aposentado</b> (por invalidez, quando cessam os motivos, ou no interesse da administração, nas condições legais) (art. 25)", "tema": "concurso"}, {"id": "a4a6d651cc", "f": "Lei 8.112/90: <b>aproveitamento</b>", "v": "Retorno à atividade do servidor em <b>disponibilidade</b>, em cargo de atribuições e vencimentos compatíveis (art. 30)", "tema": "concurso"}, {"id": "9ba90af1a1", "f": "Lei 8.112/90: <b>readaptação</b>", "v": "Investidura em cargo compatível com a limitação física ou mental sofrida pelo servidor, verificada em inspeção médica (art. 24)", "tema": "concurso"}, {"id": "fc2a5bfb21", "f": "Lei 8.112/90: <b>formas de vacância</b>", "v": "Exoneração, demissão, promoção, readaptação, aposentadoria, posse em outro cargo inacumulável, falecimento (art. 33)", "tema": "concurso"}, {"id": "cbdcb0cbcd", "f": "Lei 8.112/90: <b>remoção</b> × <b>redistribuição</b>", "v": "<b>Remoção</b>: deslocamento do <b>servidor</b> no mesmo quadro, com ou sem mudança de sede (art. 36).<br><b>Redistribuição</b>: deslocamento do <b>cargo</b> para outro órgão ou entidade do mesmo Poder (art. 37).", "tema": "concurso"}, {"id": "bae692cf51", "f": "Lei 8.112/90: as 3 espécies de <b>vantagens</b>", "v": "Indenizações, gratificações e adicionais (art. 49). Só as <b>indenizações não</b> se incorporam ao vencimento.", "tema": "concurso"}, {"id": "59cb1303f3", "f": "Lei 8.112/90: <b>indenizações</b> (4)", "v": "Ajuda de custo, diárias, indenização de transporte, auxílio-moradia (art. 51)", "tema": "concurso"}, {"id": "3b53f4a057", "f": "Lei 8.112/90: <b>férias</b>", "v": "30 dias por ano, acumuláveis até 2 períodos em caso de necessidade do serviço. O 1º período exige 12 meses de exercício (art. 77).", "tema": "concurso"}, {"id": "8c6cbc534f", "f": "Lei 8.112/90: <b>licença para capacitação</b>", "v": "Até 3 meses a cada quinquênio de efetivo exercício, no interesse da administração (art. 87)", "tema": "concurso"}, {"id": "6cefb56281", "f": "Lei 8.112/90: <b>licença para tratar de interesses particulares</b>", "v": "Até 3 anos consecutivos, sem remuneração, a critério da administração. Não pode ser concedida a quem está em estágio probatório (art. 91).", "tema": "concurso"}, {"id": "46a311d38c", "f": "Lei 8.112/90: <b>penalidades disciplinares</b> (6)", "v": "Advertência, suspensão, demissão, cassação de aposentadoria ou disponibilidade, destituição de cargo em comissão, destituição de função comissionada (art. 127)", "tema": "concurso"}, {"id": "c8ad9b2ea4", "f": "Lei 8.112/90: prazo máximo da <b>suspensão</b>", "v": "90 dias (art. 130)", "tema": "concurso"}, {"id": "af08dae95f", "f": "Lei 8.112/90: <b>cancelamento dos registros</b> de penalidade", "v": "Advertência: após 3 anos. Suspensão: após 5 anos de efetivo exercício, se não houver nova infração (art. 131).", "tema": "concurso"}, {"id": "ac3e59be68", "f": "Lei 8.112/90: <b>abandono de cargo</b> × <b>inassiduidade habitual</b>", "v": "<b>Abandono</b>: ausência intencional por <b>mais de 30 dias consecutivos</b> (art. 138).<br><b>Inassiduidade</b>: falta sem causa justificada por <b>60 dias interpolados</b> em 12 meses (art. 139). Ambos geram demissão.", "tema": "concurso"}, {"id": "4755d830c1", "f": "Lei 8.112/90: <b>independência das responsabilidades</b>", "v": "As sanções civis, penais e administrativas podem se acumular e são independentes. A responsabilidade administrativa é afastada se a absolvição criminal <b>negar a existência do fato ou a autoria</b> (arts. 125–126).", "tema": "concurso"}, {"id": "7a3dfea288", "f": "Lei 8.112/90: <b>prescrição</b> da ação disciplinar", "v": "5 anos: demissão, cassação, destituição. 2 anos: suspensão. 180 dias: advertência (art. 142)", "tema": "concurso"}, {"id": "eb6a812d1d", "f": "Lei 8.112/90: <b>prazo da sindicância</b>", "v": "Até 30 dias, prorrogável por igual período (art. 145, parágrafo único)", "tema": "concurso"}, {"id": "f1848d0555", "f": "Lei 8.112/90: <b>resultados possíveis da sindicância</b>", "v": "Arquivamento, aplicação de advertência ou suspensão de até 30 dias, ou instauração de PAD (art. 145)", "tema": "concurso"}, {"id": "dc86df7395", "f": "Lei 8.112/90: <b>prazo do PAD</b>", "v": "Até 60 dias, prorrogável por igual período (art. 152)", "tema": "concurso"}, {"id": "c09787a16f", "f": "Lei 8.112/90: <b>comissão do PAD</b>", "v": "3 servidores <b>estáveis</b> designados pela autoridade competente. O presidente deve ocupar cargo de nível igual ou superior, ou ter escolaridade igual ou superior à do indiciado (art. 149).", "tema": "concurso"}, {"id": "7e160b77a4", "f": "Lei 8.112/90: <b>afastamento preventivo</b>", "v": "Até 60 dias, prorrogável por igual prazo, sem prejuízo da remuneração (art. 147)", "tema": "concurso"}, {"id": "b6cc9e19c6", "f": "Lei 8.112/90: <b>fases do PAD</b>", "v": "Instauração → inquérito administrativo (instrução, defesa, relatório) → julgamento (art. 151)", "tema": "concurso"}, {"id": "26289632fd", "f": "Decreto 9.283/2018: o que ele <b>regulamenta</b>", "v": "Regulamenta a Lei de Inovação (Lei 10.973/2004), alterada pelo Marco Legal de CT&I (Lei 13.243/2016), entre outras normas. Estabelece medidas de incentivo à inovação e à pesquisa científica e tecnológica.", "tema": "concurso"}, {"id": "1c93c00209", "f": "Marco Legal de CT&I: o que é <b>NIT</b>", "v": "Núcleo de Inovação Tecnológica: estrutura da ICT que gere a política de inovação (propriedade intelectual, transferência de tecnologia etc.)", "tema": "concurso"}, {"id": "a680da79ef", "f": "Marco Legal de CT&I: o que é <b>ICT</b>", "v": "Instituição Científica, Tecnológica e de Inovação: órgão ou entidade (pública ou privada sem fins lucrativos) com missão de pesquisa básica ou aplicada, ou de desenvolvimento de produtos, serviços ou processos. A UFMS é uma ICT pública.", "tema": "concurso"}, {"id": "189af29a76", "f": "Marco Legal de CT&I: <b>encomenda tecnológica</b>", "v": "Contratação, pela administração pública, de atividades de pesquisa, desenvolvimento e inovação que envolvam <b>risco tecnológico</b>, para resolver um problema técnico específico ou obter um produto, serviço ou processo inovador.", "tema": "concurso"}, {"id": "639c1097f8", "f": "CF, art. 37: <b>princípios</b> da Administração Pública", "v": "<b>LIMPE</b>: Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência", "tema": "concurso"}, {"id": "ad884adcc4", "f": "CF, art. 37: <b>validade do concurso</b>", "v": "Até 2 anos, prorrogável <b>uma vez</b> por igual período (inc. III)", "tema": "concurso"}, {"id": "e18abdbbd8", "f": "CF, art. 37: <b>cargo em comissão</b> × <b>função de confiança</b>", "v": "<b>Função de confiança</b>: exercida <b>exclusivamente</b> por servidores efetivos.<br><b>Cargo em comissão</b>: livre nomeação, com percentuais mínimos para efetivos. Ambos são só para <b>direção, chefia e assessoramento</b> (inc. V).", "tema": "concurso"}, {"id": "cb181d981b", "f": "CF, art. 37, XVI: <b>acumulação remunerada</b> permitida", "v": "Com compatibilidade de horários: <b>2 de professor</b> · <b>1 de professor + 1 técnico ou científico</b> · <b>2 de profissional de saúde</b> com profissão regulamentada.", "tema": "concurso"}, {"id": "76767f5712", "f": "CF, art. 37, §6º: <b>responsabilidade do Estado</b>", "v": "<b>Objetiva</b>: responde pelos danos que seus agentes causarem a terceiros. Tem direito de regresso contra o agente em caso de <b>dolo ou culpa</b>.", "tema": "concurso"}, {"id": "49c734b3c8", "f": "CF, art. 41: <b>estabilidade</b>", "v": "Após <b>3 anos</b> de efetivo exercício, para servidor nomeado por concurso. A <b>avaliação especial de desempenho</b> por comissão é condição para adquiri-la (§4º).", "tema": "concurso"}, {"id": "12fa601f1e", "f": "CF, art. 41: como o servidor <b>estável perde o cargo</b> (3 hipóteses)", "v": "① sentença judicial transitada em julgado · ② processo administrativo com ampla defesa · ③ avaliação periódica de desempenho, na forma de lei complementar, com ampla defesa", "tema": "concurso"}, {"id": "e4b10b1f4c", "f": "CF, art. 41, §3º: <b>cargo extinto ou declarado desnecessário</b>", "v": "O estável fica em <b>disponibilidade</b>, com remuneração <b>proporcional ao tempo de serviço</b>, até ser aproveitado.", "tema": "concurso"}, {"id": "9ed09737cf", "f": "Lei 9.784/99: prazo geral para a prática de atos", "v": "<b>5 dias</b>, salvo motivo de força maior, podendo ser dilatado até o <b>dobro</b> mediante justificação (art. 24)", "tema": "concurso"}, {"id": "ea43645c76", "f": "Lei 9.784/99: prazo para <b>decidir</b> após a instrução", "v": "Até <b>30 dias</b>, prorrogável por igual período, expressamente motivado (art. 49)", "tema": "concurso"}, {"id": "3b375c3185", "f": "Lei 9.784/99: prazo para <b>interpor recurso</b>", "v": "<b>10 dias</b>, contados da ciência ou divulgação oficial da decisão (art. 59)", "tema": "concurso"}, {"id": "20a28a7f40", "f": "Lei 9.784/99: <b>caminho do recurso</b>", "v": "Dirigido à autoridade que decidiu. Se ela não reconsiderar em <b>5 dias</b>, encaminha à autoridade superior (art. 56, §1º). Tramita por no máximo <b>3 instâncias</b> (art. 57).", "tema": "concurso"}, {"id": "9240a5dbb0", "f": "Lei 9.784/99: o que <b>não pode ser delegado</b>", "v": "① edição de atos normativos · ② decisão de recursos administrativos · ③ matérias de competência exclusiva (art. 13). Mnemônico: <b>NO-RE-EX</b>.", "tema": "concurso"}, {"id": "fc9d4f369d", "f": "Lei 9.784/99: <b>impedimento</b> × <b>suspeição</b>", "v": "<b>Impedimento</b> (art. 18): interesse direto na matéria, participação como perito/testemunha/representante, litígio com o interessado. É <b>obrigatório</b> comunicar.<br><b>Suspeição</b> (art. 20): <b>amizade íntima ou inimizade notória</b>. Pode ser arguida.", "tema": "concurso"}, {"id": "3cd4369429", "f": "Lei 9.784/99: <b>decadência</b> para anular atos favoráveis", "v": "<b>5 anos</b> da data em que foram praticados, salvo comprovada <b>má-fé</b> (art. 54)", "tema": "concurso"}, {"id": "787a5fd837", "f": "Lei 9.784/99: <b>reformatio in pejus</b>: recurso × revisão", "v": "No <b>recurso</b>, a decisão pode piorar a situação do recorrente, desde que ele seja cientificado para alegar (art. 64). Na <b>revisão</b>, não pode haver agravamento da sanção (art. 65).", "tema": "concurso"}, {"id": "cde7130687", "f": "Lei 9.784/99: <b>antecedência da intimação</b>", "v": "Mínimo de <b>3 dias úteis</b> quanto à data de comparecimento (art. 26, §2º)", "tema": "concurso"}, {"id": "a7551a1e84", "f": "Crase: regra-mãe", "v": "Crase = preposição <b>a</b> + artigo <b>a</b>. Teste: troque por uma palavra masculina. Se virar \"<b>ao</b>\", tem crase. (Vou à escola → vou ao colégio)", "tema": "concurso"}, {"id": "81d0cd886e", "f": "Casos em que a crase é <b>proibida</b>", "v": "Antes de palavra masculina, de verbo, de pronomes pessoais e da maioria dos indefinidos, entre palavras repetidas (cara a cara) e antes de \"uma\" indefinido.", "tema": "concurso"}, {"id": "c0abd0b35c", "f": "Casos de crase <b>facultativa</b>", "v": "Antes de pronome possessivo feminino (à/a minha), de nome próprio feminino (à/a Maria) e depois de \"até\" (até à/a porta).", "tema": "concurso"}, {"id": "939a4a3f49", "f": "Crase com horas e \"à moda de\"", "v": "Hora determinada: <b>às</b> 8h. \"À moda de\" subentendida: bife <b>à</b> milanesa, gol <b>à</b> Pelé.", "tema": "concurso"}, {"id": "103b76c7d6", "f": "Regência de <b>assistir</b>", "v": "No sentido de ver: assistir <b>a</b> (assisti <b>ao</b> filme). No sentido de ajudar: VTD (o médico assistiu o paciente).", "tema": "concurso"}, {"id": "2939aded14", "f": "Regência de <b>aspirar</b> e <b>visar</b>", "v": "No sentido de desejar ou objetivar: <b>a</b> (aspira <b>ao</b> cargo, visa <b>ao</b> sucesso). No sentido de cheirar ou mirar: VTD.", "tema": "concurso"}, {"id": "433bd98d1e", "f": "Regência de <b>preferir</b>", "v": "Preferir X <b>a</b> Y. ⚠️ Errado: \"preferir mais\", \"do que\".", "tema": "concurso"}, {"id": "a8847d224f", "f": "Regência de <b>implicar</b> (acarretar)", "v": "VTD: a decisão implica <b>mudanças</b> (sem \"em\").", "tema": "concurso"}, {"id": "82b456164e", "f": "Concordância com <b>haver</b> no sentido de existir", "v": "É <b>impessoal</b> e fica no singular: <b>Houve</b> problemas. <b>Deve haver</b> soluções.", "tema": "concurso"}, {"id": "c7ffd24640", "f": "Concordância com <b>fazer</b> indicando tempo", "v": "Impessoal, no singular: <b>Faz</b> dois anos.", "tema": "concurso"}, {"id": "e7441cace8", "f": "Concordância com sujeito posposto", "v": "O verbo concorda normalmente: \"<b>Chegaram</b> os documentos.\"  ⚠️ Banca adora inverter a ordem.", "tema": "concurso"}, {"id": "5d252f0e88", "f": "Concordância: \"<b>é proibido</b>\", \"<b>é necessário</b>\"", "v": "Sem determinante, fica invariável: É proibido entrada. Com determinante, concorda: É proibid<b>a</b> <b>a</b> entrada.", "tema": "concurso"}, {"id": "8ec6f39ad1", "f": "Concordância: <b>anexo, obrigado, mesmo, quite</b>", "v": "Concordam com o nome: segue<b>m</b> anex<b>as</b> as planilhas, ela disse obrigad<b>a</b>. ⚠️ \"Em anexo\" é invariável.", "tema": "concurso"}, {"id": "16858ba490", "f": "Vírgula: a <b>proibição</b> mais cobrada", "v": "Não separe <b>sujeito e verbo</b>, nem <b>verbo e complemento</b> com uma vírgula só.", "tema": "concurso"}, {"id": "53f9010e02", "f": "Vírgula <b>obrigatória</b>", "v": "Aposto explicativo, vocativo, adjunto adverbial deslocado longo, orações adjetivas <b>explicativas</b>, conjunções intercaladas e expressões explicativas (isto é, ou seja).", "tema": "concurso"}, {"id": "f636d0f3ae", "f": "Oração adjetiva <b>restritiva</b> × <b>explicativa</b>", "v": "<b>Restritiva</b>: sem vírgula, limita o sentido (Os alunos que estudaram passaram: só alguns).<br><b>Explicativa</b>: entre vírgulas, generaliza (Os alunos, que estudaram, passaram: todos).", "tema": "concurso"}, {"id": "06fd63a402", "f": "Conjunções <b>adversativas</b> × <b>conclusivas</b>", "v": "<b>Adversativas</b>: mas, porém, contudo, todavia, entretanto, no entanto.<br><b>Conclusivas</b>: logo, portanto, por isso, pois (<b>depois</b> do verbo).", "tema": "concurso"}, {"id": "23d4b6d9a2", "f": "\"Pois\" explicativo × conclusivo", "v": "<b>Antes</b> do verbo = explicativo (Saia, pois vai chover). <b>Depois</b> do verbo, entre vírgulas = conclusivo (Estudou muito, passará, pois, no concurso).", "tema": "concurso"}, {"id": "46722f5dce", "f": "Mecanismos de <b>coesão</b>", "v": "Referencial (pronomes, sinônimos, elipse) e sequencial (conectivos). Pergunta típica: \"o termo X retoma o quê?\"", "tema": "concurso"}, {"id": "55e0c8f6ab", "f": "Interpretação: a <b>pegadinha clássica</b>", "v": "Alternativas que extrapolam (dizem mais do que o texto), reduzem ou contradizem. A correta costuma ser a que fica <b>dentro do texto</b>.", "tema": "concurso"}, {"id": "1254bbd820", "f": "Quando a <b>conjunção</b> p ∧ q é verdadeira?", "v": "Só quando <b>as duas</b> são V", "tema": "concurso"}, {"id": "0599ef4f19", "f": "Quando a <b>disjunção</b> p ∨ q é falsa?", "v": "Só quando <b>as duas</b> são F", "tema": "concurso"}, {"id": "57f2d29f5f", "f": "Quando a <b>condicional</b> p → q é falsa?", "v": "Só no caso <b>V → F</b> (\"Vera Fischer é falsa\")", "tema": "concurso"}, {"id": "b3cd334704", "f": "Quando a <b>bicondicional</b> p ↔ q é verdadeira?", "v": "Quando p e q têm o <b>mesmo valor</b> (V,V ou F,F)", "tema": "concurso"}, {"id": "e2d67b3838", "f": "Quando a <b>disjunção exclusiva</b> p ⊻ q (\"ou p ou q\") é verdadeira?", "v": "Quando p e q têm valores <b>diferentes</b>", "tema": "concurso"}, {"id": "a1a9606d0b", "f": "Número de linhas de uma tabela-verdade com n proposições simples", "v": "2ⁿ", "tema": "concurso"}, {"id": "82b502d263", "f": "Negação de <b>p ∧ q</b>", "v": "¬p ∨ ¬q (troca ∧ por ∨ e nega as duas, De Morgan)", "tema": "concurso"}, {"id": "14d1d2bd14", "f": "Negação de <b>p ∨ q</b>", "v": "¬p ∧ ¬q (De Morgan)", "tema": "concurso"}, {"id": "77931efad9", "f": "Negação de <b>p → q</b>", "v": "<b>p ∧ ¬q</b> (\"mantém a 1ª E nega a 2ª\")<br>⚠️ Não é ¬p → ¬q!", "tema": "concurso"}, {"id": "e5f87b2ff2", "f": "Negação de <b>p ↔ q</b>", "v": "p ⊻ q (ou p ↔ ¬q)", "tema": "concurso"}, {"id": "c7f27fbed7", "f": "Equivalências da condicional <b>p → q</b>", "v": "① <b>¬q → ¬p</b> (contrapositiva: inverte e nega)<br>② <b>¬p ∨ q</b> (nega a 1ª OU mantém a 2ª)", "tema": "concurso"}, {"id": "09a24ce6d3", "f": "Tautologia × contradição × contingência", "v": "<b>Tautologia</b>: sempre V. <b>Contradição</b>: sempre F. <b>Contingência</b>: às vezes V, às vezes F.", "tema": "concurso"}, {"id": "fe65398dc4", "f": "Negação de \"<b>Todo</b> A é B\"", "v": "\"<b>Algum</b> A <b>não</b> é B\"", "tema": "concurso"}, {"id": "86d2b5635f", "f": "Negação de \"<b>Algum</b> A é B\"", "v": "\"<b>Nenhum</b> A é B\"", "tema": "concurso"}, {"id": "a998621d9c", "f": "Negação de \"<b>Nenhum</b> A é B\"", "v": "\"<b>Algum</b> A é B\"", "tema": "concurso"}, {"id": "f28a3b1df4", "f": "Argumento <b>válido</b>: definição", "v": "Se todas as premissas forem V, a conclusão é <b>obrigatoriamente</b> V. A validade depende da forma, não da verdade das premissas.", "tema": "concurso"}, {"id": "0353250be2", "f": "Modus ponens × modus tollens", "v": "<b>Ponens</b>: p→q, p ⊢ q.<br><b>Tollens</b>: p→q, ¬q ⊢ ¬p.", "tema": "concurso"}, {"id": "c947dd4844", "f": "Falácias clássicas da condicional", "v": "<b>Afirmar o consequente</b> (p→q, q ⊢ p) e <b>negar o antecedente</b> (p→q, ¬p ⊢ ¬q): os dois são <b>inválidos</b>.", "tema": "concurso"}, {"id": "db47756651", "f": "Princípio fundamental da contagem", "v": "Se uma etapa tem m modos e outra tem n modos, independentes, o total é <b>m × n</b>", "tema": "concurso"}, {"id": "9844f05f80", "f": "Permutação simples", "v": "Pₙ = n! (ordenar <b>todos</b> os n elementos)", "tema": "concurso"}, {"id": "23ba7d7e9c", "f": "Arranjo × combinação: como decidir", "v": "<b>A ordem importa?</b> Sim → arranjo A(n,p) = n!/(n−p)!. Não → combinação C(n,p) = n!/[p!(n−p)!].<br>Teste: troque dois elementos de lugar. Se mudou o resultado, é arranjo.", "tema": "concurso"}, {"id": "78bffa57c4", "f": "Permutação com repetição (ex.: anagramas de ARARA)", "v": "n!/(a!·b!·…). ARARA = 5!/(3!·2!) = 10", "tema": "concurso"}, {"id": "8ff28126fb", "f": "Probabilidade clássica", "v": "P = casos favoráveis / casos possíveis (0 ≤ P ≤ 1)", "tema": "concurso"}, {"id": "f403b1c81a", "f": "Probabilidade da <b>união</b> P(A ∪ B)", "v": "P(A) + P(B) − P(A ∩ B)", "tema": "concurso"}, {"id": "7e20c51722", "f": "Eventos <b>independentes</b>: P(A ∩ B)", "v": "P(A) · P(B)", "tema": "concurso"}, {"id": "fb4a525fc6", "f": "Probabilidade do <b>complementar</b>", "v": "P(não A) = 1 − P(A). Dica: \"pelo menos um\" → 1 − P(nenhum)", "tema": "concurso"}, {"id": "c1abe9dcad", "f": "Aumentos ou descontos <b>sucessivos</b>", "v": "Multiplique os fatores: +20% e depois −20% = 1,2 × 0,8 = 0,96 → <b>−4%</b> (não volta ao original!)", "tema": "concurso"}];
</script>

  titulo: "Conectivos e tabela-verdade",

    ["∧ (e)", ["V só se as duas forem V"]],
    ["∨ (ou)", ["F só se as duas forem F"]],
    ["→ (se…então)", ["F só em V → F", "\"Vera Fischer é falsa\""]],
    ["↔ (se e somente se)", ["V quando iguais"]],
    ["⊻ (ou…ou)", ["V quando diferentes"]],
    ["Tabela", ["2ⁿ linhas", "Tautologia, contradição, contingência"]] ] },
  recupere: ["O que torna uma condicional (p → q) falsa?", "Quantas linhas tem a tabela-verdade de 3 proposições?", "Qual a diferença entre ∨ e ⊻?"],
  blocos: [
    { t: "Proposição", html: `<p>É uma frase declarativa que pode ser <b>V ou F</b>, nunca as duas coisas. <i>"Campo Grande fica em MS"</i> é proposição. Já <i>"Que horas são?"</i> e <i>"Estude!"</i> não são.</p><p class="dica">Sentença aberta (<i>"x &gt; 5"</i>) não é proposição até você dar um valor para x.</p>` },
    { t: "As 5 regras de ouro", html: `<table class="tab"><tr><th>Conectivo</th><th>Lê-se</th><th>Situação especial</th></tr>
      <tr><td>p ∧ q</td><td>p e q</td><td><b>V</b> só quando p=V e q=V</td></tr>
      <tr><td>p ∨ q</td><td>p ou q</td><td><b>F</b> só quando p=F e q=F</td></tr>
      <tr><td>p → q</td><td>se p, então q</td><td><b>F</b> só no caso V → F</td></tr>
      <tr><td>p ↔ q</td><td>p se e somente se q</td><td><b>V</b> quando têm o mesmo valor</td></tr>
      <tr><td>p ⊻ q</td><td>ou p ou q</td><td><b>V</b> quando têm valores diferentes</td></tr></table>` },
    { t: "Por que a condicional é estranha", html: `<p>Pense numa promessa: <i>"Se chover, eu levo guarda-chuva"</i>. A única forma de <b>quebrar a promessa</b> é chover (V) e você não levar (F). Se não chover, você não mentiu, leve ou não o guarda-chuva.</p>` },
    { t: "Classificação", html: `<p><b>Tautologia</b>: sempre V (ex.: p ∨ ¬p). <b>Contradição</b>: sempre F (ex.: p ∧ ¬p). <b>Contingência</b>: depende dos valores.</p><p>Número de linhas da tabela: <b>2ⁿ</b>, em que n é o número de proposições simples. Com 3 proposições, são 8 linhas.</p>` }

    { q: "Quantas linhas tem a tabela-verdade de (p ∧ q) → (r ∨ s)?", o: ["4", "8", "16", "32"], a: 2, e: "4 proposições simples: 2⁴ = 16." },
    { q: "\"Ou João estuda, ou João trabalha\" (exclusivo) é verdadeira quando:", o: ["Ele faz as duas coisas", "Ele não faz nenhuma", "Ele faz exatamente uma", "Sempre"], a: 2, e: "A disjunção exclusiva é V quando os valores são diferentes." },

  ],

};

  const extras = (BIB.temas || []).map(t => BIB.anexos && BIB.anexos[t.id] ? { ...t, disciplinas: t.disciplinas.concat(BIB.anexos[t.id]) } : t);
  const user = st.temasUser.map(t => BIB.anexos && BIB.anexos[t.id] ? { ...t, disciplinas: t.disciplinas.concat(BIB.anexos[t.id]) } : t);

}
function tema(id) { return todosTemas().find(t => t.id === id); }

  const r = tot ? ac / tot : null; const ant = i.int || 0; let novo;

  else if (r >= .8) novo = Math.round(ant * 2.5); else if (r >= .6) novo = Math.round(ant * 1.5); else novo = 1;

const NOVOS_DIA = 20;

function filaCartoes(tid) {
  if (st.novos.data !== hojeStr()) st.novos = { data: hojeStr(), n: 0 };

  for (const c of cardsDoTema(tid)) { const s = st.cards[c.id]; if (!s || !s.S) novos.push(c); else if (s.prox <= h) venc.push(c); }

/* FSRS-4.5: modelo de memória DSR (dificuldade, estabilidade, recuperabilidade) do projeto open-spaced-repetition,

const FSRS = {
  W: [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755],
  DECAY: -0.5, FACTOR: 19 / 81,
  R(t, S) { return Math.pow(1 + this.FACTOR * t / S, this.DECAY); },
  D0(g) { return Math.min(10, Math.max(1, this.W[4] - (g - 3) * this.W[5])); },

    const W = this.W; let S, D;

  const ant = st.cards[c.id]; const novo = !ant || !ant.S; const g = nota + 1;

/* ============ próximo passo ============ */

  passos.push({ id: "cartoes", titulo: fila.length ? `Aquecer: ${fila.length} cartões` : "Aquecer: cartões em dia", sub: "10 min de revisão espaçada", href: "#revisar", vazio: !fila.length });

  const p = tema(st.principal) || TEMAS[0];
  const prox = proximaAula(p);
  if (prox) passos.push({ id: "aula-" + prox.id, titulo: aula(prox.id) ? aula(prox.id).titulo : prox.t, sub: `${p.nome} · aula principal`, href: aula(prox.id) ? "#aula-" + prox.id : "#tema-" + p.id, sem: !aula(prox.id) });

  const rot = outros[(new Date().getDate()) % Math.max(outros.length, 1)];
  const pref = outros.find(t => proximaAula(t) && aula(proximaAula(t).id) && t.id === (st.recompensa || "fisioterapia")) || outros.find(t => proximaAula(t) && aula(proximaAula(t).id)) || rot;
  if (pref) { const r = proximaAula(pref); if (r) passos.push({ id: "aula-" + r.id, titulo: aula(r.id) ? aula(r.id).titulo : r.t, sub: `${pref.nome} · recompensa (depois da principal)`, href: aula(r.id) ? "#aula-" + r.id : "#tema-" + pref.id, sem: !aula(r.id) }); }

}

function validarAula(txt) {
  let s = txt.trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim(); const i = s.indexOf("{"), j = s.lastIndexOf("}"); if (i < 0 || j < 0) throw new Error("Não achei um JSON. Copie a resposta inteira, das chaves { até }.");
  let a; try { a = JSON.parse(s.slice(i, j + 1)); } catch (e) { throw new Error("O JSON está quebrado: " + e.message + ". Peça à IA: 'reenvie só o JSON válido'."); }
  for (const k of ["titulo", "mapa", "blocos", "quiz"]) if (!a[k]) throw new Error(`Falta o campo "${k}".`);
  a.recupere ||= []; a.ideia ||= ""; a.fontes ||= []; if (!Array.isArray(a.mapa.ramos)) throw new Error("mapa.ramos precisa ser uma lista.");
  a.quiz = a.quiz.filter(q => q.q && Array.isArray(q.o) && Number.isInteger(q.a) && q.a < q.o.length);
  if (a.widget && !["parear", "ordenar"].includes(a.widget)) a.widget = null;
  if (a.widget === "parear" && !Array.isArray(a.parear)) a.widget = null; if (a.widget === "ordenar" && !Array.isArray(a.ordenar)) a.widget = null;
  return a;
}
function limparHTML(html) {
  const ok = new Set(["P", "B", "I", "U", "STRONG", "EM", "UL", "OL", "LI", "TABLE", "TR", "TD", "TH", "THEAD", "TBODY", "BR", "KBD", "SPAN", "DIV", "SMALL", "CODE", "A", "H4", "SUP", "SUB"]);
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html"); const raiz = doc.body.firstChild;
  raiz.querySelectorAll("script,style,iframe,object,embed,link,meta").forEach(n => n.remove());
  (function limpa(n) { [...n.children].forEach(c => { if (!ok.has(c.tagName)) { c.replaceWith(...c.childNodes); return limpa(n); } [...c.attributes].forEach(at => { if (!["class", "href"].includes(at.name) || (at.name === "href" && !/^https?:/i.test(at.value))) c.removeAttribute(at.name); }); if (c.tagName === "A") c.setAttribute("target", "_blank"); limpa(c); }); })(raiz);
  return raiz.innerHTML;
}

function buscarLocal(q) {
  q = q.toLowerCase(); const out = [];
  for (const [tid, txt] of Object.entries(BIB.textos || {})) { const i = txt.toLowerCase().indexOf(q); if (i < 0) continue; const ini = Math.max(0, i - 90); const info = acharTopico(tid);
    out.push({ topico: tid, titulo: info ? info.top.t : tid, trecho: (ini ? "…" : "") + txt.slice(ini, i + 160).replace(/\n/g, " ") + "…", ocorrencias: txt.toLowerCase().split(q).length - 1 }); }
  return out.sort((a, b) => b.ocorrencias - a.ocorrencias).slice(0, 30);
}

function wParear(box, a) {
